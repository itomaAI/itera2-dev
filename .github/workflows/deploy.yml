name: Deploy static content to Pages

on:
  push:
    branches: ['main'] # デプロイ対象のブランチ。master の場合は変更してください

# GITHUB_TOKEN の権限設定
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Google Analytics のタグは配信時にだけ差し込む（ソースには無い）。
      # リポジトリ変数 GA_MEASUREMENT_ID（Settings → Secrets and variables → Actions → Variables）が空なら何もしない
      - name: Inject Google Analytics tag (deploy-time only)
        if: ${{ vars.GA_MEASUREMENT_ID != '' }}
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: node scripts/inject_ga.js dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite の出力先フォルダ

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
