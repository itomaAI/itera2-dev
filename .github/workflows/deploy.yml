name: Deploy static content to Pages

on:
  push:
    branches: ['main'] # デプロイ対象のブランチ。master の場合は変更してください

# GITHUB_TOKEN の権限設定
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # 組み立てて、成果物を上げるまで
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Google Analytics のタグは配信時にだけ差し込む（ソースには無い）。
      # リポジトリ変数 GA_MEASUREMENT_ID（Settings → Secrets and variables → Actions → Variables）が空なら何もしない
      - name: Inject Google Analytics tag (deploy-time only)
        if: ${{ vars.GA_MEASUREMENT_ID != '' }}
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: node scripts/inject_ga.js dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite の出力先フォルダ

  # 配信だけ。アップロードと同じジョブの中で続けて配信すると、上げた直後の成果物がまだ一覧に載っておらず、
  # 「Found 0 artifact(s)」で落ちることがある（actions/deploy-pages#451）。ジョブを分けておけば、
  # 落ちたときもこのジョブだけを流し直せる（成果物は 1 つのまま。消してから流し直す手順が要らない）。
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
