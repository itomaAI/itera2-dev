                   <button onclick="quick('意図', false)" class="text-xs px-3 py-1.5 rounded bg-hover transition" title="意図はほぼ不変。足すのは慎重に">意図に足す</button>`
                  : `<button onclick="quick('追加要望', true)" class="text-xs px-3 py-1.5 rounded bg-hover hover:bg-primary hover:text-text-inverted transition font-medium">要望・修正を追加して伝える</button>
                   <button onclick="quick('確認事項', true)" class="text-xs px-3 py-1.5 rounded bg-hover hover:bg-primary hover:text-text-inverted transition font-medium">質問に回答する</button>
                   <button onclick="quick('追加要望', false)" class="text-xs px-3 py-1.5 rounded bg-hover transition">メモだけ</button>`
              }
              ${
                parseRecaps(n.body, logSection(n), recapName(n)).some((r) => !r.from || r.from === n.meta.id)
                  ? `<button onclick="appendToRecap()" class="text-xs px-3 py-1.5 rounded bg-hover hover:bg-success hover:text-text-inverted transition font-medium" title="${esc(recapName(n))}の枠の中に書き足します。未解決が解決したときはここへ（枠の外に書くと親へ運ばれません）">${esc(recapName(n))}に追記（解決など）</button>`
                  : ''
              }
            </div>
          </div>

          ${!proj && n.meta.status === 'inbox' ? `<button onclick="send()" class="mt-5 w-full py-3 rounded-lg bg-primary text-text-inverted font-bold hover:bg-primary/90 shadow transition">この依頼を Itera に送る</button>` : ''}
          ${!proj && n.meta.status === 'review' ? `<button onclick="setStatus('done')" class="mt-5 w-full py-3 rounded-lg bg-success text-text-inverted font-bold hover:opacity-90 shadow transition" title="このときレポートと成果物が所属プロジェクトの履歴へ運ばれます（上位タスクへは 1 行）">確認したので完了にする（→ 親へ運ぶ）</button>` : ''}
        </div>`;

        if (prevId === n.meta.id) restoreDraft(draft);
        lastRenderedId = n.meta.id;
      }

      function renderAll() {
        renderViews();
        renderList();
        renderDetail();
      }

      // ============================================================
      // 操作
      // ============================================================
      function rawCurrent() {
        return nodes.find((x) => x.meta.id === selectedId);
      }

      function flushEditor(t) {
        if (!t) return t;
        const title = DOM('f-title');
        const status = DOM('f-status');
        const pri = DOM('f-priority');
        const sched = DOM('f-scheduled');
        const body = DOM('f-body');
        if (title) t.meta.title = title.value.trim() || '(無題)';
        if (status) t.meta.status = status.value;
        if (pri) t.meta.priority = pri.value;
        if (sched) t.meta.scheduled = sched.value || '';
        if (editing && body) t.body = body.value;
        return t;
      }
      function current() {
        return flushEditor(rawCurrent());
      }

      async function commitIfEditing() {
        if (!editing) return true;
        const t = rawCurrent();
        const box = DOM('f-body');
        if (!t || !box || box.value === t.body) return true;
        t.body = box.value;
        return !!(await Store.saveBodyChecked(t));
      }
      async function commitAll(t) {
        if (!t) return null;
        return editing ? await Store.saveBodyChecked(t) : await Store.saveMetaOnly(t);
      }

      function newBody(kind) {
        if (kind === 'project') {
          return [
            '## 意図',
            '',
            '（なぜこの枝が在るのか。**あなたが置く。**ほぼ不変。これが圧縮の鍵になる。',
            '　満たされて消えるものは意図ではない。それはタスクの依頼）',
            '',
            '## 文脈',
            '',
            '（外の世界のうち、この枝に効くもの。Itera が畳む。源ごとに ### を立てる）',
            '',
            '## 履歴',
            '',
            '## 成果物',
            '',
          ].join('\n');
        }
        return [
          '## 依頼',
          '',
          '（何が満たされたら終わりか）',
          '',
          '## 計画',
          '',
          '（Itera が着手時に分解して書く。☐ をクリックすると 未着手→作業中→完了）',
          '',
          '## 追加要望',
          '',
          '## 進捗',
          '',
          '## 確認事項',
          '',
          '## 成果物',
          '',
        ].join('\n');
      }

      window.setView = (k) => {
        view = k;
        lastTreeScrollId = null;
        renderAll();
      };
      window.toggleClosed = () => {
        showClosed = !showClosed;
        renderAll();
      };
      window.toggleTasks = () => {
        showTasks = !showTasks;
        renderAll();
      };
      window.toggleNode = (id) => {
        collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
        saveUiState();
        renderList();
      };
      window.select = async (id) => {
        if (!(await commitIfEditing())) return;
        // ★ ここで全件読み直さない。札を選ぶだけなら手元の nodes で足りる（全件は 96 枚で約 300ms）。
        //   外の変更は 4 秒ごとの監視が差分で取り込む（2026-08-24）。
        selectedId = id;
        editing = false;
        editBase = null;
        clearNotice();
        // ★ 選んだ札までの道を開く。畳んだ既定と組み合わさると、
        //   これが無い限り「選んだのに画面に出ない」が起きる（T-0202）。
        if (openPathTo(id)) saveUiState();
        renderAll();
      };
      window.toggleEdit = async () => {
        if (!(await commitIfEditing())) return;
        editing = !editing;
        // toggleEdit は refresh() を通らないので、ここでも基準を置く（置き忘れると素通しで上書きになる）。
        const t = rawCurrent();
        editBase = editing && t ? { id: t.meta.id, body: t.body } : null;
        renderDetail();
      };

      /**
       * 作った直後に題の入力欄へ焦点を移す。
       * ★ 見た目の親切ではない。**題を決めずに置かれた札は、出来事の行に「(無題)」を焼き付ける**
       *   （履歴は書き換えないので後から直せない）。入り口で題を書かせるのがいちばん安い（T-0002）。
       */
      function focusTitle() {
        const el = DOM('f-title');
        if (el) {
          el.focus();
          el.select();
        }
      }

      window.newProject = async () => {
        const id = Store.nextId('project');
        await Store.create(
          { id, kind: 'project', title: '(無題のプロジェクト)', status: 'live', created: nowIso(), refs: [] },
          newBody('project'),
        );
        selectedId = id;
        editing = true;
        view = 'tree';
        await refresh();
        focusTitle();
      };

      // 分岐。承認は要らない ── 切れないと、要らない事実が親に溜まる。
      window.fork = async () => {
        const p = rawCurrent();
        if (!p || !isProject(p)) return;
        if (!(await commitIfEditing())) return;
        const id = Store.nextId('project');
        await Store.create(
          { id, kind: 'project', title: '(無題の枝)', status: 'live', created: nowIso(), parent: p.meta.id, refs: [] },
          newBody('project'),
        );
        await Store.append(p.meta.id, '履歴', `- ${stamp()} 分岐: ${id}「(無題の枝)」`);
        await Store.append(id, '履歴', `- ${stamp()} 分岐: ${p.meta.id}「${p.meta.title}」から切り出し`);
        selectedId = id;
        editing = true;
        await refresh();
        focusTitle();
      };

      // 起票。タスクは所属プロジェクトの下に立つ。T→P の辺は無いので、親は必ずプロジェクト。
      window.openTask = async () => {
        const p = rawCurrent();
        if (!p || !isProject(p)) return;
        if (!(await commitIfEditing())) return;
        const id = Store.nextId('task');
        await Store.create(
          {
            id,
            kind: 'task',
            title: '(無題のタスク)',
            status: 'inbox',
            priority: 'normal',
            scheduled: '',
            created: nowIso(),
            parent: p.meta.id,
            refs: [],
          },
          newBody('task'),
        );
        await Store.append(p.meta.id, '履歴', `- ${stamp()} 起票: ${id}「(無題のタスク)」`);
        selectedId = id;
        editing = true;
        await refresh();
        focusTitle();
      };

      // 分解。親がタスクのときの「起票」の別名。
      window.decompose = async () => {
        const t = rawCurrent();
        if (!t || isProject(t)) return;
        if (!(await commitIfEditing())) return;
        const id = Store.nextId('task');
        await Store.create(
          {
            id,
            kind: 'task',
            title: '(無題のサブタスク)',
            status: 'inbox',
            priority: t.meta.priority || 'normal',
            scheduled: '',
            created: nowIso(),
            parent: t.meta.id,
            refs: [],
          },
          newBody('task'),
        );
        await Store.append(t.meta.id, '進捗', `- ${stamp()} 分解: ${id}「(無題のサブタスク)」`);
        selectedId = id;
        editing = true;
        await refresh();
        focusTitle();
      };

      /**
       * 継承。フェーズを切る。
       * **子の parent は書き換えない。**前任を指したまま、系譜の解決側（childrenOf）で引き継ぐ。
       * 書き換えると「その子がどちらの世代の下で生まれたか」が消える。
       */
      window.supersede = async () => {
        const p = rawCurrent();
        if (!p || !isProject(p)) return;
        const res = await AppUI.showMessageBox({
          title: 'フェーズを切る（継承）',
          message: `${p.meta.id}「${p.meta.title}」を凍結し、後継のプロジェクトを作ります。子はそのまま後継が引き継ぎます（辺は書き換えません）。前任は消えません。`,
          type: 'warning',
          buttons: [
            { label: 'キャンセル', value: false, style: 'normal', isCancel: true },
            { label: '継承する', value: true, style: 'primary', isDefault: true },
          ],
        });
        if (!res || res.action !== true) return;
        if (!(await commitIfEditing())) return;
        const id = Store.nextId('project');
        await Store.create(
          {
            id,
            kind: 'project',
            title: p.meta.title + '（第2期）',
            status: 'live',
            created: nowIso(),
            parent: p.meta.parent || '',
            supersedes: p.meta.id,
            refs: Array.isArray(p.meta.refs) ? p.meta.refs : [],
          },
          newBody('project'),
        );
        await Store.append(id, '履歴', `- ${stamp()} 継承: ${p.meta.id}「${p.meta.title}」を継いだ`);
        await Store.append(p.meta.id, '履歴', `- ${stamp()} 継承: ${id}へ継いだ（凍結）`, (fresh) => {
          fresh.meta.status = 'superseded';
        });
        selectedId = id;
        editing = true;
        await refresh();
        await notifyAI(
          `Loom: ${p.meta.id}「${p.meta.title}」から ${id} へ継承しました。後継の ## 意図 は山内さんが書きます。` +
            `そのうえで、前任の履歴を全部読み、意図に照らして畳んだものを後継の ## 文脈 に書いてください（文脈生成）。`,
        );
      };

      /** 転記（上げる）。**畳まない。**子の総括をそのまま親の履歴へ載せる。 */
      window.pushUp = async () => {
        const n0 = rawCurrent();
        if (!n0) return;
        if (!(await commitIfEditing())) return;
        // ★ 運ぶ前に読み直す（理由は complete と同じ）。
        const n = await freshForTransfer(n0);
        if (!n) return;
        const pid = n.meta.parent;
        if (!pid || !byId(pid)) {
          AppUI.notify('親がありません', 'warning');
          return;
        }
        const rs = pendingRecaps(n);
        if (!rs.length) {
          AppUI.notify(`まだ渡していない${recapName(n)}がありません`, 'warning');
          return;
        }
        const block = [
          `- ${stamp()} 転記: ${n.meta.id}「${n.meta.title}」より（${rs[0].at} 以降の${recapName(n)} ${rs.length} 件）`,
        ]
          .concat(rs.map((r) => `\n### ${recapName(n)} ${r.at}（${n.meta.id}）\n${r.text}`))
          .join('\n');
        const f = await Store.append(pid, isProject(byId(pid)) ? '履歴' : '進捗', block);
        if (!f) return;
        // 「どこまで渡したか」を書く。時刻ではなく総括の位置で残すこと（時計のずれで壊れないように）。
        await Store.append(
          n.meta.id,
          logSection(n),
          `- ${stamp()} 転記: ${pid}「${byId(pid).meta.title}」へ（${rs[rs.length - 1].at} まで／${rs.length} 件）`,
        );
        AppUI.notify(`${pid} へ ${rs.length} 件を転記しました`, 'info', 2500);
        await refresh();
      };

      /** 終結（合流）。転記して役目を終える。**一緒になるのは、この最後の一回だけ。** */
      window.closeMerge = async () => {
        const n0 = rawCurrent();
        if (!n0 || !isProject(n0)) return;
        if (!(await commitIfEditing())) return;
        // ★ 確認ダイアログより前に読み直す。件数を古い写しから数えると、
        //   利用者は「0 件」を見て納得したのに実際には未送の総括が置き去りになる。
        const n = await freshForTransfer(n0);
        if (!n) return;
        const rs = pendingRecaps(n);
        const res = await AppUI.showMessageBox({
          title: '終結（合流）',
          message: `${n.meta.id}「${n.meta.title}」を親へ合流させ、凍結します。未送の総括 ${rs.length} 件を転記します。`,
          type: 'warning',
          buttons: [
            { label: 'キャンセル', value: false, style: 'normal', isCancel: true },
            { label: '合流する', value: true, style: 'primary', isDefault: true },
          ],
        });
        if (!res || res.action !== true) return;
        if (rs.length) await pushUp();
        await mutate(n.meta.id, (fresh) => {
          fresh.body = appendToSection(fresh.body, '履歴', `- ${stamp()} 完了: 合流して凍結`);
          fresh.meta.status = 'frozen';
          return true;
        });
        await refresh();
      };

      /**
       * もう親へ運ばれたか。
       *
       * ★ 印を札の側に作らない。**証拠は親の履歴にある** ——
       *   運ぶときに親へ `- <日時> 完了: <id>「…」` を書いており、これがそのまま印になる。
       *   新しい印を導入すると、**旧仕様（完了で運んでいた頃）に閉じた札を拾えない**。
       *   いま `review` に居る札は既に運ばれているので、確認した瞬間に二度目が載ってしまう。
       */
      function deliveredAlready(t) {
        const hit = (p) =>
          !!p &&
          parseEntries(p.body, logSection(p)).some((e) => e.verb === '完了' && String(e.text).includes(t.meta.id));
        return hit(owningProject(t)) || hit(byId(t.meta.parent));
      }

      /**
       * 親へ運ぶ。レポート本体は **所属プロジェクトの履歴** へ、**上位タスクへは 1 行**。
       * 全部をプロジェクトへ上げない ── これが履歴の粒度を決める唯一のつまみ。
       *
       * ★ 運ぶのは **`done` になる瞬間（＝山内さんの確認）**。完了ボタンでは運ばない（T-0203）。
       *   確認より前に載せると、確認して直したことが親に届かない。
       * ★ **ちょうど一度だけ。** 二度目は運ばずに `skipped` で返す。
       */
      async function deliverToParent(id, opts) {
        const o = opts || {};
        const t0 = byId(id);
        if (!t0) return { ok: false, id, reason: `${id} は板にありません` };
        if (isProject(t0)) return { ok: false, id, reason: 'プロジェクトはここでは運びません（転記 ↑ を使う）' };
        // ★ 写しではなくファイルから（T-0196 → T-0197）。
        const t = await freshForTransfer(t0);
        if (!t) return { ok: false, id, reason: 'ファイルを読み直せませんでした' };
        if (deliveredAlready(t))
          return { ok: true, id: t.meta.id, skipped: true, reports: 0, to: null, reason: '既に運ばれています' };

        const rs = parseRecaps(t.body, '進捗', 'レポート');
        const artifacts = sectionText(t.body, '成果物');
        const parent = byId(t.meta.parent);
        const own = owningProject(t);
        const parentIsTask = parent && !isProject(parent);
        if (!rs.length && !o.force)
          return {
            ok: false,
            id: t.meta.id,
            reports: 0,
            artifacts: !!artifacts,
            empty: true,
            to: null,
            reason: 'レポートがありません',
          };

        const last = rs.length ? rs[rs.length - 1] : null;
        // プロジェクトの履歴へ：レポート本体
        if (own) {
          const block = [`- ${stamp()} 完了: ${t.meta.id}「${t.meta.title}」${artifacts ? ' ／ 成果物あり' : ''}`]
            .concat(last ? [`\n### レポート ${last.at}（${t.meta.id}）\n${last.text}`] : [])
            .concat(artifacts ? [`\n**成果物**\n${artifacts}`] : [])
            .join('\n');
          await Store.append(own.meta.id, '履歴', block);
        }
        // 上位タスクへは 1 行だけ
        if (parentIsTask) {
          const one = artifacts
            .split('\n')
            .filter((l) => l.trim())
            .slice(0, 1)
            .join('')
            .replace(/^- /, '');
          await Store.append(
            parent.meta.id,
            '進捗',
            `- ${stamp()} 完了: ${t.meta.id}「${t.meta.title}」${one ? ' ／ 成果物: ' + one : ''}`,
          );
        }
        return {
          ok: true,
          id: t.meta.id,
          reports: rs.length,
          artifacts: !!artifacts,
          empty: !rs.length,
          to: own ? own.meta.id : null,
        };
      }

      /**
       * 完了 —— **確認へ回すだけ。運ばない**（T-0203）。
       *
       * 親へ運ぶのは `done` になる瞬間（山内さんの「確認したので完了にする」）。
       * ここで運ぶと、**確認の前に親へ載る**ので、確認して解決したことが親に反映されない。
       *
       * @param {string} [id] 対象の札。省略すると「画面で選択中の札」。
       *   ★ 自律呼び出し（inject_js）で id を省くと、選択を取り違えて**別の札を閉じる**（T-0201）。
       * @param {object} [opts] `{ force: true }` でレポートが無くても回す。
       * @returns {{ok:boolean, id:string, reports:number, artifacts:boolean, empty:boolean, delivered:boolean, reason?:string}}
       */
      window.complete = async (id, opts) => {
        const o = opts || {};
        const t0 = id ? byId(id) : rawCurrent();
        if (!t0) return { ok: false, id: id || null, reason: id ? `${id} は板にありません` : '札が選ばれていません' };
        if (isProject(t0)) return { ok: false, id: t0.meta.id, reason: 'プロジェクトは完了にしません' };
        // 編集中の本文を保存するのは「いま画面に出ている札」のときだけ。
        // 別の札を id で閉じるときに commitIfEditing を通すと、
        // 画面で編集中の**無関係な札**の本文を巻き込んで保存してしまう。
        if (t0.meta.id === selectedId && !(await commitIfEditing()))
          return { ok: false, id: t0.meta.id, reason: '編集中の本文を保存できませんでした' };
        // ★ 写しではなくファイルから始める（T-0196 → T-0197）。
        const t = await freshForTransfer(t0);
        if (!t) return { ok: false, id: t0.meta.id, reason: 'ファイルを読み直せませんでした' };

        const rs = parseRecaps(t.body, '進捗', 'レポート');
        const artifacts = sectionText(t.body, '成果物');

        if (!rs.length && !o.force) {
          // ★ 呼ばれ方で分ける。
          //   画面から押された（id 省略）なら、人がそこに居るので訊く。
          //   id 指定＝自律呼び出しなら**訊かない** —— 相手の画面にダイアログを出して応答を待つと、
          //   私の側は RPC が切れるまで固まる（2026-08-24 / T-0191 で実際に起きた）。
          if (id)
            return {
              ok: false,
              id: t.meta.id,
              reports: 0,
              artifacts: !!artifacts,
              empty: true,
              delivered: false,
              reason: 'レポートがありません（確認へ回していません）',
            };
          const go = await AppUI.showMessageBox({
            title: 'レポートがありません',
            message:
              'レポート（決定・却下・未解決）がまだ書かれていません。書かずに確認へ回しますか？（Itera に頼むこともできます）',
            type: 'warning',
            buttons: [
              { label: 'やめる', value: false, style: 'normal', isCancel: true },
              { label: 'それでも回す', value: true, style: 'danger', isDefault: true },
            ],
          });
          if (!go || go.action !== true)
            return { ok: false, id: t.meta.id, reports: 0, empty: true, delivered: false, reason: '取り消しました' };
        }
        await mutate(t.meta.id, (fresh) => {
          fresh.meta.status = 'review';
          return true;
        });
        AppUI.notify(
          `${t.meta.id} を確認へ回しました（親へ運ぶのは確認のとき）` + (rs.length ? '' : ' ／ レポートなし'),
          rs.length ? 'info' : 'warning',
          2500,
        );
        await refresh();
        return {
          ok: true,
          id: t.meta.id,
          reports: rs.length,
          artifacts: !!artifacts,
          empty: !rs.length,
          delivered: false,
        };
      };

      /** 畳むのは Itera の仕事。ここは依頼を送るだけで、機械で要約文を作らない。 */
      window.askFold = async (kind, source) => {
        const n = rawCurrent();
        if (!n) return;
        const map = {
          文脈生成: `${n.meta.id}「${n.meta.title}」の ## 文脈 を作ってください。親（および必要なら傍系）の履歴を**全部**読み、この札の ## 意図 に照らして畳みます。書式は記法 §5（源ごとに ### 、取り込み点は #### に「… まで」）。`,
          追随: `${n.meta.id}「${n.meta.title}」の ## 文脈 が古びています。源 ${source || ''} の、取り込み点より後の差分だけを畳んで **追記**してください（#### 追随 <日時>（<源> を <日時> まで））。既存の記述は消さないこと。`,
          再生成: `${n.meta.id}「${n.meta.title}」の ## 文脈 が肥大しています。意図に照らして畳み直してください（再生成）。**文脈は写しなので丸ごと書き換えてよい**が、## 履歴 に「再生成: …（前版は … 生成）」の 1 行を残すこと。`,
          総括: `${n.meta.id}「${n.meta.title}」の ## 履歴 に「### 総括 <日時>」を書いてください。前回の区切り以降の 決定・却下・未解決 を、決定は 1 行で、却下枠を省略せずに。`,
          レポート: `${n.meta.id}「${n.meta.title}」の ## 進捗 に「### レポート <日時>」を書いてください（決定・却下・未解決）。これを書いてから閉じます。`,
        };
        await notifyAI(`Loom: ${map[kind] || kind}`);
        AppUI.notify('Itera に依頼しました', 'info', 2000);
      };

      window.dropNode = async () => {
        const n = current();
        if (!n) return;
        const res = await AppUI.showMessageBox({
          title: isProject(n) ? 'この枝を放棄する' : 'このタスクを中止する',
          message: `${n.meta.id}「${n.meta.title}」を${isProject(n) ? '放棄' : '中止'}にしますか？削除はしません。理由を${recapName(n)}に書いてください。`,
          type: 'warning',
          buttons: [
            { label: 'キャンセル', value: false, style: 'normal', isCancel: true },
            { label: 'そうする', value: true, style: 'danger', isDefault: true },
          ],
        });
        if (!res || res.action !== true) return;
        n.meta.status = isProject(n) ? 'abandoned' : 'dropped';
        if (!(await commitAll(n))) return;
        await Store.append(n.meta.id, logSection(n), `- ${stamp()} 中止`);
        await refresh();
      };

      window.removeNode = async () => {
        const n = current();
        if (!n) return;
        const kids = childrenOf(n.meta.id);
        const res = await AppUI.showMessageBox({
          title: '削除',
          message: `${n.meta.id}「${n.meta.title}」を削除しますか？取り消せません。${kids.length ? `\n子が ${kids.length} 件あります（親を失います）。` : ''}`,
          type: 'warning',
          buttons: [
            { label: 'キャンセル', value: false, style: 'normal', isCancel: true },
            { label: '削除', value: true, style: 'danger', isDefault: true },
          ],
        });
        if (!res || res.action !== true) return;
        await Store.remove(n.meta.id);
        selectedId = null;
        await refresh();
      };

      /**
       * `done` へ移す前に親へ運ぶ（T-0203）。運べなければ `done` にしない。
       * ★ 画面からの操作なので、レポートが無ければ**訊く**（人がそこに居る）。
       */
      async function toDone(n) {
        const r = await deliverToParent(n.meta.id);
        if (!r.ok && r.empty) {
          const go = await AppUI.showMessageBox({
            title: 'レポートがありません',
            message: `${n.meta.id}「${n.meta.title}」にレポート（決定・却下・未解決）がありません。このまま完了にすると、親には 1 行の「完了」だけが載ります。よろしいですか？`,
            type: 'warning',
            buttons: [
              { label: 'やめる', value: false, style: 'normal', isCancel: true },
              { label: 'それでも完了にする', value: true, style: 'danger', isDefault: true },
            ],
          });
          if (!go || go.action !== true) return false;
          const forced = await deliverToParent(n.meta.id, { force: true });
          if (!forced.ok) {
            AppUI.notify('親へ運べませんでした: ' + (forced.reason || ''), 'error');
            return false;
          }
          return true;
        }
        if (!r.ok) {
          AppUI.notify('親へ運べませんでした: ' + (r.reason || ''), 'error');
          return false;
        }
        if (r.skipped) AppUI.notify('この札は既に親へ運ばれています（二重には載せません）', 'info', 2500);
        else
          AppUI.notify(
            `親（${r.to || '—'}）へ運びました` + (r.reports ? `（レポート ${r.reports} 件）` : '（レポートなし）'),
            'info',
            2500,
          );
        return true;
      }

      window.saveMeta = async () => {
        // ★ 変更前の状態は current() より先に読む。current() は入力欄を同じ物へ流し込む。
        const cur = rawCurrent();
        const before = cur ? cur.meta.status : null;
        const n = current();
        if (!n) return;
        // 状態の選択から done にした場合も運ぶ。経路を 1 つに絞ると、絞られなかった側が黙って抜ける。
        if (!isProject(n) && n.meta.status === 'done' && before !== 'done' && !(await toDone(n))) return;
        if (!(await commitAll(n))) return;
        await refresh();
      };
      window.setStatus = async (s) => {
        const n = current();
        if (!n) return;
        const before = n.meta.status;
        n.meta.status = s;
        // ★ ここが「確認したので完了にする」。**運ぶのはこの瞬間**（T-0203）。
        if (!isProject(n) && s === 'done' && before !== 'done' && !(await toDone(n))) return;
        if (!(await commitAll(n))) return;
        await refresh();
      };
      window.saveBody = async () => {
        const n = current();
        if (!n) return;
        n.body = DOM('f-body').value;
        const r = await Store.saveBodyChecked(n);
        if (!r) return; // 競合時は編集画面を閉じない（入力を捨てないため）
        editing = false;
        await refresh();
      };

      window.cyclePlan = async (i) => {
        const t = rawCurrent();
        if (!t) return;
        const target = String(t.body).split('\n')[i];
        if (target === undefined) return;
        let miss = false;
        await mutate(t.meta.id, (fresh) => {
          const lines = String(fresh.body).split('\n');
          const hits = [];
          lines.forEach((l, n) => {
            if (l === target) hits.push(n);
          });
          if (hits.length !== 1) {
            miss = true;
            return false;
          }
          const m = lines[hits[0]].match(/^(\s*- \[)( |x|X|~)(\] .*)$/);
          if (!m) {
            miss = true;
            return false;
          }
          const cur = m[2].toLowerCase();
          lines[hits[0]] = m[1] + (cur === ' ' ? '~' : cur === '~' ? 'x' : ' ') + m[3];
          fresh.body = lines.join('\n');
          return true;
        });
        if (miss) {
          noticeText = 'この項目が見つかりませんでした（外部で書き換えられた可能性があります）。';
          noticeKind = 'error';
        }
        await refresh();
      };

      const quickNote = () => {
        const b = DOM('f-quick');
        return b ? b.value.trim() : '';
      };
      const clearQuick = () => {
        const b = DOM('f-quick');
        if (b) b.value = '';
      };

      window.quick = async (section, notify) => {
        const n = rawCurrent();
        if (!n) return;
        const text = quickNote();
        if (!text) return;
        if (!(await commitIfEditing())) return;
        const line = section === '意図' ? text.replace(/\n/g, ' ') : `- ${stamp()} 山内: ${text.replace(/\n/g, ' ')}`;
        const f = await Store.append(n.meta.id, section, line, (fresh) => {
          if (notify && fresh.meta.status === 'blocked') fresh.meta.status = 'todo';
        });
        if (!f) return;
        clearQuick();
        if (notify)
          await notifyAI(
            `Loom ${f.meta.id}「${f.meta.title}」に山内さんから追記がありました（## ${section}）。${readHint(f, line)}`,
          );
        await refresh();
      };

      /**
       * レポート／総括の **枠の中へ** 追記する。
       *
       * ★ なぜ専用の処理が要るのか ——
       *   ふつうの追記（`quick`）は `- <日時> 山内: …` の形で節の末尾に置く。
       *   ところがレポートの枠は**次の日時つきの行で閉じる**（記法 §0 / T-0195）。
       *   だから同じ形で書くと、**枠の外**に落ちる。枠の外は転記で運ばれない。
       *   つまり「解決した」と書いたのに、**親には未解決のまま上がる** —— これがこの仕事の動機である。
       *   よって書式を変える: `- **追記 <日時> 山内**: …`。
       *   先頭が `- **` なので日時つきの行と誤読されず、枠が閉じない。
       */
      window.appendToRecap = async () => {
        const n0 = rawCurrent();
        if (!n0) return;
        const text = quickNote();
        if (!text) {
          AppUI.notify('追記する内容を書いてください', 'warning');
          return;
        }
        if (!(await commitIfEditing())) return;
        const n = await freshForTransfer(n0);
        if (!n) return;
        const name = recapName(n);
        const rs = parseRecaps(n.body, logSection(n), name).filter((r) => !r.from || r.from === n.meta.id);
        if (!rs.length) {
          AppUI.notify(`${name}がまだありません`, 'warning');
          return;
        }
        // ★ もう親へ運ばれていたら、ここに書いても**親には届かない**（親の側は運ばれた時点の写し）。
        //   黙って書くと「直したつもり」だけが残る。訊く。
        // ★ 判定は `deliveredAlready`（＝親の履歴にある証拠）に一本化する。
        //   以前は状態が review/done/dropped かで見ていたが、T-0203 で**運ぶのは done の瞬間**に変わり、
        //   `review` は「まだ運ばれていない」を意味するようになった。
        //   古い判定のままだと、**確認の場で解決を書き足すという本来の使い方でこそ警告が出る**
        //   （T-0200 の機能が死ぬ）。判定を 2 か所に持つと、片方だけ直って必ずずれる。
        const delivered = isProject(n)
          ? !pendingRecaps(n).some((r) => r.at === rs[rs.length - 1].at)
          : deliveredAlready(n);
        if (delivered) {
          const go = await AppUI.showMessageBox({
            title: `この${name}はもう親へ運ばれています`,
            message: `${rs[rs.length - 1].at} の${name}は既に親へ転記済みです。ここに追記しても親には反映されません（親の側は運ばれた時点の写しです）。それでも自分の札に書き残しますか？`,
            type: 'warning',
            buttons: [
              { label: 'やめる', value: false, style: 'normal', isCancel: true },
              { label: '書き残す', value: true, style: 'primary', isDefault: true },
            ],
          });
          if (!go || go.action !== true) return;
        }
        const line = `- **追記 ${stamp()} 山内**: ${text.replace(/\n/g, ' ')}`;
        let missed = false;
        const f = await mutate(n.meta.id, (fresh) => {
          // ★ 差し込む位置は「読み直した本文」で数え直す。写しで数えた添字を持ち込まない。
          const rs2 = parseRecaps(fresh.body, logSection(fresh), recapName(fresh)).filter(
            (r) => !r.from || r.from === fresh.meta.id,
          );
          if (!rs2.length) {
            missed = true;
            return false;
          }
          const t = rs2[rs2.length - 1];
          const ls = fresh.body.split('\n');
          let at = Math.min(t.end, ls.length - 1);
          while (at > t.start && !ls[at].trim()) at--; // 枠末尾の空行より前へ入れる
          ls.splice(at + 1, 0, line);
          fresh.body = ls.join('\n');
          return true;
        });
        if (missed) {
          AppUI.notify(`${name}が見つかりませんでした（外部で書き換えられた可能性があります）`, 'error');
          return;
        }
        if (!f) return;
        clearQuick();
        await refresh();
        AppUI.notify(`${name}に追記しました`, 'info', 2000);
      };

      window.send = async () => {
        const t = current();
        if (!t) return;
        t.meta.status = 'todo';
        const f = await commitAll(t);
        if (!f) return;
        const own = owningProject(t);
        await notifyAI(
          `Loom: 新しい依頼 ${f.meta.id}「${f.meta.title}」${own ? `（所属: ${own.meta.id}「${own.meta.title}」）` : ''}。${readHint(f)}` +
            `所属プロジェクトの 意図・文脈・履歴 を読んでから、## 計画 に分解を書いて着手してください。`,
        );
        await refresh();
      };

      window.handToAI = async () => {
        const t = rawCurrent();
        if (!t) return;
        if (!(await commitIfEditing())) return;
        const note = quickNote();
        const line = note ? `- ${stamp()} 山内: ${note.replace(/\n/g, ' ')}` : null;
        const f = await mutate(t.meta.id, (fresh) => {
          if (line) fresh.body = appendToSection(fresh.body, '追加要望', line);
          fresh.meta.status = 'todo';
          return true;
        });
        if (!f) return;
        clearQuick();
        await notifyAI(
          `Loom ${f.meta.id}「${f.meta.title}」の手番が山内さんから Itera に渡されました。` +
            (line ? `一言が添えられています。${readHint(f, line)}` : readHint(f)),
        );
        await refresh();
      };

      window.handBackToUser = async () => {
        const t = rawCurrent();
        if (!t) return;
        if (!(await commitIfEditing())) return;
        const note = quickNote();
        const line =
          `- ${stamp()} 山内: 手番を引き取り、作業の中止を指示。${note ? note.replace(/\n/g, ' ') : ''}`.trim();
        const f = await mutate(t.meta.id, (fresh) => {
          fresh.body = appendToSection(fresh.body, '進捗', line);
          fresh.meta.status = 'paused';
          return true;
        });
        if (!f) return;
        clearQuick();
        try {
          if (MetaOS.ai && MetaOS.ai.stop) await MetaOS.ai.stop();
        } catch (e) {}
        AppUI.notify('手番を引き取り、Itera を止めました', 'info', 2500);
        await refresh();
      };

      window.interruptAI = async () => {
        const t = rawCurrent();
        if (!t) return;
        if (!(await commitIfEditing())) return;
        const note = quickNote();
        const line = `- ${stamp()} 山内: 中断を指示。${note ? note.replace(/\n/g, ' ') : ''}`.trim();
        const f = await mutate(t.meta.id, (fresh) => {
          fresh.body = appendToSection(fresh.body, '追加要望', line);
          fresh.meta.status = 'paused';
          return true;
        });
        if (!f) return;
        clearQuick();
        await notifyAI(
          `Loom ${f.meta.id}「${f.meta.title}」について、山内さんから中断の指示です。新しい作業を始めず、ここまでと次の一手を ## 進捗 に書いてから止めてください。${readHint(f, line)}`,
        );
        await refresh();
      };

      const isDirPath = async (p) => {
        try {
          const s = await MetaOS.fs.stat(p);
          return !!s && s.kind === 'directory';
        } catch (e) {
          return false;
        }
      };
      window.addRef = async (dir) => {
        const n = current();
        if (!n) return;
        let p = null;
        try {
          p = await MetaOS.host.showOpenDialog({
            title: dir ? '参照するフォルダ' : '参照するファイル',
            mode: dir ? 'directory' : 'file',
          });
        } catch (e) {}
        if (!p) return;
        if (dir && !(await isDirPath(p))) {
          AppUI.notify('フォルダではありません', 'warning');
          return;
        }
        const cur = Array.isArray(n.meta.refs) ? n.meta.refs : [];
        if (cur.includes(p)) {
          AppUI.notify('すでに追加されています', 'warning');
          return;
        }
        n.meta.refs = [...cur, p];
        if (!(await commitAll(n))) return;
        await refresh();
      };
      window.removeRef = async (i) => {
        const n = current();
        if (!n) return;
        const c = Array.isArray(n.meta.refs) ? [...n.meta.refs] : [];
        c.splice(i, 1);
        n.meta.refs = c;
        if (!(await commitAll(n))) return;
        await refresh();
      };
      window.openRef = async (p) => {
        try {
          await MetaOS.host.openEditor(p);
        } catch (e) {}
      };

      window.refresh = async () => {
        nodes = await Store.list();
        if (selectedId && !byId(selectedId)) selectedId = null;
        // 編集の基準は「編集を始めた時点の本文」に固定する。
        // ★ ここで毎回張り替えると、外部の追記を「差が無い」と誤判定して踏み潰す（実機で再現済み）。
        //   だから editBase は、その札の編集に入った最初の一度だけ置く。
        if (editing) {
          const t = rawCurrent();
          if (t && (!editBase || editBase.id !== t.meta.id)) editBase = { id: t.meta.id, body: t.body };
        } else editBase = null;
        renderAll();
        watchSig = await dirSig();
      };

      // ============================================================
      // 外部変更の監視（署名は札ごとに持つ。1 本に畳むと無関係な更新で画面が揺れる）
      // ============================================================
      let watchSig = null;
      async function dirSig() {
        try {
          const items = await MetaOS.fs.list(DIR, { detail: true });
          const map = {};
          for (const x of items || []) {
            const name = String(x.name || x.path || '');
            if (!name.endsWith('.md')) continue;
            map[name] = `${x.version}:${x.hash}`;
          }
          return map;
        } catch (e) {
          return watchSig;
        }
      }
      function changedNames(before, after) {
        if (!before || !after) return [];
        const names = new Set([...Object.keys(before), ...Object.keys(after)]);
        const out = [];
        for (const n of names) if (before[n] !== after[n]) out.push(n);
        return out;
      }
      async function watchTick() {
        const sig = await dirSig();
        if (!sig || !watchSig) {
          watchSig = sig || watchSig;
          return;
        }
        const changed = changedNames(watchSig, sig);
        if (!changed.length) return;
        watchSig = sig;
        const mine = selectedId ? changed.includes(`${selectedId}.md`) : false;
        if (!mine) {
          await applyChanged(changed);
          renderList();
          renderViews();
          return;
        }
        if (hasUnsavedInput()) {
          const t = rawCurrent();
          const box = DOM('f-body');
          if (t && box && editing) t.body = box.value;
          noticeText =
            '編集中に、他の書き手（Itera）がこの札を更新しました。あなたの入力はそのまま残しています（取り込んでいません）。保存するか、控えを取ってから「再読込」を押してください。';
          noticeKind = 'error';
          showNoticeOnly(); // 掲示のために画面を作り直さない（作り直すと入力が消える）
          return;
        }
        await applyChanged(changed);
        if (selectedId && !byId(selectedId)) selectedId = null;
        renderAll();
        AppUI.notify('外部の更新を取り込みました', 'info', 2000);
      }
      /**
       * 変わった札だけを読み直して差し替える（監視から呼ぶ）。
       * ★ 全件読み直しと違い、**消えた札は明示的に外す**必要がある。
       *   `Store.list()` は「在るものを並べ直す」ので消滅が自然に反映されるが、こちらは差分なので。
       */
      async function applyChanged(names) {
        for (const name of names) {
          const base = String(name).split('/').pop();
          if (!base.endsWith('.md')) continue;
          const id = base.slice(0, -3);
          const fresh = await Store.readOne(String(name).includes('/') ? String(name) : `${DIR}/${base}`);
          const i = nodes.findIndex((n) => n.meta.id === id);
          if (!fresh) {
            if (i >= 0) nodes.splice(i, 1);
            continue;
          }
          if (i >= 0) nodes[i] = fresh;
          else nodes.push(fresh);
        }
        nodes.sort(byIdAsc);
      }
      function showNoticeOnly() {
        const el = DOM('detail');
        if (!el) return;
        const box = el.querySelector('.max-w-3xl');
        if (!box) {
          renderDetail();
          return;
        }
        const active = document.activeElement;
        const keepId = active && active.id && DRAFT_FIELDS.includes(active.id) ? active.id : null;
        const keepSel =
          keepId && typeof active.selectionStart === 'number'
            ? { start: active.selectionStart, end: active.selectionEnd }
            : null;
        const old = box.querySelector('[data-notice]');
        if (old) old.remove();
        const cls =
          noticeKind === 'error'
            ? 'border-error/40 bg-error/10 text-error'
            : 'border-warning/40 bg-warning/10 text-warning';
        box.insertAdjacentHTML(
          'afterbegin',
          `<div data-notice class="mb-4 p-3 rounded-lg border ${cls} text-xs flex items-start gap-2">
          <span class="font-bold shrink-0">⚠</span><span class="flex-1 leading-relaxed">${esc(noticeText)}</span>
          <button onclick="reloadNow()" class="px-2 py-1 rounded bg-error text-text-inverted font-bold shrink-0 hover:opacity-90 transition">再読込</button></div>`,
        );
        if (keepId) {
          const node = DOM(keepId);
          if (node) {
            node.focus();
            if (keepSel && node.setSelectionRange) {
              try {
                node.setSelectionRange(keepSel.start, keepSel.end);
              } catch (e) {}
            }
          }
        }
      }

      // ============================================================
      // 自己試験（解析だけを対象にする。inject_js から呼んで結果を見る）
      // ============================================================
      window.selfTest = function () {
        const R = [];
        const ok = (name, cond, got) => R.push({ name, pass: !!cond, got: cond ? undefined : got });

        const raw = [
          '---',
          'id: P-0002',
          'kind: project',
          'title: テスト',
          'status: live',
          'parent: P-0001',
          'supersedes: P-0009',
          'refs: ["a.md","b.md"]',
          '---',
          '',
          '## 意図',
          '',
          'これは意図。',
          '',
          '## 文脈',
          '',
          '### P-0001「親の題」より',
          '',
          '#### 生成 2026-08-21 10:00（P-0001 を 2026-08-21 09:30 まで）',
          '',
          '- 畳んだ中身',
          '',
          '#### 追随 2026-08-23 17:00（2026-08-23 16:00 まで）',
          '',
          '- 差分',
          '',
          '## 履歴',
          '',
          '- 2026-08-22 10:00 分岐: P-0003「子」',
          '### 総括 2026-08-22 12:00',
          '',
          '**決定**',
          '- 決めた ／ 理由 ／ 対象: x.md',
          '',
          '- 2026-08-22 13:00 転記: P-0001「親の題」へ（1 件）',
          '### 総括 2026-08-23 09:00',
          '',
          '**決定**',
          '- 二つ目',
          '',
          '- 2026-08-23 10:00 Itera: ただの追記',
          '',
          '## 成果物',
          '',
          '- out.md',
          '',
        ].join('\n');

        const n = parseNode(raw);
        ok('front matter を読む', n.meta.id === 'P-0002' && n.meta.kind === 'project', n.meta);
        ok('refs が配列になる', Array.isArray(n.meta.refs) && n.meta.refs.length === 2, n.meta.refs);
        ok('節を切り出す', sectionText(n.body, '意図') === 'これは意図。', sectionText(n.body, '意図'));

        const ctx = parseContext(n.body);
        ok('文脈の源を 1 つ読む', ctx.length === 1 && ctx[0].source === 'P-0001', ctx);
        ok('取り込み点は最後の「まで」', ctx[0] && ctx[0].watermark === '2026-08-23 16:00', ctx[0] && ctx[0].watermark);
        ok('mark を 2 つ読む', ctx[0] && ctx[0].marks.length === 2, ctx[0] && ctx[0].marks);

        // 源は id でも外の文書のパスでもよい。id は内部、それ以外は外部と見分ける。
        const extCtx = [
          '## 文脈',
          '',
          '### data/apps/handoff/tasks/T-0078.md「語彙」より',
          '',
          '#### 生成 2026-08-23 19:00（2026-08-23 18:00 まで）',
          '',
          '- 畳んだ',
          '',
        ].join('\n');
        const ec = parseContext(extCtx);
        ok(
          '外の文書も源にできる',
          ec.length === 1 && ec[0].external === true && ec[0].source === 'data/apps/handoff/tasks/T-0078.md',
          ec,
        );
        ok('外の源でも取り込み点は読める', ec[0] && ec[0].watermark === '2026-08-23 18:00', ec[0] && ec[0].watermark);
        ok(
          'id の源は内部のまま',
          parseContext(n.body)[0] && parseContext(n.body)[0].external === false,
          parseContext(n.body)[0],
        );

        const rs = parseRecaps(n.body, '履歴', '総括');
        ok(
          '総括を 2 つ読む',
          rs.length === 2,
          rs.map((r) => r.at),
        );
        ok('総括の中身が入る', rs[0] && /決めた/.test(rs[0].text), rs[0] && rs[0].text);

        const es = parseEntries(n.body, '履歴');
        ok(
          '出来事の動詞を見分ける',
          es.filter((e) => e.verb).length === 2,
          es.map((e) => e.verb),
        );
        ok(
          '動詞でない追記は verb=null',
          es.some((e) => e.who === 'Itera' && !e.verb),
          es,
        );
        ok('lastLogAt は最後の日時', es[es.length - 1].at === '2026-08-23 10:00', es[es.length - 1]);

        // 未送の総括＝最後の「転記: … へ」より後だけ
        const fake = { meta: { kind: 'project' }, body: n.body };
        const pend = pendingRecaps(fake);
        ok(
          '未送の総括は転記より後だけ',
          pend.length === 1 && pend[0].at === '2026-08-23 09:00',
          pend.map((p) => p.at),
        );

        // 転記で運ばれてきた子の総括は、自分の総括として数えない（数えると根まで積み上がる）。
        const carried = [
          '## 履歴',
          '',
          '### 総括 2026-08-23 12:00',
          '',
          '- 自分の決定',
          '',
          '- 2026-08-23 13:00 転記: P-0009「子」より（2026-08-23 11:00 以降の総括 1 件）',
          '### 総括 2026-08-23 11:00（P-0009）',
          '',
          '- 子の決定',
          '',
        ].join('\n');
        const carriedNode = { meta: { kind: 'project', id: 'P-0001' }, body: carried };
        ok(
          '転記で来た総括には出どころが付く',
          parseRecaps(carried, '履歴', '総括').filter((r) => r.from === 'P-0009').length === 1,
          parseRecaps(carried, '履歴', '総括').map((r) => r.at + '/' + r.from),
        );
        ok(
          '未送に数えるのは自分の総括だけ',
          pendingRecaps(carriedNode).length === 1 && pendingRecaps(carriedNode)[0].at === '2026-08-23 12:00',
          pendingRecaps(carriedNode).map((r) => r.at + '/' + r.from),
        );

        // 枠は「次の日時つきの行」で閉じる（T-0195）。
        // レポートの下に進捗の追記が続く実際の並びで、レポートだけが取れること。
        const framed = [
          '## 進捗',
          '',
          '- 2026-08-24 00:10 Itera: 着手した',
          '### レポート 2026-08-24 00:30',
          '',
          '**決定**',
          '- これはレポートの中身',
          '',
          '- 2026-08-24 00:42 Itera: レポートの後に書いた追記',
          '- 2026-08-24 00:50 Itera: さらに追記',
        ].join('\n');
        const fr = parseRecaps(framed, '進捗', 'レポート');
        ok(
          'レポートの枠は次の日時つきの行で閉じる',
          fr.length === 1 && !/追記/.test(fr[0].text) && /レポートの中身/.test(fr[0].text),
          fr.map((r) => r.text),
        );
        // 見出しの無い塊（節の末尾まで）も従来どおり取れる
        const tail = ['## 進捗', '', '### レポート 2026-08-24 01:00', '', '**決定**', '- 末尾のレポート', ''].join(
          '\n',
        );
        ok(
          '節の末尾までのレポートは全部取れる',
          parseRecaps(tail, '進捗', 'レポート')[0] &&
            /末尾のレポート/.test(parseRecaps(tail, '進捗', 'レポート')[0].text),
          parseRecaps(tail, '進捗', 'レポート'),
        );

        // 転記の基準は壁時計ではなく「どこまで渡したか」。
        // 総括より前の時刻に転記した記録があっても、「… まで」に含まれていれば渡し済みとみなす。
        const skewed = [
          '## 履歴',
          '',
          '### 総括 2026-08-23 19:20',
          '',
          '**決定**',
          '- 未来に書いた総括',
          '',
          '- 2026-08-23 18:40 転記: P-0001「親」へ（2026-08-23 19:20 まで／1 件）',
        ].join('\n');
        ok(
          '時計がずれても渡し済みと分かる',
          pendingRecaps({ meta: { kind: 'project' }, body: skewed }).length === 0,
          pendingRecaps({ meta: { kind: 'project' }, body: skewed }).map((r) => r.at),
        );
        const notYet = [
          '## 履歴',
          '',
          '- 2026-08-23 18:40 転記: P-0001「親」へ（2026-08-23 12:00 まで／1 件）',
          '### 総括 2026-08-23 19:20',
          '',
          '**決定**',
          '- まだ渡していない',
          '',
        ].join('\n');
        ok(
          '「まで」より後の総括は未送のまま',
          pendingRecaps({ meta: { kind: 'project' }, body: notYet }).length === 1,
          pendingRecaps({ meta: { kind: 'project' }, body: notYet }).map((r) => r.at),
        );

        // 追記は末尾の空行を食わずに入る
        const appended = appendToSection(n.body, '履歴', '- 2026-08-23 11:00 Itera: 追記した');
        ok(
          '追記が節の末尾に入る',
          /追記した\n\n## 成果物/.test(appended) || /追記した\n## 成果物/.test(appended),
          appended.slice(-160),
        );

        // 文脈だけは丸ごと置換してよい（写しだから）
        const replaced = replaceSection(
          n.body,
          '文脈',
          '### P-0001「親の題」より\n\n#### 再生成 2026-08-23 18:00（2026-08-23 17:00 まで）\n\n- 畳み直した',
        );
        ok(
          '文脈を置換しても他の節が残る',
          /## 履歴/.test(replaced) && /## 成果物/.test(replaced) && !/差分/.test(replaced),
          replaced.slice(0, 200),
        );

        // 直列化して読み直しても同じ
        const round = parseNode(serializeNode(n.meta, n.body));
        ok(
          '直列化して読み直せる',
          round.meta.id === 'P-0002' && sectionText(round.body, '意図') === 'これは意図。',
          round.meta,
        );

        // 題の解決（出来事の行に焼き付いた仮の題を、現在の題で上書きする）
        const savedNodes = nodes;
        try {
          nodes = [{ meta: { id: 'T-0002', kind: 'task', title: '本当の題' } }];
          ok(
            '書かれた題を現在の題で上書きする',
            resolveTitles('- 起票: T-0002「(無題のタスク)」') === '- 起票: T-0002「本当の題」',
            resolveTitles('- 起票: T-0002「(無題のタスク)」'),
          );
          ok(
            '題が無い参照にも題を補う',
            resolveTitles('T-0002 を見る') === 'T-0002「本当の題」 を見る',
            resolveTitles('T-0002 を見る'),
          );
          ok(
            '見つからない札は書かれた題を残す',
            resolveTitles('T-9999「昔の題」') === 'T-9999「昔の題」',
            resolveTitles('T-9999「昔の題」'),
          );
          ok(
            '見つからず題も無ければ id のまま',
            resolveTitles('T-9999 は消えた') === 'T-9999 は消えた',
            resolveTitles('T-9999 は消えた'),
          );
        } finally {
          nodes = savedNodes;
        }

        // ---- 描画（renderTree）----
        // ★ Loom で見つかった穴は、これまで**すべて「静かに札が消える」型**だった（T-0003 / T-0011）。
        //   解析だけを試験しても捕まらない。偽の板を組み立てて renderTree に食わせ、
        //   **実際に描かれた行を数える**（2026-08-24 / T-0012）。
        const renderRows = (fake, opts = {}) => {
          const saved = {
            nodes,
            selectedId,
            showClosed,
            showTasks,
            col: Array.from(collapsed),
          };
          try {
            nodes = fake;
            selectedId = null; // 浮いた要素なのでスクロールさせない
            showClosed = !!opts.showClosed;
            showTasks = opts.showTasks !== false;
            collapsed.clear();
            for (const id of opts.collapsed || []) collapsed.add(id);
            const el = document.createElement('div');
            renderTree(el);
            return Array.from(el.querySelectorAll('[id^="row-"]')).map((r) => ({
              id: r.id.slice(4),
              depth: Math.round((parseInt(r.style.marginLeft, 10) || 0) / 14),
            }));
          } finally {
            nodes = saved.nodes;
            selectedId = saved.selectedId;
            showClosed = saved.showClosed;
            showTasks = saved.showTasks;
            collapsed.clear();
            for (const id of saved.col) collapsed.add(id);
          }
        };
        const mk = (id, kind, status, parent, title) => ({
          meta: { id, kind, title: title || id, status, parent: parent || '' },
          body: '',
        });

        // 深い枝（T-0011 ①：4 段目以降が黙って出なかった）
        const deep = [
          mk('P-9001', 'project', 'live', ''),
          mk('T-9001', 'task', 'doing', 'P-9001'),
          mk('T-9002', 'task', 'doing', 'T-9001'),
          mk('T-9003', 'task', 'doing', 'T-9002'),
          mk('T-9004', 'task', 'doing', 'T-9003'),
        ];
        const deepRows = renderRows(deep);
        ok(
          '深い枝も最後まで描く',
          deepRows.length === 5 && deepRows[4].id === 'T-9004' && deepRows[4].depth === 4,
          deepRows,
        );
        ok(
          '同じ札を二度描かない',
          new Set(deepRows.map((r) => r.id)).size === deepRows.length,
          deepRows.map((r) => r.id),
        );

        // 閉じた親の下の開いた子（T-0011 ②：親ごと消えていた）
        const cpRows = renderRows([
          mk('P-9002', 'project', 'live', ''),
          mk('T-9010', 'task', 'done', 'P-9002'),
          mk('T-9011', 'task', 'todo', 'T-9010'),
        ]);
        ok(
          '閉じた親の下の開いた子は消えない',
          cpRows.some((r) => r.id === 'T-9011'),
          cpRows,
        );

        // ただし開いた子孫が無ければ隠す（上を直しすぎていないか）
        const acRows = renderRows([
          mk('P-9002', 'project', 'live', ''),
          mk('T-9012', 'task', 'done', 'P-9002'),
          mk('T-9013', 'task', 'done', 'T-9012'),
        ]);
        ok('開いた子孫が無い閉じた枝は出さない', acRows.length === 1 && acRows[0].id === 'P-9002', acRows);

        // 畳んだ枝の子孫を根として描き直さない（T-0003：畳むと増えていた）
        const foldRows = renderRows(
          [
            mk('P-9003', 'project', 'live', ''),
            mk('P-9004', 'project', 'live', 'P-9003'),
            mk('T-9020', 'task', 'todo', 'P-9004'),
          ],
          { collapsed: ['P-9003'] },
        );
        ok('畳んだ枝の子孫は根として描き直さない', foldRows.length === 1 && foldRows[0].id === 'P-9003', foldRows);

        // 畳んだタスクも同じ（2026-08-24 に足したつまみ）
        const ftRows = renderRows(
          [
            mk('P-9005', 'project', 'live', ''),
            mk('T-9030', 'task', 'doing', 'P-9005'),
            mk('T-9031', 'task', 'todo', 'T-9030'),
          ],
          { collapsed: ['T-9030'] },
        );
        ok(
          '畳んだタスクの子は出さない（親は出る）',
          ftRows.length === 2 && !ftRows.some((r) => r.id === 'T-9031'),
          ftRows,
        );

        // 系譜から辿り着けない札を捨てない（救済ループ）
        const orRows = renderRows([mk('P-9006', 'project', 'live', ''), mk('P-9007', 'project', 'live', 'P-0000')]);
        ok(
          '親が壊れた枝も捨てずに出す',
          orRows.some((r) => r.id === 'P-9007'),
          orRows,
        );

        // 親を失ったタスクも描く（救済ループがプロジェクトしか拾っていなかった。T-0013）
        const lostTask = renderRows([mk('P-9008', 'project', 'live', ''), mk('T-9040', 'task', 'todo', 'P-0000')]);
        ok(
          '親を失ったタスクも捨てずに出す',
          lostTask.some((r) => r.id === 'T-9040'),
          lostTask,
        );

        // ---- 全景（censusOf）----
        const board = [
          mk('P-9100', 'project', 'live', ''),
          mk('P-9101', 'project', 'live', 'P-9100'),
          mk('T-9100', 'task', 'todo', 'P-9101'),
          mk('T-9101', 'task', 'done', 'T-9100'),
          mk('T-9102', 'task', 'todo', 'P-0000'), // 親が板に無い
        ];
        const cs = censusOf(board);
        ok('全景: 枚数を数える', cs.total === 5 && cs.projects === 2 && cs.tasks === 3, cs);
        ok(
          '全景: 系譜から切れた札を拾う',
          cs.orphans.length === 1 && cs.orphans[0].meta.id === 'T-9102',
          cs.orphans.map((n) => n.meta.id),
        );
        ok(
          '全景: 根と子孫の数',
          cs.roots.length === 1 && cs.roots[0].id === 'P-9100' && cs.roots[0].desc === 3,
          cs.roots,
        );
        ok('全景: 手番を数える', cs.ball.ai === 2 && cs.ball.none === 1, cs.ball);
        const dupBoard = censusOf(board.concat([mk('T-9100', 'task', 'todo', 'P-9101')]));
        ok(
          '全景: id の重複を見つける',
          dupBoard.dupIds.length === 1 && dupBoard.dupIds[0].id === 'T-9100',
          dupBoard.dupIds,
        );
        const badBoard = censusOf([mk('T-9200', 'task', 'todo', ''), mk('P-9200', 'project', 'live', 'T-9200')]);
        ok(
          '全景: 記法にない辺（T→P）を見つける',
          badBoard.badEdges.length === 1 && badBoard.badEdges[0].meta.id === 'P-9200',
          badBoard.badEdges,
        );
        ok(
          '全景: 画面に出ない札は無い（この偽の板では）',
          unreachable(board).length === 0,
          unreachable(board).map((n) => n.meta.id),
        );

        // 記法に無いキーを保存で落とさない（T-0014。origin が 80 枚にある）
        const extra = serializeNode(
          {
            id: 'T-9300',
            kind: 'task',
            title: 'x',
            status: 'todo',
            origin: 'data/apps/handoff/tasks/T-0043.md',
            scheduled_note: 'めも',
          },
          '## 依頼\n本文',
        );
        ok(
          '知らない front matter のキーを落とさない',
          /origin: data\/apps\/handoff\/tasks\/T-0043\.md/.test(extra) && /scheduled_note: めも/.test(extra),
          extra,
        );
        const back = parseNode(extra);
        ok(
          '書いて読み直しても残る',
          back.meta.origin === 'data/apps/handoff/tasks/T-0043.md' && back.meta.scheduled_note === 'めも',
          back.meta,
        );
        ok(
          '知っているキーは決めた順に並ぶ',
          extra.indexOf('id:') < extra.indexOf('title:') && extra.indexOf('title:') < extra.indexOf('origin:'),
          extra,
        );

        const pass = R.filter((r) => r.pass).length;
        return {
          pass,
          fail: R.length - pass,
          results: R.filter((r) => !r.pass),
          all: R.map((r) => `${r.pass ? 'OK ' : 'NG '}${r.name}`),
        };
      };

      (async () => {
        try {
          await MetaOS.fs.mkdir(DIR);
        } catch (e) {}
        await refresh();
        // ★ 札を読み終えてから。初回の既定（子を持つ札を畳む）が nodes に依る（T-0202）。
        await loadUiState();
        if (!selectedId) {
          const first = projectRoots()[0];
          if (first) selectedId = first.meta.id;
        }
        // 畳んだ状態で始まるので、選んでいる札までの道を開いてから描く。
        openPathTo(selectedId);
        renderAll();
        setInterval(() => {
          if (!document.hidden) watchTick();
        }, 4000);
      })();
    </script>
  </body>
