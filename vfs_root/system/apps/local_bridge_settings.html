<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Bridge</title>
    <!-- 絶対パスで読む。このファイルは apps/ と system/apps/ の両方に置かれるため、
         相対パスだと配信後に system/system/core/... を指して全滅する（実際に踏んだ）。
         Tailwind も CDN ではなく同梱版を使う（テーマの定義がこちらに入っている）。 -->
    <script src="/system/vendor/tw.js"></script>
    <script src="/system/core/ui.js"></script>
    <script src="/system/core/std.js"></script>
  </head>
  <body class="bg-app text-text-main h-screen flex flex-col overflow-hidden">
    <header class="flex items-center justify-between px-5 py-3 border-b border-border-main shrink-0">
      <div class="flex items-center gap-3">
        <button
          onclick="AppUI.home()"
          class="p-2 -ml-2 rounded-full hover:bg-hover text-text-muted hover:text-text-main transition"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            ></path>
          </svg>
        </button>
        <h1 class="text-xl font-bold tracking-tight">Local Bridge</h1>
        <span id="daemonState" class="text-[0.6875rem] text-text-muted hidden sm:inline"></span>
      </div>
      <div class="flex items-center gap-2">
        <button
          onclick="refresh()"
          class="p-2 rounded hover:bg-hover text-text-muted hover:text-primary transition"
          title="Reload"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
            ></path>
          </svg>
        </button>
        <button
          onclick="restartDaemon()"
          class="px-3 py-2 rounded-lg border border-border-main text-sm hover:bg-hover transition"
          title="Changes take effect after the daemon is restarted"
        >
          Restart daemon
        </button>
        <button
          onclick="addConnection()"
          class="px-3 py-2 rounded-lg bg-primary text-text-inverted text-sm font-bold hover:bg-primary/90 shadow transition"
        >
          + Add connection
        </button>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto min-h-0">
      <div id="alerts" class="px-5 pt-4 space-y-2"></div>
      <div id="conns" class="p-5 space-y-4"></div>
      <div id="ignore" class="px-5 pb-4"></div>
      <div id="dist" class="px-5 pb-8"></div>
    </div>

    <!-- 無視するファイルの編集画面（T-0072）。本文に常時展開しないための置き場。 -->
    <div id="igmodal"></div>

    <script>
      const CONFIG_PATH = 'system/config/local_bridge.json';
      const ANCHOR_DIR = 'data/apps/local_bridge/anchors';
      // 配信後は system/services/ に入る。開発中のこの環境では services/ にある。
      // どちらでも動くよう両方を見る。
      const SERVER_PATHS = ['system/services/itera_bridge_server.py', 'services/itera_bridge_server.py'];
      // デーモンも配信後は system/services/ に入る。存在する方を使う。
      const DAEMON_PATHS = ['system/services/local_bridge.html', 'services/local_bridge.html'];
      const DAEMON_PID = 'local_bridge';
      const MOUNT_BASE = 'local';

      const DOM = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      const short = (id) => (id ? String(id).slice(0, 8) : '—');

      let state = { config: null, conns: [], mounts: [], daemon: false, details: {}, busy: false };

      // 設定は「読んで・変えて・書く」を毎回やり直す。
      // 開いたときの内容を持ち回って書き戻すと、デーモンが書き込む name / machineId を
      // 消してしまう（Handoff アプリが同じ作りで実際に事故を起こしている）。
      async function mutateConfig(fn) {
        let cfg;
        try {
          cfg = JSON.parse(await MetaOS.fs.read(CONFIG_PATH));
        } catch (e) {
          alertBox('Could not read the settings: ' + e.message, 'error');
          return false;
        }
        const next = fn(cfg);
        if (!next) return false;
        await MetaOS.fs.write(CONFIG_PATH, JSON.stringify(next, null, 2), { overwrite: true });
        await refresh();
        return true;
      }

      function alertBox(msg, kind) {
        const cls =
          kind === 'error'
            ? 'text-error border-error/40 bg-error/10'
            : kind === 'warn'
              ? 'text-warning border-warning/40 bg-warning/10'
              : 'text-text-muted border-border-main';
        DOM('alerts').insertAdjacentHTML(
          'beforeend',
          `<div class="border rounded-lg px-4 py-2 text-sm ${cls}">${esc(msg)}</div>`,
        );
      }

      async function probe(cfgConn) {
        const url = (cfgConn.serverUrl || '').replace(/\/+$/, '');
        const out = { cfg: cfgConn, url, ok: false, status: null, error: null };
        if (cfgConn.enabled === false) {
          out.error = 'Disabled';
          return out;
        }
        try {
          const res = await fetch(url + '/api/status');
          if (!res.ok) throw new Error('HTTP ' + res.status);
          out.status = await res.json();
          out.ok = true;
        } catch (e) {
          out.error = e.message;
        }
        return out;
      }

      async function anchorFor(name, root) {
        try {
          const raw = await MetaOS.fs.read(`${ANCHOR_DIR}/${name}__${root}.json`);
          const obj = JSON.parse(raw);
          return obj && obj.v === 2 ? obj.identity || null : null;
        } catch (e) {
          return null;
        }
      }

      async function rootDetail(conn, r) {
        const name = conn.cfg.name;
        const mountPath = name ? `${MOUNT_BASE}/${name}/${r.name}` : null;
        const d = {
          name: r.name,
          hostPath: r.path,
          files: r.files,
          rev: r.rev,
          mountPath,
          mounted: !!mountPath && state.mounts.includes(mountPath),
          stubs: null,
          materialized: null,
          bytes: 0,
          mismatch: null,
        };
        if (!mountPath) return d;

        const prev = await anchorFor(name, r.name);
        const now = conn.status || {};
        if (prev) {
          if (prev.machineId && now.machineId && prev.machineId !== now.machineId) {
            d.mismatch = `A different machine (previously ${prev.hostname || short(prev.machineId)})`;
          } else if (prev.path && r.path && prev.path !== r.path) {
            d.mismatch = `The real path changed (previously ${prev.path})`;
          }
        }

        try {
          const st = await MetaOS.fs.getSyncState(mountPath);
          let stubs = 0;
          const mats = [];
          for (const [full, info] of Object.entries(st)) {
            if (!info || info.kind === 'directory') continue;
            if (info.syncState === 'stub') stubs++;
            else mats.push(full);
          }
          d.stubs = stubs;
          d.materialized = mats.length;
          // getSyncState は size を返さない（返ってくると思い込んで 0 B と表示していた）。
          // 実体はふつう少数なので、その分だけ stat して合計する。
          let bytes = 0;
          for (const p of mats.slice(0, 200)) {
            try {
              const s = await MetaOS.fs.stat(p);
              bytes += (s && s.size) || 0;
            } catch (e) {}
          }
          d.bytes = bytes;
          d.bytesPartial = mats.length > 200;
        } catch (e) {}
        return d;
      }

      const fmtBytes = (n) => {
        if (!n) return '0 B';
        const u = ['B', 'KB', 'MB', 'GB'];
        let i = 0;
        while (n >= 1024 && i < u.length - 1) {
          n /= 1024;
          i++;
        }
        return `${n.toFixed(i ? 1 : 0)} ${u[i]}`;
      };

      async function refresh() {
        // スタブ化の最中に再描画すると、進捗ごと作り直してしまう。
        // 15 秒ごとの自動更新もここで止める。
        if (state.busy) return;
        DOM('alerts').innerHTML = '';
        let cfg;
        try {
          cfg = JSON.parse(await MetaOS.fs.read(CONFIG_PATH));
        } catch (e) {
          DOM('conns').innerHTML = '';
          alertBox('Cannot read the settings file: ' + CONFIG_PATH, 'error');
          return;
        }
        state.config = cfg;

        try {
          const ps = await MetaOS.system.ps();
          // pid だけで判定してはいけない。このアプリ自身が pid `local_bridge` を
          // 名乗ってデーモンを置き換えてしまい、「自分を見つけて稼働中」と表示した事故がある。
          // 見るべきはパス。
          state.daemon = ps.some((p) => DAEMON_PATHS.includes(p.path) && p.type === 'daemon');
        } catch (e) {
          state.daemon = false;
        }
        DOM('daemonState').textContent = state.daemon ? 'Daemon running' : 'Daemon stopped';

        try {
          state.mounts = (await MetaOS.fs.listMounts()).filter((m) => m.pid === DAEMON_PID).map((m) => m.mountPath);
        } catch (e) {
          state.mounts = [];
        }

        state.conns = await Promise.all((cfg.connections || []).map(probe));

        if (!state.daemon) {
          alertBox('The daemon is not running, so nothing is mounted. Use "Restart daemon" to start it.', 'warn');
        }

        // 同じ machineId を名乗る接続が2本以上あると、同じディレクトリを二重に同期して壊れる。
        // ssh -L を挟むと URL では気づけないので、ここで見る意味がある。
        const byId = new Map();
        for (const c of state.conns) {
          const id = c.status && c.status.machineId;
          if (!id) continue;
          byId.set(id, (byId.get(id) || []).concat([c]));
        }
        for (const [, list] of byId) {
          if (list.length > 1) {
            alertBox(
              `${list.length} connections point at the same machine (` +
                list.map((c) => c.url).join(' / ') +
                '). Mounting the same directory twice will break things.',
              'error',
            );
          }
        }

        await render();
        renderDist();
        renderIgnore();
      }

      async function render() {
        const parts = [];
        for (const c of state.conns) {
          const st = c.status;
          const name = c.cfg.name;
          const badge = c.ok
            ? '<span class="text-success text-xs font-bold">Connected</span>'
            : c.cfg.enabled === false
              ? '<span class="text-text-muted text-xs">Disabled</span>'
              : '<span class="text-error text-xs font-bold">Not connected</span>';

          const roots = [];
          if (c.ok && Array.isArray(st.roots)) {
            for (const r of st.roots) {
              const d = await rootDetail(c, r);
              // ボタンから件数・容量を引けるようにしておく（確認ダイアログで見せる）。
              state.details[`${name}/${d.name}`] = d;
              roots.push(d);
            }
          }

          const rootRows = roots.length
            ? roots
                .map((d) => {
                  const mountCell = d.mountPath
                    ? `<code class="text-[0.6875rem]">/${esc(d.mountPath)}</code>` +
                      (d.mounted ? '' : ' <span class="text-warning text-[0.6875rem]">Not mounted</span>')
                    : '<span class="text-text-muted text-[0.6875rem]">Waiting for the connection name</span>';
                  const counts =
                    d.stubs === null ? '—' : `${d.stubs} stubs / ${d.materialized} materialized (${fmtBytes(d.bytes)})`;
                  const warn = d.mismatch
                    ? `<div class="text-error text-[0.6875rem] mt-1">Identity mismatch: ${esc(d.mismatch)} — syncing is stopped</div>`
                    : '';
                  return `<tr class="border-t border-border-main/60 align-top">
                    <td class="py-2 pr-3 font-medium">${esc(d.name)}${warn}</td>
                    <td class="py-2 pr-3 text-text-muted"><code class="text-[0.6875rem]">${esc(d.hostPath || '')}</code></td>
                    <td class="py-2 pr-3">${mountCell}</td>
                    <td class="py-2 pr-3 text-text-muted text-[0.6875rem] whitespace-nowrap" title="Counted by the host. It includes directories, so it does not match the total on the right.">${d.files} items</td>
                    <td class="py-2 pr-3 text-text-muted text-[0.6875rem] whitespace-nowrap">${counts}</td>
                    <td class="py-2 text-right">
                      <div class="flex justify-end gap-2">
                        ${name ? ignoreButton('root', name, d.name) : ''}${releaseButton(name, d)}
                      </div>
                    </td>
                  </tr>`;
                })
                .join('')
            : `<tr><td colspan="6" class="py-3 text-text-muted text-sm">${
                c.ok ? 'No roots (run <code>itera attach &lt;DIR&gt;</code> on the host)' : esc(c.error || '')
              }</td></tr>`;

          const ident = c.ok
            ? `${esc(st.hostname || 'unnamed')} <span class="text-text-muted">/ ${esc(st.user || '?')} / ${esc(st.platform || '?')}</span>
               <span class="text-text-muted text-[0.6875rem]">machineId ${esc(short(st.machineId))}</span>`
            : `<span class="text-text-muted">${esc(c.error || '')}</span>`;

          parts.push(`
            <section class="border border-border-main rounded-xl overflow-hidden">
              <div class="flex items-center justify-between px-4 py-3 border-b border-border-main">
                <div class="flex items-center gap-3 min-w-0">
                  <h2 class="font-bold truncate">${esc(name || '(name not settled yet)')}</h2>
                  ${badge}
                  <code class="text-[0.6875rem] text-text-muted truncate">${esc(c.url)}</code>
                  ${c.ok ? `<span class="text-[0.6875rem] text-text-muted">v${esc(st.version)}</span>` : ''}
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <label class="text-[0.6875rem] text-text-muted">Exec</label>
                  <select onchange="setExecMode('${esc(c.url)}', this.value)"
                          class="bg-app border border-border-main rounded px-2 py-1 text-xs">
                    <option value="ask" ${(c.cfg.execMode || 'ask') === 'ask' ? 'selected' : ''}>Ask each time</option>
                    <option value="auto" ${c.cfg.execMode === 'auto' ? 'selected' : ''}>Automatic</option>
                  </select>
                  ${name ? ignoreButton('conn', name, null) : ''}
                  <button onclick="toggleEnabled('${esc(c.url)}')"
                          class="px-2 py-1 rounded border border-border-main text-xs hover:bg-hover">
                    ${c.cfg.enabled === false ? 'Enable' : 'Disable'}
                  </button>
                  <button onclick="removeConnection('${esc(c.url)}')"
                          class="px-2 py-1 rounded border border-error/40 text-error text-xs hover:bg-error/10">Remove</button>
                </div>
              </div>
              <div class="px-4 py-2 text-sm border-b border-border-main/60">${ident}</div>
              <table class="w-full text-sm px-4">
                <thead class="text-[0.6875rem] text-text-muted">
                  <tr><th class="text-left py-2 pl-4">Root</th><th class="text-left">Real path on the host</th>
                      <th class="text-left">Mounted at</th><th class="text-left">Files</th><th class="text-left">VFS state</th><th></th></tr>
                </thead>
                <tbody class="[&_td:first-child]:pl-4">${rootRows}</tbody>
              </table>
            </section>`);
        }
        DOM('conns').innerHTML =
          parts.join('') || '<p class="text-text-muted text-sm">No connections are configured.</p>';
      }

      function renderDist() {
        DOM('dist').innerHTML = `
          <section class="border border-border-main rounded-xl p-4">
            <h2 class="font-bold mb-1">Host-side server</h2>
            <p class="text-text-muted text-sm mb-3">
              A single file that is both the server and the CLI. Put it on the machine you want to connect and start it.
              It needs <code>fastapi</code> / <code>uvicorn</code> (and optionally <code>watchdog</code>).
            </p>
            <div class="flex flex-wrap items-center gap-2 mb-3">
              <button onclick="downloadServer()" class="px-3 py-2 rounded-lg bg-primary text-text-inverted text-sm font-bold hover:bg-primary/90">
                Download itera_bridge_server.py
              </button>
              <button onclick="copyServer()" class="px-3 py-2 rounded-lg border border-border-main text-sm hover:bg-hover">
                Copy the contents to the clipboard
              </button>
              <span class="text-text-muted text-[0.6875rem]">Use copy if downloads are blocked in your environment</span>
            </div>
            <pre class="bg-hover/50 border border-border-main rounded-lg p-3 text-[0.75rem] overflow-x-auto">python3 itera_bridge_server.py serve --port 8001
python3 itera_bridge_server.py attach ~/projects/foo   # add a root
python3 itera_bridge_server.py ls
python3 itera_bridge_server.py detach foo</pre>
            <p class="text-text-muted text-[0.6875rem] mt-2">
              To reach a machine over ssh, forward the port with <code>ssh -L 8002:localhost:8002 &lt;host&gt;</code> and
              add <code>http://127.0.0.1:8002</code> here. The connection name comes from the host name the server reports.
            </p>
          </section>`;
      }

      async function serverSource() {
        for (const p of SERVER_PATHS) {
          try {
            return await MetaOS.fs.read(p);
          } catch (e) {}
        }
        throw new Error('itera_bridge_server.py was not found (' + SERVER_PATHS.join(' / ') + ')');
      }

      async function downloadServer() {
        try {
          const text = await serverSource();
          const blob = new Blob([text], { type: 'text/x-python' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'itera_bridge_server.py';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            URL.revokeObjectURL(a.href);
            a.remove();
          }, 1000);
        } catch (e) {
          alertBox('Download failed: ' + e.message + ' — try copying instead.', 'error');
        }
      }

      async function copyServer() {
        try {
          await MetaOS.host.copyText(await serverSource());
          MetaOS.host.notify('Copied itera_bridge_server.py', 'Local Bridge');
        } catch (e) {
          alertBox('Copy failed: ' + e.message, 'error');
        }
      }

      async function setExecMode(url, mode) {
        await mutateConfig((cfg) => {
          const c = (cfg.connections || []).find((x) => (x.serverUrl || '').replace(/\/+$/, '') === url);
          if (!c) return null;
          c.execMode = mode;
          return cfg;
        });
        notifyRestartNeeded();
      }

      async function toggleEnabled(url) {
        await mutateConfig((cfg) => {
          const c = (cfg.connections || []).find((x) => (x.serverUrl || '').replace(/\/+$/, '') === url);
          if (!c) return null;
          c.enabled = c.enabled === false;
          return cfg;
        });
        notifyRestartNeeded();
      }

      async function addConnection() {
        const url = prompt('サーバーの URL', 'http://127.0.0.1:8002');
        if (!url) return;
        const clean = url.trim().replace(/\/+$/, '');
        const ok = await mutateConfig((cfg) => {
          cfg.connections = cfg.connections || [];
          if (cfg.connections.some((x) => (x.serverUrl || '').replace(/\/+$/, '') === clean)) {
            alertBox('That URL is already registered.', 'warn');
            return null;
          }
          // name は書かない。サーバーが名乗るホスト名をデーモンが採用して書き戻す。
          cfg.connections.push({ serverUrl: clean, execMode: 'ask', enabled: true });
          return cfg;
        });
        if (ok) notifyRestartNeeded();
      }

      async function removeConnection(url) {
        const res = await MetaOS.host.showMessageBox({
          title: 'Remove connection',
          message: `Remove ${url} from the settings?`,
          detail:
            'The VFS subtree (local/<connection>/…) is not deleted by this.' +
            'Materialized files may still be there. Delete them by hand if you do not need them.',
          type: 'question',
          buttons: [
            { label: 'Cancel', value: false, style: 'normal', isCancel: true },
            { label: 'Remove', value: true, style: 'danger', isDefault: true },
          ],
        });
        if (!res || res.action !== true) return;
        await mutateConfig((cfg) => {
          cfg.connections = (cfg.connections || []).filter((x) => (x.serverUrl || '').replace(/\/+$/, '') !== url);
          return cfg;
        });
        notifyRestartNeeded();
      }

      let restartHinted = false;
      function notifyRestartNeeded() {
        if (restartHinted) return;
        restartHinted = true;
        alertBox('Settings changed. Press "Restart daemon" to apply them.', 'warn');
      }

      async function daemonPath() {
        for (const p of DAEMON_PATHS) {
          if (await MetaOS.fs.exists(p)) return p;
        }
        throw new Error('The daemon itself was not found (' + DAEMON_PATHS.join(' / ') + ')');
      }

      async function restartDaemon() {
        try {
          await MetaOS.system.spawn(await daemonPath(), { pid: DAEMON_PID, type: 'daemon', forceReload: true });
          restartHinted = false;
          setTimeout(refresh, 1500);
        } catch (e) {
          alertBox('Could not start the daemon: ' + e.message, 'error');
        }
      }

      // ---------- すべてスタブに戻す ----------
      //
      // 「ホスト側に実体があり、ハッシュが一致する」ことを確かめてから捨てる判定は
      // デーモンにある。ここに同じ判定を書き写すと片方だけ直って乖離するので、
      // 依頼して結果を受け取るだけにする。
      //
      // broadcast は**送信者自身にも届く**（2026-08-20 に実測）。origin で自分の放送を弾く。
      const IPC_ORIGIN = `bridge_settings_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      const REPLY_TIMEOUT_MS = 120000;
      const waiting = new Map();

      if (window.MetaOS && MetaOS.system && MetaOS.system.on) {
        MetaOS.system.on('local_bridge:progress', (m) => {
          const w = m && waiting.get(m.id);
          if (w) w.progress(m);
        });
        MetaOS.system.on('local_bridge:result', (m) => {
          const w = m && waiting.get(m.id);
          if (!w) return;
          waiting.delete(m.id);
          w.done(m);
        });
      }

      function requestRelease(connName, rootName, onProgress) {
        return requestDaemon('release', { connection: connName, root: rootName, path: '' }, onProgress);
      }

      function requestDaemon(action, payload, onProgress) {
        return new Promise((resolve, reject) => {
          const id = `${IPC_ORIGIN}_${Math.random().toString(36).slice(2)}`;
          // 応答が来ないことを「終わった」と読み替えない。
          // 進捗が届くたびに待ち時間を延ばす（大きなルートは時間がかかる）。
          const arm = () =>
            setTimeout(() => {
              waiting.delete(id);
              reject(
                new Error(
                  'No reply from the daemon. It may be stopped, or it may be an older build without this feature.' +
                    'The VFS should be unchanged, but reload this screen to make sure.',
                ),
              );
            }, REPLY_TIMEOUT_MS);
          let timer = arm();
          waiting.set(id, {
            progress: (m) => {
              clearTimeout(timer);
              timer = arm();
              onProgress(m);
            },
            done: (m) => {
              clearTimeout(timer);
              resolve(m);
            },
          });
          MetaOS.system.broadcast('local_bridge:request', { id, origin: IPC_ORIGIN, action, ...payload });
        });
      }

      function releaseButton(connName, d) {
        if (!state.daemon || !d.mounted || !d.materialized) return '';
        return `<button onclick="releaseAll('${esc(connName)}','${esc(d.name)}')"
                  class="px-2 py-1 rounded border border-border-main text-xs hover:bg-hover whitespace-nowrap"
                  title="Checks file by file that the host has the same contents, then drops the copy in the VFS">Release all to stubs</button>`;
      }

      async function releaseAll(connName, rootName) {
        const d = state.details[`${connName}/${rootName}`];
        if (!d) return;

        const res = await MetaOS.host.showMessageBox({
          title: 'Release all to stubs',
          message: `Release ${d.materialized} materialized file(s) of ${connName} / ${rootName} (${fmtBytes(d.bytes)}${
            d.bytesPartial ? ' or more' : ''
          }) back to stubs?`,
          detail:
            'Each file is checked against the host (matching hash) before only the VFS copy is dropped.\n' +
            '- Files missing on the host, or whose contents differ, are skipped (not deleted)\n' +
            '- If the check cannot be made, the operation stops\n' +
            '- A file that became a stub is fetched again automatically when you open it',
          type: 'question',
          buttons: [
            { label: 'Cancel', value: false, style: 'normal', isCancel: true },
            { label: 'Release to stubs', value: true, style: 'danger', isDefault: true },
          ],
        });
        if (!res || res.action !== true) return;

        state.busy = true;
        MetaOS.host.showLoading(`Checking… 0 / ${d.materialized}`);
        try {
          const m = await requestRelease(connName, rootName, (p) => {
            MetaOS.host.showLoading(`Released ${p.released} / checked ${p.done} / ${p.total}`);
          });
          state.busy = false;
          MetaOS.host.hideLoading();
          await refresh();
          if (!m.ok) {
            alertBox(
              `Stopped: ${m.error}` + (m.released ? ` (${m.released} file(s) were released before it stopped)` : ''),
              'error',
            );
            return;
          }
          const head = `Released ${m.released} / skipped ${m.skippedTotal} (of ${m.total}; ${fmtBytes(m.bytes)} freed)`;
          if (m.skippedTotal) {
            alertBox(
              head + ' — skipped: ' + m.skipped.slice(0, 5).join(' / ') + (m.skippedTotal > 5 ? ' and more' : ''),
              'warn',
            );
          } else {
            alertBox(head, 'info');
          }
        } catch (e) {
          state.busy = false;
          MetaOS.host.hideLoading();
          alertBox(e.message, 'error');
          await refresh();
        }
      }

      // ---------- 無視するファイル（T-0059／置き方は T-0072） ----------
      //
      // 効き方は「全体の既定 ∪ 接続ごと ∪ ルートごと」の**和**。
      // 掃除で消えるのは **VFS の索引（スタブ）とアンカーの項目だけ**で、
      // 実体化済みのファイルとホスト側のファイルには触れない。
      //
      // ★ 画面に常時展開しない（T-0072）。階層のぶんだけテキスト欄を並べると、
      //   接続とルートが増えるたびに画面が縦に伸びる（実際に 8 個並んで本文を押し下げていた）。
      //   入口は**行のボタン**にし、**開いた階層だけ**を編集する。
      //   上位の階層は読み取りで見せて、そこから開き直せるようにする ——
      //   和で効く以上、「自分の欄が空なのに無視される」理由が見えないと使えないため。
      const ignoreLines = (arr) => (Array.isArray(arr) ? arr : []).join('\n');
      const parseIgnore = (text) =>
        String(text || '')
          .split('\n')
          .map((s) => s.trim())
          .filter(Boolean);

      // 名前をそのまま onclick に埋めると引用符で壊れる（esc は " を落とさない）。番号で引く。
      // 同じ対象は同じ番号に畳む。再描画は 15 秒ごとに走るので、畳まないと際限なく増える。
      let ignoreTargets = [];
      const ignoreKey = (t) => `${t.scope}\u0000${t.conn || ''}\u0000${t.root || ''}`;
      function ignoreTargetIndex(t) {
        const key = ignoreKey(t);
        const hit = ignoreTargets.findIndex((x) => ignoreKey(x) === key);
        if (hit >= 0) return hit;
        ignoreTargets.push(t);
        return ignoreTargets.length - 1;
      }

      function ignoreButton(scope, conn, root) {
        const i = ignoreTargetIndex({ scope, conn, root });
        return `<button onclick="openIgnore(${i})"
                  class="px-2 py-1 rounded border border-border-main text-xs hover:bg-hover whitespace-nowrap"
                  title="Edit the ignore patterns of this root (the inherited ones are shown too)">Ignore…</button>`;
      }

      function ignoreScopeLabel(t) {
        if (t.scope === 'global') return 'Default for every connection';
        if (t.scope === 'conn') return `${t.conn} — every root of this connection`;
        return `${t.conn} / ${t.root}`;
      }

      function ignoreCurrent(t) {
        const cfg = state.config || {};
        if (t.scope === 'global') return cfg.ignorePatterns || [];
        const c = (cfg.connections || []).find((x) => x.name === t.conn) || {};
        if (t.scope === 'conn') return c.ignorePatterns || [];
        return ((c.roots || {})[t.root] || {}).ignorePatterns || [];
      }

      // 上位の階層（読み取り）。和で効くので、どこから来たパターンなのかを示す。
      function ignoreInherited(t) {
        const rows = [];
        if (t.scope !== 'global') {
          const g = { scope: 'global' };
          rows.push({ label: ignoreScopeLabel(g), list: ignoreCurrent(g), idx: ignoreTargetIndex(g) });
        }
        if (t.scope === 'root') {
          const c = { scope: 'conn', conn: t.conn };
          rows.push({ label: ignoreScopeLabel(c), list: ignoreCurrent(c), idx: ignoreTargetIndex(c) });
        }
        return rows;
      }

      function renderIgnore() {
        const cfg = state.config || {};
        const gi = ignoreTargetIndex({ scope: 'global' });
        const n = (cfg.ignorePatterns || []).length;
        DOM('ignore').innerHTML = `
          <section class="border border-border-main rounded-xl p-4 flex flex-wrap items-center justify-between gap-3">
            <div class="min-w-0">
              <h2 class="font-bold">Ignored files</h2>
              <p class="text-[0.6875rem] text-text-muted mt-1">
                Matching files get no stub (this keeps the index small).
                Per-root patterns are opened from <b>"Ignore…" in the table above</b>.
                There are <b>${n}</b> shared defaults right now.
              </p>
            </div>
            <button onclick="openIgnore(${gi})"
                    class="px-3 py-2 rounded-lg border border-border-main text-sm hover:bg-hover whitespace-nowrap">
              Edit the shared defaults…
            </button>
          </section>`;
      }

      // ---------- 無視するファイルの編集画面 ----------
      //
      // 開いている間は自分では作り直さない。15 秒ごとの refresh で作り直すと、
      // 入力中の文字が消える。作り直すのは「開いたとき」と「保存したあと」だけ。
      let igScope = null;

      function openIgnore(i) {
        const t = ignoreTargets[i];
        if (!t) return;
        igScope = t;
        renderIgnoreModal();
      }

      function closeIgnore() {
        igScope = null;
        DOM('igmodal').innerHTML = '';
      }

      function renderIgnoreModal() {
        const t = igScope;
        if (!t) {
          DOM('igmodal').innerHTML = '';
          return;
        }

        const inherited = ignoreInherited(t)
          .map(
            (r) => `
              <div class="flex items-baseline gap-2 py-1 border-t border-border-main/60 first:border-t-0">
                <div class="text-[0.6875rem] text-text-muted w-40 shrink-0 truncate">${esc(r.label)}</div>
                <div class="flex-1 min-w-0 text-[0.6875rem] font-mono truncate">${
                  r.list.length ? esc(r.list.join('  ')) : '<span class="text-text-muted">(none)</span>'
                }</div>
                <button onclick="openIgnore(${r.idx})"
                        class="text-[0.6875rem] underline text-text-muted hover:text-text-main whitespace-nowrap">Open</button>
              </div>`,
          )
          .join('');

        const tools =
          t.scope !== 'root'
            ? ''
            : state.daemon
              ? `<div class="flex flex-wrap gap-2">
                   <button onclick="countIgnored()"
                     class="px-2 py-1 rounded border border-border-main text-xs hover:bg-hover whitespace-nowrap"
                     title="Counts with the settings of the daemon that is running now">Count matches</button>
                   <button onclick="cleanupIgnored()"
                     class="px-2 py-1 rounded border border-error/40 text-error text-xs hover:bg-hover whitespace-nowrap"
                     title="Removes stubs that now match an ignore pattern from the index. The host is not touched">Clean up ignored stubs</button>
                 </div>`
              : '<div class="text-[0.6875rem] text-text-muted">The daemon is stopped, so counting and cleaning are not possible.</div>';

        const hint =
          t.scope === 'global'
            ? 'A pattern that contains "/" is matched against the whole path relative to the root; one without "/" is matched against each segment (for example <code>data</code> also matches a data directory in the middle).'
            : t.scope === 'conn'
              ? 'These are added to every root of this connection.'
              : 'These are added to this root only. Counting and cleaning use the settings <b>after you save and restart the daemon</b>.';

        DOM('igmodal').innerHTML = `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
            <div class="absolute inset-0 bg-black/40" onclick="closeIgnore()"></div>
            <div class="relative w-full max-w-2xl max-h-full overflow-y-auto bg-app border border-border-main rounded-xl p-4 space-y-3">
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <h2 class="font-bold truncate">Ignored files — ${esc(ignoreScopeLabel(t))}</h2>
                  <p class="text-[0.6875rem] text-text-muted mt-1">
                    Matching files get no stub.
                    <b>A pattern you add later does not affect stubs that already exist</b> (that is what "Clean up" is for).
                    Cleaning removes entries from the VFS index only; <b>files on the host and materialized files are kept.</b>
                  </p>
                </div>
                <button onclick="closeIgnore()"
                        class="px-2 py-1 rounded border border-border-main text-xs hover:bg-hover whitespace-nowrap">Close</button>
              </div>

              ${
                inherited
                  ? `<div class="border border-border-main rounded-lg p-3">
                       <div class="text-[0.6875rem] text-text-muted mb-1">Also in effect here (inherited, read-only)</div>
                       ${inherited}
                     </div>`
                  : ''
              }

              <div class="space-y-2">
                <div class="text-sm font-bold">${esc(ignoreScopeLabel(t))}</div>
                <textarea id="ig_edit" rows="8" spellcheck="false"
                  class="w-full bg-surface border border-border-main rounded p-2 text-xs font-mono"
                  placeholder="One per line. e.g. data / *.png / output/tmp">${esc(ignoreLines(ignoreCurrent(t)))}</textarea>
                <div class="text-[0.6875rem] text-text-muted">${hint}</div>
                ${tools}
                <div id="ig_msg" class="text-[0.6875rem] text-text-muted"></div>
              </div>

              <div class="flex justify-end gap-2 pt-1">
                <button onclick="closeIgnore()"
                        class="px-3 py-2 rounded-lg border border-border-main text-sm hover:bg-hover">Close</button>
                <button onclick="saveIgnore()"
                        class="px-3 py-2 rounded-lg bg-primary text-text-inverted text-sm font-bold hover:bg-primary/90">Save</button>
              </div>
            </div>
          </div>`;
      }

      async function saveIgnore() {
        const t = igScope;
        const el = DOM('ig_edit');
        if (!t || !el) return;
        const patterns = parseIgnore(el.value);
        const ok = await mutateConfig((cfg) => {
          if (t.scope === 'global') {
            cfg.ignorePatterns = patterns;
            return cfg;
          }
          const c = (cfg.connections || []).find((x) => x.name === t.conn);
          if (!c) {
            alertBox(`Connection not found: ${t.conn}`, 'error');
            return null;
          }
          if (t.scope === 'conn') {
            c.ignorePatterns = patterns;
          } else {
            c.roots = c.roots || {};
            c.roots[t.root] = { ...(c.roots[t.root] || {}), ignorePatterns: patterns };
          }
          return cfg;
        });
        if (!ok) return;
        notifyRestartNeeded();
        // 保存された値で作り直す。画面に残った文字列ではなく、設定を読み直したものを見せる。
        renderIgnoreModal();
        const msg = DOM('ig_msg');
        if (msg)
          msg.textContent = `Saved (${patterns.length} pattern(s)). They take effect after you restart the daemon.`;
      }

      async function askIgnoreCount(t) {
        const m = await requestDaemon('ignore_cleanup', { connection: t.conn, root: t.root, dryRun: true }, () => {});
        if (!m.ok) throw new Error(m.error);
        return m;
      }

      async function countIgnored() {
        const t = igScope;
        const msg = DOM('ig_msg');
        if (!t || t.scope !== 'root' || !msg) return;
        msg.textContent = 'Counting…';
        try {
          const m = await askIgnoreCount(t);
          msg.textContent =
            `${m.total} match(es) (stubs ${m.stubs} / directories ${m.dirs} / anchor-only ${m.anchorOnly})` +
            ` — ${m.keptTotal} materialized file(s) left untouched`;
        } catch (e) {
          msg.textContent = `Could not count: ${e.message}`;
        }
      }

      async function cleanupIgnored() {
        const t = igScope;
        if (!t || t.scope !== 'root') return;

        let pre;
        try {
          pre = await askIgnoreCount(t);
        } catch (e) {
          alertBox(`Could not count the matches: ${e.message}`, 'error');
          return;
        }
        if (!pre.total) {
          alertBox(`Nothing to clean up in ${t.conn} / ${t.root}.`, 'info');
          return;
        }

        const res = await MetaOS.host.showMessageBox({
          title: 'Clean up ignored stubs',
          message: `Remove ${pre.total} entry/entries of ${t.conn} / ${t.root} from the VFS index?`,
          detail:
            'Only entries in the VFS index (stubs) and in the anchor are removed. Files on the host are not changed.\n' +
            `- ${pre.keptTotal} materialized file(s) are kept\n` +
            '- Remove the pattern and they come back as stubs on the next scan',
          type: 'question',
          buttons: [
            { label: 'Cancel', value: false, style: 'normal', isCancel: true },
            { label: 'Clean up', value: true, style: 'danger', isDefault: true },
          ],
        });
        if (!res || res.action !== true) return;

        state.busy = true;
        MetaOS.host.showLoading(`Cleaning up… 0 / ${pre.total}`);
        try {
          const m = await requestDaemon('ignore_cleanup', { connection: t.conn, root: t.root, dryRun: false }, (p) =>
            MetaOS.host.showLoading(`Cleaning up… ${p.done} / ${p.total}`),
          );
          state.busy = false;
          MetaOS.host.hideLoading();
          await refresh();
          if (!m.ok) {
            alertBox(`Could not clean up: ${m.error}`, 'error');
            return;
          }
          const head = `Removed ${m.removed} entry/entries from the index (of ${m.total}; ${m.keptTotal} materialized file(s) kept).`;
          const msg = DOM('ig_msg');
          if (msg) msg.textContent = head;
          if (m.failed && m.failed.length) {
            alertBox(`${head} Could not remove: ${m.failed.slice(0, 3).join(' / ')}`, 'warn');
          } else {
            alertBox(head, 'info');
          }
        } catch (e) {
          state.busy = false;
          MetaOS.host.hideLoading();
          alertBox(e.message, 'error');
          await refresh();
        }
      }

      refresh();
      setInterval(refresh, 15000);
    </script>
  </body>
</html>
