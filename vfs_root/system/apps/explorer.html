<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ファイル</title>
    <script src="/system/vendor/tw.js"></script>
    <script src="/system/core/ui.js"></script>
    <style>
      .row.selected {
        background: rgb(var(--c-primary) / 0.12);
      }
      .tree-item.current {
        color: rgb(var(--c-primary));
        font-weight: 700;
      }
      #drop-hint {
        pointer-events: none;
      }
      body.dragging #drop-hint {
        display: flex;
      }
    </style>
  </head>
  <body class="bg-app text-text-main h-screen flex flex-col overflow-hidden relative">
    <!--
      ファイル（エクスプローラ）— T-0250（Itera 版。置き場だけが違う）
      置き場（個人／組織／エージェント）の木と一覧。ダブルクリックで関連アプリ、PC からの取り込み、
      新しいフォルダ・名前の変更・ゴミ箱へ、AI に渡す。ホストのエクスプローラパネルとは別物で、
      「ホストのパネルで見る」は MetaOS.host.revealInExplorer（T-0251）を呼ぶ。
      正はすべて VFS。ここは読んで描くだけで、状態は「いまどこを見ているか」と「何を選んでいるか」しか持たない。
    -->
    <header
      class="h-14 border-b border-border-main flex items-center justify-between px-4 bg-panel shrink-0 z-10 gap-3"
    >
      <div class="flex items-center gap-2 min-w-0">
        <button
          onclick="AppUI.home()"
          class="text-text-muted hover:text-text-main transition p-1 rounded hover:bg-hover"
          title="ホームへ"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            ></path>
          </svg>
        </button>
        <span class="font-bold tracking-tight shrink-0">ファイル</span>
        <nav id="crumbs" class="flex items-center gap-1 text-sm min-w-0 overflow-hidden"></nav>
      </div>
      <div class="flex items-center gap-1 shrink-0" id="toolbar">
        <button
          onclick="importFiles()"
          class="text-sm px-2 py-1 rounded hover:bg-hover text-text-muted hover:text-text-main"
          title="PC のファイルをこのフォルダに取り込む（ドラッグ&ドロップでも）"
        >
          ⬆ 取り込む
        </button>
        <button
          onclick="newFolder()"
          class="text-sm px-2 py-1 rounded hover:bg-hover text-text-muted hover:text-text-main"
        >
          ＋ フォルダ
        </button>
        <button
          onclick="renameSelected()"
          data-needs="one"
          class="text-sm px-2 py-1 rounded hover:bg-hover text-text-muted hover:text-text-main disabled:opacity-30"
        >
          名前の変更
        </button>
        <button
          onclick="trashSelected()"
          data-needs="some"
          class="text-sm px-2 py-1 rounded hover:bg-hover text-text-muted hover:text-error disabled:opacity-30"
        >
          ゴミ箱へ
        </button>
        <button
          onclick="askAI()"
          data-needs="some"
          class="text-sm px-2 py-1 rounded bg-primary/10 text-primary font-bold hover:bg-primary/20 disabled:opacity-30"
          title="選んだものを AI に渡す"
        >
          ⚡ AI に渡す
        </button>
        <button
          onclick="revealInHost()"
          id="btn-reveal"
          data-needs="one"
          class="hidden text-sm px-2 py-1 rounded hover:bg-hover text-text-muted hover:text-text-main disabled:opacity-30"
          title="ホストのエクスプローラパネルで見る"
        >
          パネルで見る
        </button>
      </div>
      <input type="file" id="file-input" multiple class="hidden" />
    </header>

    <div class="flex-1 flex min-h-0">
      <aside
        id="tree"
        class="w-64 shrink-0 border-r border-border-main bg-panel overflow-y-auto p-2 text-sm hidden md:block"
      ></aside>
      <main id="main" class="flex-1 min-w-0 flex flex-col relative">
        <div
          class="grid grid-cols-[1fr_6rem_10rem] gap-2 px-4 py-1.5 text-[11px] text-text-muted border-b border-border-main/60 shrink-0"
        >
          <div>名前</div>
          <div class="text-right">大きさ</div>
          <div class="hidden sm:block">更新</div>
        </div>
        <div id="list" class="flex-1 overflow-y-auto" tabindex="0"></div>
        <div
          id="status"
          class="h-7 border-t border-border-main/60 px-4 text-[11px] text-text-muted flex items-center shrink-0"
        ></div>
        <div
          id="drop-hint"
          class="hidden absolute inset-0 bg-primary/10 border-4 border-dashed border-primary items-center justify-center text-primary font-bold text-lg"
        >
          ここに落とすと取り込みます
        </div>
      </main>
    </div>

    <script>
      // ---------- 置き場（環境ごとに違うのはここだけ） ----------
      const ROOTS = [
        { path: 'data', icon: '🗃️', name: 'data' },
        { path: 'memory', icon: '🧠', name: 'memory' },
        { path: 'apps', icon: '🧩', name: 'apps' },
        { path: 'docs', icon: '📚', name: 'docs' },
        { path: 'services', icon: '⚙️', name: 'services' },
      ];
      const TEXT_EXT = ['md', 'txt', 'json', 'js', 'ts', 'css', 'html', 'yml', 'yaml', 'xml', 'log', 'jsonl'];

      const $ = (id) => document.getElementById(id);
      let cwd = ROOTS[0].path; // いま見ているフォルダ
      let entries = []; // cwd の中身（stat の配列）
      let selected = new Set(); // 選んでいるパス
      let lastClicked = null;
      let expanded = new Set(); // 木で開いているフォルダ
      let registry = null; // { apps, associations }

      const basename = (p) => p.split('/').pop();
      const parentOf = (p) => (p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '');
      const extOf = (name) => (name.includes('.') ? name.split('.').pop().toLowerCase() : '');
      const fmtSize = (n) =>
        n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n >= 1024 ? (n / 1024).toFixed(1) + ' KB' : (n || 0) + ' B';
      const fmtDate = (t) =>
        t
          ? new Date(t).toLocaleString('ja-JP', {
              month: 'numeric',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit',
            })
          : '';
      const rootOf = (p) => ROOTS.find((r) => p === r.path || p.startsWith(r.path + '/'));
      const iconOf = (e) => {
        if (e.kind === 'directory') return expanded.has(e.path) || e.path === cwd ? '📂' : '📁';
        const x = extOf(e.name);
        if (['xlsx', 'xls', 'csv'].includes(x)) return '📊';
        if (x === 'pdf') return '📄';
        if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(x)) return '🖼️';
        if (['md', 'txt'].includes(x)) return '📝';
        return '📃';
      };

      // ---------- 読む ----------
      async function listDir(path) {
        const items = await MetaOS.fs.list(path, { detail: true });
        return items
          .filter((e) => e.name !== '.keep' && !e.name.startsWith('.'))
          .sort((a, b) => (a.kind === b.kind ? a.name.localeCompare(b.name, 'ja') : a.kind === 'directory' ? -1 : 1));
      }
      async function loadRegistry() {
        if (registry) return registry;
        const readJson = async (p, dflt) => {
          try {
            return JSON.parse(await MetaOS.fs.read(p));
          } catch (_) {
            return dflt;
          }
        };
        const apps = await readJson('system/registry/apps.json', []);
        const associations = await readJson('system/registry/associations.json', { extensions: {} });
        registry = { apps: Array.isArray(apps) ? apps : [], associations: associations || { extensions: {} } };
        return registry;
      }

      // ---------- 描く ----------
      async function navigate(path, opts = {}) {
        path = String(path || '').replace(/^\/+|\/+$/g, '');
        if (!path) path = ROOTS[0].path;
        try {
          const st = await MetaOS.fs.stat(path);
          if (st.kind !== 'directory') path = parentOf(path);
        } catch (e) {
          AppUI.notify(`「${path}」が見つかりません`, 'error');
          if (cwd === path) return;
          return navigate(cwd);
        }
        cwd = path;
        selected = new Set(opts.select ? [opts.select] : []);
        for (let p = parentOf(cwd); p; p = parentOf(p)) expanded.add(p);
        expanded.add(cwd);
        try {
          entries = await listDir(cwd);
        } catch (e) {
          entries = [];
          AppUI.notify(`読めませんでした: ${e && e.message}`, 'error');
        }
        renderCrumbs();
        renderList();
        await renderTree();
        try {
          await MetaOS.host.updateAddressBar('?path=' + encodeURIComponent(cwd));
        } catch (_) {}
      }

      function renderCrumbs() {
        const nav = $('crumbs');
        nav.innerHTML = '';
        const segs = cwd.split('/');
        segs.forEach((s, i) => {
          if (i > 0) {
            const sep = document.createElement('span');
            sep.className = 'text-text-muted';
            sep.textContent = '/';
            nav.appendChild(sep);
          }
          const b = document.createElement('button');
          const p = segs.slice(0, i + 1).join('/');
          b.className =
            'px-1 rounded hover:bg-hover truncate ' + (i === segs.length - 1 ? 'font-bold' : 'text-text-muted');
          b.textContent = s;
          b.onclick = () => navigate(p);
          nav.appendChild(b);
        });
      }

      function renderList() {
        const box = $('list');
        box.innerHTML = '';
        if (entries.length === 0) {
          box.innerHTML =
            '<div class="text-center text-text-muted text-sm py-10">空のフォルダです。PC のファイルをここに落とすと取り込めます</div>';
        }
        for (const e of entries) {
          const row = document.createElement('div');
          row.className =
            'row grid grid-cols-[1fr_6rem_10rem] gap-2 px-4 py-1.5 text-sm cursor-default select-none hover:bg-hover items-center';
          row.dataset.path = e.path;
          if (selected.has(e.path)) row.classList.add('selected');
          const name = document.createElement('div');
          name.className = 'truncate';
          name.textContent = `${iconOf(e)} ${e.name}`;
          name.title = e.path;
          const size = document.createElement('div');
          size.className = 'text-right text-text-muted text-xs';
          size.textContent = e.kind === 'directory' ? '' : fmtSize(e.size);
          const date = document.createElement('div');
          date.className = 'text-text-muted text-xs hidden sm:block';
          date.textContent = fmtDate(e.updatedAt);
          row.append(name, size, date);
          row.onclick = (ev) => select(e.path, ev);
          row.ondblclick = () => open(e);
          box.appendChild(row);
        }
        updateStatus();
      }

      function select(path, ev) {
        if (ev && (ev.ctrlKey || ev.metaKey)) {
          selected.has(path) ? selected.delete(path) : selected.add(path);
        } else if (ev && ev.shiftKey && lastClicked) {
          const ps = entries.map((e) => e.path);
          const a = ps.indexOf(lastClicked),
            b = ps.indexOf(path);
          if (a >= 0 && b >= 0) {
            selected = new Set(ps.slice(Math.min(a, b), Math.max(a, b) + 1));
          }
        } else {
          selected = new Set([path]);
        }
        lastClicked = path;
        document
          .querySelectorAll('#list .row')
          .forEach((r) => r.classList.toggle('selected', selected.has(r.dataset.path)));
        updateStatus();
      }

      function updateStatus() {
        const n = selected.size;
        $('status').textContent = n ? `${n} 件を選択` : `${entries.length} 件`;
        document.querySelectorAll('#toolbar [data-needs]').forEach((b) => {
          const need = b.dataset.needs;
          b.disabled = need === 'one' ? n !== 1 : n === 0;
        });
      }

      async function renderTree() {
        const box = $('tree');
        box.innerHTML = '';
        for (const r of ROOTS) {
          await renderTreeNode(box, { path: r.path, name: `${r.icon} ${r.name}`, kind: 'directory' }, 0, true);
        }
      }
      async function renderTreeNode(box, node, depth, isRoot) {
        const div = document.createElement('div');
        div.className =
          'tree-item flex items-center gap-1 px-2 py-0.5 rounded cursor-pointer hover:bg-hover truncate' +
          (node.path === cwd ? ' current' : '');
        div.style.paddingLeft = depth * 12 + 8 + 'px';
        div.textContent = (isRoot ? '' : expanded.has(node.path) ? '📂 ' : '📁 ') + node.name;
        div.title = node.path;
        div.onclick = () => navigate(node.path);
        box.appendChild(div);
        if (!expanded.has(node.path)) return;
        let kids = [];
        try {
          kids = (await listDir(node.path)).filter((e) => e.kind === 'directory');
        } catch (_) {
          return;
        }
        for (const k of kids) await renderTreeNode(box, k, depth + 1, false);
      }

      // ---------- 開く ----------
      async function open(e) {
        if (e.kind === 'directory') return navigate(e.path);
        const { apps, associations } = await loadRegistry();
        const ext = extOf(e.name);
        let app = null;
        const preferred = associations.extensions && associations.extensions[ext];
        if (preferred) app = apps.find((a) => a.id === preferred) || null;
        if (!app)
          app = apps.find((a) => (a.fileHandlers || []).some((h) => (h.extensions || []).includes(ext))) || null;
        try {
          if (app) {
            await MetaOS.system.spawn(app.path, { pid: app.id, show: true, args: { file: e.path } });
          } else if (ext === 'html') {
            await MetaOS.system.spawn(e.path, { show: true });
          } else if (TEXT_EXT.includes(ext) || !ext) {
            await MetaOS.host.openEditor(e.path);
          } else if (MetaOS.host.revealInExplorer) {
            // 画像など、ゲストに受け皿が無いものはホストのパネルへ（そこから開ける）
            await MetaOS.host.revealInExplorer(e.path);
            AppUI.notify('この形式を開くアプリが無いので、ホストのパネルで選びました', 'info');
          } else {
            AppUI.notify('この形式を開くアプリがありません。「AI に渡す」は使えます', 'info');
          }
        } catch (err) {
          AppUI.notify(`開けませんでした: ${err && err.message}`, 'error');
        }
      }

      async function revealInHost() {
        const p = [...selected][0] || cwd;
        try {
          const ok = await MetaOS.host.revealInExplorer(p);
          if (!ok) AppUI.notify('ホストのパネルに見つかりませんでした', 'error');
        } catch (e) {
          AppUI.notify(`表示できませんでした: ${e && e.message}`, 'error');
        }
      }

      // ---------- 変える ----------
      async function newFolder() {
        const name = await AppUI.prompt('新しいフォルダの名前', '', '新しいフォルダ');
        if (!name) return;
        if (/[\/\\]/.test(name)) return AppUI.notify('名前に / は使えません', 'error');
        const p = `${cwd}/${name.trim()}`;
        try {
          if (await MetaOS.fs.exists(p)) return AppUI.notify('同じ名前のものがあります', 'error');
          await MetaOS.fs.mkdir(p);
          await navigate(cwd, { select: p });
        } catch (e) {
          AppUI.notify(`作れませんでした: ${e && e.message}`, 'error');
        }
      }
      async function renameSelected() {
        const p = [...selected][0];
        if (!p) return;
        const name = await AppUI.prompt('新しい名前', basename(p), '名前の変更');
        if (!name || name === basename(p)) return;
        if (/[\/\\]/.test(name)) return AppUI.notify('名前に / は使えません', 'error');
        const np = `${parentOf(p)}/${name.trim()}`;
        try {
          if (await MetaOS.fs.exists(np)) return AppUI.notify('同じ名前のものがあります', 'error');
          await MetaOS.fs.rename(p, np);
          await navigate(cwd, { select: np });
        } catch (e) {
          AppUI.notify(`変えられませんでした: ${e && e.message}`, 'error');
        }
      }
      async function trashSelected() {
        const ps = [...selected];
        if (!ps.length) return;
        const ok = await AppUI.confirm(`${ps.length} 件をゴミ箱へ移します。よろしいですか？`, 'ゴミ箱へ');
        if (!ok) return;
        const failed = [];
        for (const p of ps) {
          try {
            await MetaOS.fs.delete(p); // 既定はゴミ箱へ（permanent ではない）
          } catch (e) {
            failed.push(`${basename(p)}: ${e && e.message}`);
          }
        }
        if (failed.length) AppUI.notify(`移せなかったものがあります:\n${failed.join('\n')}`, 'error');
        await navigate(cwd);
      }

      // ---------- 取り込む ----------
      function importFiles() {
        $('file-input').click();
      }
      async function importFileList(files) {
        const list = Array.from(files || []);
        if (!list.length) return;
        AppUI.showLoading(`${list.length} 件を取り込んでいます…`);
        const failed = [];
        let last = null;
        try {
          for (const f of list) {
            const p = `${cwd}/${f.name}`;
            try {
              if (await MetaOS.fs.exists(p)) {
                const ok = await AppUI.confirm(`「${f.name}」は既にあります。置き換えますか？`, '取り込む');
                if (!ok) continue;
              }
              await MetaOS.fs.write(p, f, { overwrite: true });
              last = p;
            } catch (e) {
              failed.push(`${f.name}: ${e && e.message}`);
            }
          }
        } finally {
          AppUI.hideLoading();
        }
        if (failed.length) AppUI.notify(`取り込めなかったものがあります:\n${failed.join('\n')}`, 'error');
        else AppUI.notify(`${list.length - failed.length} 件を取り込みました`, 'success');
        await navigate(cwd, { select: last });
      }
      $('file-input').addEventListener('change', (ev) => {
        importFileList(ev.target.files).then(() => (ev.target.value = ''));
      });
      let dragDepth = 0;
      document.addEventListener('dragenter', (ev) => {
        if (!ev.dataTransfer || !Array.from(ev.dataTransfer.types).includes('Files')) return;
        dragDepth++;
        document.body.classList.add('dragging');
      });
      document.addEventListener('dragleave', () => {
        if (--dragDepth <= 0) {
          dragDepth = 0;
          document.body.classList.remove('dragging');
        }
      });
      document.addEventListener('dragover', (ev) => ev.preventDefault());
      document.addEventListener('drop', (ev) => {
        ev.preventDefault();
        dragDepth = 0;
        document.body.classList.remove('dragging');
        if (ev.dataTransfer && ev.dataTransfer.files.length) importFileList(ev.dataTransfer.files);
      });

      // ---------- AI に渡す ----------
      async function askAI() {
        const ps = [...selected];
        if (!ps.length) return;
        const files = ps.filter((p) => entries.find((e) => e.path === p && e.kind === 'file'));
        const dirs = ps.filter((p) => !files.includes(p));
        const label = ps.length === 1 ? `「${basename(ps[0])}」` : `${ps.length} 件`;
        const res = await AppUI.showMessageBox({
          title: 'AI に渡す',
          message: `${label}を AI に渡します。何をしてほしいか書いてください。`,
          type: 'question',
          prompt: { defaultValue: '' },
          buttons: [
            { label: 'やめる', value: null, style: 'normal', isCancel: true },
            { label: '渡す', value: 'ok', style: 'primary', isDefault: true },
          ],
        });
        if (!res || res.action === 'cancel' || res.action === null) return;
        const ask = String(res.value || '').trim() || '中身を確かめて、要点をまとめてください';
        const lines = [`次のファイルについて: ${ask}`];
        if (dirs.length)
          lines.push(`フォルダ: ${dirs.map((d) => '`' + d + '`').join(', ')}（中身は list_files で見てください）`);
        if (files.length) lines.push(`ファイル: ${files.map((f) => '`' + f + '`').join(', ')}`);
        try {
          await MetaOS.ai.ask(lines.join('\n'), { attachments: files });
        } catch (e) {
          AppUI.notify(`渡せませんでした: ${e && e.message}`, 'error');
        }
      }

      // ---------- キー ----------
      $('list').addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' && selected.size === 1) {
          const e = entries.find((x) => x.path === [...selected][0]);
          if (e) open(e);
        } else if (ev.key === 'Backspace' && !ev.target.matches('input')) {
          const p = parentOf(cwd);
          if (rootOf(p)) navigate(p);
        } else if (ev.key === 'Delete' && selected.size) {
          trashSelected();
        }
      });

      // ---------- 起動 ----------
      const init = async () => {
        if (!window.MetaOS) return setTimeout(init, 50);
        if (typeof MetaOS.host.revealInExplorer === 'function') $('btn-reveal').classList.remove('hidden');
        let args = {};
        try {
          args = (await MetaOS.system.getArgs()) || {};
        } catch (_) {}
        await navigate(args && args.path ? args.path : ROOTS[0].path);
        if (MetaOS.system.on) {
          let timer = null;
          MetaOS.system.on('vfs_mutation', (m) => {
            const p = m && m.path ? m.path : '';
            if (!rootOf(p)) return;
            clearTimeout(timer);
            timer = setTimeout(() => navigate(cwd), 200);
          });
          MetaOS.system.on('route_changed', (payload) => {
            if (payload && payload.args && payload.args.path) navigate(payload.args.path);
          });
        }
      };
      init();
    </script>
  </body>
</html>
