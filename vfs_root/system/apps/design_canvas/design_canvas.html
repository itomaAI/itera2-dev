<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Canvas</title>
    <script src="/system/vendor/tw.js"></script>
    <script src="/system/core/ui.js"></script>
    <script src="/system/core/std.js"></script>
  </head>
  <body class="bg-app text-text-main h-screen flex flex-col overflow-hidden">
    <!-- 文字は英語で置いてある。起動時に js/i18n.js の表から、OS の言語（appearance.locale）のものに差し替える
         （data-i18n は中の文字、data-i18n-title は title）。ここに文字を足すときは表にも足す -->
    <!-- 上の帯: ファイルと操作 -->
    <header class="flex items-center gap-2 px-3 py-2 border-b border-border-main bg-panel shrink-0">
      <button
        onclick="AppUI.home()"
        class="p-1.5 rounded-full hover:bg-hover text-text-muted hover:text-text-main"
        title="Home"
        data-i18n-title="app.home"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
      </button>
      <h1 class="text-base font-bold tracking-tight truncate min-w-0" data-i18n="app.title">Design Canvas</h1>
      <span id="file-label" class="text-sm text-text-muted truncate min-w-0 max-w-[24rem]"></span>
      <div class="flex-1"></div>
      <div class="flex items-center gap-1 text-sm whitespace-nowrap shrink-0">
        <button
          id="btn-new"
          class="px-2 py-1 rounded hover:bg-hover"
          title="New design"
          data-i18n="app.new"
          data-i18n-title="app.new.tip"
        >
          New
        </button>
        <button
          id="btn-open"
          class="px-2 py-1 rounded hover:bg-hover"
          title="Open a design file"
          data-i18n="app.open"
          data-i18n-title="app.open.tip"
        >
          Open
        </button>
        <button
          id="btn-save"
          class="px-2 py-1 rounded hover:bg-hover"
          title="Save (Ctrl+S)"
          data-i18n="app.save"
          data-i18n-title="app.save.tip"
        >
          Save
        </button>
        <button
          id="btn-saveas"
          class="px-2 py-1 rounded hover:bg-hover"
          title="Save as (Ctrl+Shift+S)"
          data-i18n="app.saveAs"
          data-i18n-title="app.saveAs.tip"
        >
          Save as
        </button>
        <span class="w-px h-5 bg-border-main mx-1"></span>
        <button
          id="btn-undo"
          class="px-2 py-1 rounded hover:bg-hover disabled:opacity-40"
          title="Undo (Ctrl+Z)"
          data-i18n-title="app.undo.tip"
        >
          ↶
        </button>
        <button
          id="btn-redo"
          class="px-2 py-1 rounded hover:bg-hover disabled:opacity-40"
          title="Redo (Ctrl+Y)"
          data-i18n-title="app.redo.tip"
        >
          ↷
        </button>
        <button
          id="btn-fit"
          class="px-2 py-1 rounded hover:bg-hover"
          title="Show everything (Ctrl+0)"
          data-i18n="app.fit"
          data-i18n-title="app.fit.tip"
        >
          Fit
        </button>
        <span class="w-px h-5 bg-border-main mx-1"></span>
        <button
          id="btn-preview"
          class="px-2 py-1 rounded border border-border-main hover:bg-hover"
          title="Try it out, starting from the selected screen"
          data-i18n="app.preview"
          data-i18n-title="app.preview.tip"
        >
          ▶ Preview
        </button>
        <button
          id="btn-send"
          class="px-3 py-1 rounded bg-primary text-text-inverted hover:opacity-90"
          title="Save, then send a summary, the file path and screen images to the AI"
          data-i18n="app.send"
          data-i18n-title="app.send.tip"
        >
          Send to AI
        </button>
      </div>
    </header>

    <!-- 外での書き換えの知らせ -->
    <div
      id="banner"
      class="hidden items-center gap-2 px-3 py-1.5 text-sm bg-warning/15 text-text-main border-b border-warning/40 shrink-0"
    ></div>

    <div class="flex-1 flex min-h-0">
      <!-- 左: 追加 -->
      <aside class="w-44 shrink-0 border-r border-border-main bg-panel flex flex-col min-h-0">
        <div class="p-2 flex flex-col gap-1 border-b border-border-main">
          <div class="text-xs font-bold text-text-muted px-2 pt-1" data-i18n="app.screens">Screens</div>
          <button
            id="btn-add-desktop"
            class="w-full text-left px-2 py-1.5 rounded text-sm hover:bg-hover"
            data-i18n="app.addDesktop"
          >
            + Desktop screen
          </button>
          <button
            id="btn-add-phone"
            class="w-full text-left px-2 py-1.5 rounded text-sm hover:bg-hover"
            data-i18n="app.addPhone"
          >
            + Phone screen
          </button>
          <button
            id="btn-add-note"
            class="w-full text-left px-2 py-1.5 rounded text-sm hover:bg-hover"
            data-i18n="app.addNote"
          >
            + Sticky note
          </button>
        </div>
        <div class="text-xs font-bold text-text-muted px-4 pt-3 pb-1" data-i18n="app.parts">Parts</div>
        <div id="palette" class="flex-1 overflow-y-auto px-2 pb-2 flex flex-col"></div>
      </aside>

      <!-- 中央: キャンバス -->
      <main id="viewport" class="flex-1 min-w-0 bg-hover/40"></main>

      <!-- 右: 設定 -->
      <aside id="panel" class="w-72 shrink-0 border-l border-border-main bg-panel overflow-y-auto"></aside>
    </div>

    <footer class="px-3 py-1 border-t border-border-main bg-panel shrink-0">
      <div id="status" class="text-xs text-text-muted truncate"></div>
    </footer>

    <script defer src="/system/apps/design_canvas/js/i18n.js"></script>
    <script defer src="/system/apps/design_canvas/js/parts.js"></script>
    <script defer src="/system/apps/design_canvas/js/model.js"></script>
    <script defer src="/system/apps/design_canvas/js/editor.js"></script>
    <script defer src="/system/apps/design_canvas/js/panel.js"></script>
    <script defer src="/system/apps/design_canvas/js/preview.js"></script>
    <script defer src="/system/apps/design_canvas/js/snapshot.js"></script>
    <script defer src="/system/apps/design_canvas/js/main.js"></script>
  </body>
</html>
