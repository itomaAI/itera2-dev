<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loom</title>
    <script src="/system/vendor/tw.js"></script>
    <script src="/system/core/ui.js"></script>
    <script src="/system/core/std.js"></script>
    <script src="/system/lib/loom_core.js"></script>
  </head>
  <body class="bg-app text-text-main h-screen flex flex-col overflow-hidden">
    <header class="flex items-center justify-between px-5 py-3 border-b border-border-main shrink-0">
      <div class="flex items-center gap-3">
        <button
          onclick="toggleList()"
          class="md:hidden p-2 -ml-2 rounded-full hover:bg-hover text-text-muted hover:text-text-main transition"
          title="一覧を出す／隠す"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
        <button
          onclick="AppUI.home()"
          class="p-2 -ml-2 rounded-full hover:bg-hover text-text-muted hover:text-text-main transition"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            ></path>
          </svg>
        </button>
        <h1 class="text-xl font-bold tracking-tight">Loom</h1>
        <span class="text-[0.6875rem] text-text-muted hidden sm:inline">プロジェクトの系譜と、その下の仕事</span>
      </div>
      <div class="flex items-center gap-2">
        <button
          onclick="refresh()"
          class="p-2 rounded hover:bg-hover text-text-muted hover:text-primary transition"
          title="再読込"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
            ></path>
          </svg>
        </button>
        <button
          onclick="newProject()"
          class="px-3 py-2 rounded-lg bg-primary text-text-inverted text-sm font-bold hover:bg-primary/90 shadow transition"
        >
          ＋ プロジェクト
        </button>
      </div>
    </header>

    <div class="flex-1 flex min-h-0 relative">
      <!-- スマホ幅では一覧を引き出しにする（md 未満で畳む。既定は隠す。札を選ぶと閉じる） -->
      <div id="list-overlay" onclick="toggleList()" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>
      <aside
        id="list-pane"
        class="absolute md:relative inset-y-0 left-0 z-30 w-80 max-w-[85vw] md:max-w-none bg-panel md:bg-transparent shrink-0 border-r border-border-main flex flex-col min-h-0 transform -translate-x-full md:translate-x-0 transition-transform duration-200 shadow-2xl md:shadow-none"
      >
        <div id="views" class="flex flex-wrap gap-1 p-3 border-b border-border-main shrink-0"></div>
        <div id="list" class="flex-1 overflow-y-auto p-2"></div>
      </aside>
      <main id="detail" class="flex-1 overflow-y-auto min-h-0"></main>
    </div>

    <script>
      // ============================================================
      // Loom — プロジェクトネイティブな作業板
      //
      // 記法の正は docs/manual/loom_notation.md。
      //
      // 【この道具が“やらないこと”】
      //   畳む（総括・文脈生成・追随・再生成）のは Itera の仕事であって、この道具ではない。
      //   ボタンは「畳んでくれ」と依頼を送るだけで、要約文そのものを機械で作らない。
      //   —— 決定「人が意図を置き、私が畳む。移すのは誰でもよい」に従う。
      // ============================================================

      // 器の型・時刻・語彙は核（system/lib/loom_core.js）にある（T-0531）。デーモンと同じ定義を使う。
      //   タスクの手番（ball）は status から導く派生値で、保存しない。
      //   toISOString() は UTC で JST と 9 時間ずれるので、時刻は核の localDate / stamp を使う。
      const {
        DIR,
        localDate,
        todayStr,
        stamp,
        nowIso,
        P_STATUS,
        T_STATUS,
        SECTIONS_P,
        SECTIONS_T,
        isProject,
        statusDef,
        isClosed,
        logSection,
        recapName,
        EVENTS,
      } = LoomCore;
      const EVENT_ICON = {
        分岐: '⑂',
        継承: '⇥',
        起票: '＋',
        分解: '⋔',
        完了: '✓',
        転記: '↑',
        中止: '✕',
        再生成: '↻',
        追随: '→',
      };
      const EVENT_CLS = {
        分岐: 'text-primary',
        継承: 'text-warning',
        起票: 'text-primary',
        分解: 'text-primary',
        完了: 'text-success',
        転記: 'text-success',
        中止: 'text-text-muted',
        再生成: 'text-warning',
        追随: 'text-warning',
      };

      let nodes = [];
      let selectedId = null;
      let editing = false;
      /**
       * 編集を始めた時点の本文（競合判定の基準）。
       *
       * ★ baseBody（読み込み時点の本文）を基準にしてはいけない。
       *   refresh() は編集中でも baseBody を最新のディスク内容へ更新するので、
       *   その間に外部（Itera）が追記していると「差が無い」と判定され、
       *   **画面に残っている古い本文でディスクを上書きしてしまう**。
       *   2026-08-23 の実機試験で、追記した総括が実際にこの経路で消えた。
       *   基準は必ず「いま画面に出ている文章の出どころ」でなければならない。
       */
      let editBase = null; // { id, body }
      let view = 'tree';
      let showClosed = false;
      let showTasks = true;
      const collapsed = new Set();

      // ---------- 開閉状態を憶える（T-0202） ----------
      // ★ 板のディレクトリ（DIR）には置かない。全景がファイル数と札の数を突き合わせるので、
      //   別形式のファイルを混ぜると「読めなかったファイル」として警告に出る。
      const UI_STATE = 'data/apps/loom_ui.json';
      let uiLoaded = false;
      let uiSaveTimer = null;

      /**
       * 表示上の親。**`meta.parent` とは違う。**
       * 継承では前任の子が後継の下に出る（辺は書き換えず、描画側で合併している）。
       * 「道を開く」で parent の鎖を辿ると、**畳んだままの後継**が残って札は見えないままになる。
       * だから木の描画（childrenOf）と同じ解決をここでも使う。
       */
      function displayParentMap() {
        const m = new Map();
        for (const p of nodes) {
          if (isProject(p) && successorOf(p.meta.id)) continue; // 前任は後継に吸収される
          for (const c of childrenOf(p.meta.id)) if (!m.has(c.meta.id)) m.set(c.meta.id, p.meta.id);
        }
        return m;
      }

      /**
       * 選んだ札までの道を開く。開いたら true。
       * ★ これが無いと、畳んだ既定のせいで「選んだのに画面に出ない」が起きる。
       *   行がそもそも描かれないので scrollIntoView も黙って何もしない。
       *   起票・分岐の直後や、通知から開いたときに必ず踏む。
       */
      function openPathTo(id) {
        if (!id) return false;
        const m = displayParentMap();
        const seen = new Set([id]);
        let cur = id;
        let changed = false;
        for (let i = 0; i < 100; i++) {
          const p = m.get(cur);
          if (!p || seen.has(p)) break;
          seen.add(p);
          if (collapsed.delete(p)) changed = true;
          cur = p;
        }
        return changed;
      }

      const hasKids = (n) => childrenOf(n.meta.id).length > 0;

      /** 記録を読む。**札を読み終えた後に呼ぶ**（初回の既定が nodes に依るため）。 */
      async function loadUiState() {
        uiLoaded = true;
        try {
          if (await MetaOS.fs.exists(UI_STATE)) {
            const j = JSON.parse(await MetaOS.fs.read(UI_STATE));
            if (j && Array.isArray(j.collapsed)) {
              collapsed.clear();
              for (const id of j.collapsed) collapsed.add(id);
              return;
            }
          }
        } catch (e) {
          // 壊れていても止めない（憶えていないだけで仕事はできる）が、**黙らない**。
          // 静かに既定へ戻すと、利用者は「畳んだはずが毎回開いている」理由を知る手段が無い。
          AppUI.notify('開閉状態の記録を読めませんでした。既定（すべて畳む）で始めます: ' + errMsg(e), 'warning', 4000);
        }
        // 記録が無い（初回）。**子を持つ札を畳む** —— 全部開いていて探せないのが依頼の出発点。
        collapsed.clear();
        for (const n of nodes) if (hasKids(n)) collapsed.add(n.meta.id);
        saveUiState();
      }

      function saveUiState() {
        if (!uiLoaded) return; // 読む前に書くと、記録を空で潰す
        clearTimeout(uiSaveTimer);
        uiSaveTimer = setTimeout(async () => {
          try {
            await MetaOS.fs.write(UI_STATE, JSON.stringify({ collapsed: [...collapsed] }), {
              overwrite: true,
              silent: true, // 開閉のたびに同期を鳴らさない
            });
          } catch (e) {
            // ★ 黙って捨てない。捨てると「畳んだはずが次に開くと戻っている」が理由不明で続く。
            AppUI.notify('開閉状態を保存できませんでした: ' + errMsg(e), 'warning', 4000);
          }
        }, 400);
      }
      // 読めなかった／id が無くて捨てたファイル。捨てたことを黙っていると、板から静かに 1 枚消える。
      let loadSkips = [];
      let lastTreeScrollId = null;

      const DOM = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

      // ============================================================
      // 解析と系譜 —— 実体は核（system/lib/loom_core.js）にある（T-0531）。
      // デーモン（system/services/loom.html）と同じ算法を 1 つだけ持つため、ここでは名前を借りるだけにする。
      // 系譜の関数は `nodes`（画面の札の配列）を見る。札は索引の行（meta と派生値 d）で、
      // 本文（body）を持つのは選んでいる札だけ。一覧の描画は派生値だけで足りる。
      // ============================================================
      const {
        parseNode,
        serializeNode,
        sectionRange,
        sectionText,
        appendToSection,
        replaceSection,
        planStats,
        parseContext,
        parseRecaps,
        parseEntries,
        pendingRecaps,
        byIdAsc,
      } = LoomCore;
      const LINEAGE = LoomCore.lineage(() => nodes);
      const {
        byId,
        directChildren,
        predecessors,
        successorOf,
        childrenOf,
        ancestorsOf,
        owningProject,
        resolveTitles,
        tasksOf,
        subProjectsOf,
        projectRoots,
        staleSources,
        lastLogAt,
      } = LINEAGE;

      // ============================================================
      // 最小マークダウン（Handoff の mdRender を Loom の語彙に合わせたもの）
      // ============================================================
      function mdRender(src, clickRange) {
        const attrq = (s) => String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        const inline = (s) => {
          let h = esc(s);
          const codes = [];
          h = h.replace(/`([^`]+)`/g, (m, c) => `\u0000${codes.push(c) - 1}\u0000`);
          h = h
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')
            .replace(/~~([^~]+)~~/g, '<del class="text-text-muted">$1</del>');
          // リンクは http/https だけ。他のスキームを <a> にすると javascript: を踏める。
          h = h.replace(
            /\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,
            (m, t, u) =>
              `<a href="${attrq(u)}" target="_blank" rel="noopener" class="text-primary hover:underline">${t || u}</a>`,
          );
          h = h.replace(
            /(^|[\s(])(https?:\/\/[^\s<)]+)/g,
            (m, pre, u) =>
              `${pre}<a href="${attrq(u)}" target="_blank" rel="noopener" class="text-primary hover:underline">${u}</a>`,
          );
          return h.replace(
            /\u0000(\d+)\u0000/g,
            (m, k) => `<code class="px-1 rounded bg-hover font-mono text-[0.8em]">${codes[k]}</code>`,
          );
        };

        const SLOT_CLS = {
          決定: 'text-success border-success/40 bg-success/10',
          却下: 'text-text-muted border-border-main',
          未解決: 'text-warning border-warning/40 bg-warning/10',
          成果物: 'text-primary border-primary/40 bg-primary/10',
        };
        const renderEventBody = (ls) => {
          const segs = [];
          let cur = { head: null, lines: [] };
          ls.forEach((l) => {
            const m = l.match(/^\*\*(.+?)\*\*\s*$/);
            if (m) {
              segs.push(cur);
              cur = { head: m[1].trim(), lines: [] };
            } else cur.lines.push(l);
          });
          segs.push(cur);
          return segs
            .map((s) => {
              const raw = s.lines.join('\n');
              const inner = raw.trim() ? mdRender(raw, null) : '';
              if (!s.head && !inner) return '';
              const cls = SLOT_CLS[s.head] || 'text-text-muted border-border-main';
              const head = s.head
                ? `<div class="mt-2 mb-1 first:mt-0"><span class="px-1.5 py-0.5 rounded border text-[0.6875rem] font-bold ${cls}">${inline(s.head)}</span></div>`
                : '';
              return `${head}${inner ? `<div class="pl-2">${inner}</div>` : ''}`;
            })
            .join('');
        };

        const withTitles = resolveTitles;

        // ★ 以前はこの正規表現を「行ごとに」組み立てていた。1 枚 1500 行の札で 1500 回の
        //   コンパイルになる（2026-08-24）。EVENTS は定数なので、描画ごとに 1 回でよい。
        const EV_RE = new RegExp(
          '^\\s*- (\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}) (' + EVENTS.join('|') + ')[:：]?\\s*(.*)$',
        );

        const lines = String(src).split('\n');
        const out = [];
        let i = 0;
        const isEntry = (l) => /^\s*- \d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(l);
        const isHead = (l) => /^#{1,6} /.test(l);

        while (i < lines.length) {
          const line = lines[i];

          if (/^\s*```/.test(line)) {
            const buf = [];
            let j = i + 1;
            while (j < lines.length && !/^\s*```\s*$/.test(lines[j])) (buf.push(lines[j]), j++);
            out.push(
              `<pre class="my-2 p-3 rounded-lg bg-panel border border-border-main overflow-x-auto"><code class="font-mono text-[0.75rem] leading-relaxed whitespace-pre">${esc(buf.join('\n'))}</code></pre>`,
            );
            i = j + 1;
            continue;
          }

          if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
            const cells = (l) =>
              l
                .trim()
                .replace(/^\|/, '')
                .replace(/\|$/, '')
                .split('|')
                .map((c) => c.trim());
            const align = cells(lines[i + 1]).map((c) =>
              /^:.*:$/.test(c) ? 'center' : /:$/.test(c) ? 'right' : 'left',
            );
            const head = cells(line);
            let j = i + 2;
            const rows = [];
            while (j < lines.length && /^\s*\|.*\|\s*$/.test(lines[j])) (rows.push(cells(lines[j])), j++);
            const th = head
              .map(
                (c, k) =>
                  `<th class="px-2 py-1 border border-border-main bg-hover font-bold" style="text-align:${align[k] || 'left'}">${inline(c)}</th>`,
              )
              .join('');
            const tb = rows
              .map(
                (r) =>
                  `<tr>${r.map((c, k) => `<td class="px-2 py-1 border border-border-main align-top" style="text-align:${align[k] || 'left'}">${inline(c)}</td>`).join('')}</tr>`,
              )
              .join('');
            out.push(
              `<div class="my-2 overflow-x-auto"><table class="text-xs border-collapse"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>`,
            );
            i = j;
            continue;
          }

          // 出来事。枠の終端は「次の日時つきの行、または次の見出し」。
          // 字下げに頼らない ── 手で書くと全行の字下げが最も落ちやすい。
          const ev = line.match(EV_RE);
          if (ev) {
            const kind = ev[2];
            const cls = EVENT_CLS[kind] || 'text-text-muted';
            const bd = cls.replace('text-', 'border-') + '/50';
            const buf = [];
            let j = i + 1;
            while (j < lines.length && !isEntry(lines[j]) && !isHead(lines[j])) {
              buf.push(lines[j]);
              j++;
            }
            while (buf.length && !buf[buf.length - 1].trim()) buf.pop();
            const widths = buf.filter((l) => l.trim()).map((l) => (l.match(/^\s*/) || [''])[0].length);
            const pad = widths.length ? Math.min.apply(null, widths) : 0;
            const evBody = buf.length ? renderEventBody(buf.map((l) => l.slice(pad))) : '';
            out.push(
              `<div class="my-2 pl-2 border-l-2 ${bd} ${evBody ? 'pr-2 pb-2 rounded-r bg-hover/40' : ''}">
                 <div class="flex flex-wrap items-baseline gap-2 py-1">
                   <span class="${cls} font-bold shrink-0">${EVENT_ICON[kind] || '・'}</span>
                   <span class="text-[0.6875rem] font-mono text-text-muted shrink-0">${esc(ev[1])}</span>
                   <span class="font-bold ${cls} shrink-0">${kind}</span>
                   <span>${inline(withTitles(ev[3]))}</span>
                 </div>
                 ${evBody ? `<div class="mt-1 ml-1 pl-3 border-l border-border-main">${evBody}</div>` : ''}
               </div>`,
            );
            i = j;
            continue;
          }

          // 総括・レポートの見出しは、時系列の中の「区切り」として目立たせる。
          const rc = line.match(/^###\s+(総括|レポート)\s+(\d{4}-\d{2}-\d{2} \d{2}:\d{2})\s*(.*)$/);
          if (rc) {
            // ★ 札と日時は縮ませない。縮むと「レポート」の 4 文字が 2 行に割れる（2026-08-23 / T-0003）。
            out.push(`<div class="mt-4 mb-1 flex items-center gap-2 flex-wrap">
              <span class="shrink-0 whitespace-nowrap px-2 py-0.5 rounded-full border text-[0.6875rem] font-bold text-success border-success/40 bg-success/10">${rc[1]}</span>
              <span class="shrink-0 whitespace-nowrap text-[0.6875rem] font-mono text-text-muted">${esc(rc[2])}</span>
              <span class="text-[0.6875rem] text-text-muted min-w-0">${inline(withTitles(rc[3]))}</span>
              <span class="flex-1 h-px bg-border-main"></span>
            </div>`);
            i++;
            continue;
          }

          // 文脈の源の見出し（### P-0045「題」より ／ ### path/to/doc.md「題」より）
          const cs = line.match(/^###\s+([^「\s]+)\s*(?:「([^」]*)」)?\s*より\s*$/);
          if (cs) {
            const inner = /^(?:P|T)-\d{4}$/.test(cs[1]);
            const label = `${esc(cs[1])}${cs[2] ? '「' + esc(cs[2]) + '」' : ''}`;
            out.push(`<div class="mt-4 mb-1 flex items-center gap-2 flex-wrap">
              <span class="shrink-0 whitespace-nowrap px-2 py-0.5 rounded-full border text-[0.6875rem] font-bold text-warning border-warning/40 bg-warning/10">文脈の源</span>
              <button onclick="${inner ? `select('${esc(cs[1])}')` : `openRef('${esc(cs[1])}')`}" class="text-xs font-bold hover:text-primary hover:underline ${inner ? '' : 'font-mono'}">${label}</button>
              <span class="flex-1 h-px bg-border-main"></span>
            </div>`);
            i++;
            continue;
          }

          const cb = line.match(/^(\s*)- \[( |x|X|~)\] (.*)$/);
          if (cb) {
            const st = cb[2].toLowerCase();
            const icon = st === 'x' ? '☑' : st === '~' ? '◐' : '☐';
            const iconCls = st === 'x' ? 'text-success' : st === '~' ? 'text-warning' : 'text-text-muted';
            const textCls = st === 'x' ? 'line-through text-text-muted' : '';
            const inRange = clickRange && i >= clickRange[0] && i < clickRange[1];
            const mark = inRange
              ? `<button onclick="cyclePlan(${i})" class="${iconCls} hover:scale-125 transition" title="クリックで 未着手→作業中→完了">${icon}</button>`
              : `<span class="${iconCls}">${icon}</span>`;
            out.push(
              `<div class="flex gap-2 py-0.5" style="padding-left:${cb[1].length * 8}px">${mark}<span class="${textCls}">${inline(cb[3])}</span></div>`,
            );
            i++;
            continue;
          }

          if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) {
            out.push('<hr class="my-3 border-border-main">');
            i++;
            continue;
          }

          if (/^\s*>/.test(line)) {
            out.push(
              `<div class="my-0.5 pl-3 border-l-2 border-primary/40 text-text-muted">${inline(line.replace(/^\s*> ?/, ''))}</div>`,
            );
            i++;
            continue;
          }

          const ol = line.match(/^(\s*)(\d+)\. (.*)$/);
          if (ol) {
            out.push(
              `<div class="flex gap-2 py-0.5" style="padding-left:${ol[1].length * 8}px"><span class="text-text-muted font-mono shrink-0">${ol[2]}.</span><span>${inline(ol[3])}</span></div>`,
            );
            i++;
            continue;
          }

          if (/^## /.test(line))
            out.push(
              `<h3 class="text-sm font-bold text-primary mt-5 mb-2 pb-1 border-b border-border-main">${inline(line.slice(3))}</h3>`,
            );
          else if (/^#### /.test(line))
            out.push(`<h5 class="text-xs font-bold text-text-muted mt-2 mb-1">${inline(line.slice(5))}</h5>`);
          else if (/^### /.test(line))
            out.push(`<h4 class="text-sm font-bold mt-3 mb-1">${inline(line.slice(4))}</h4>`);
          else if (/^\s*- /.test(line)) {
            const indent = (line.match(/^\s*/) || [''])[0].length;
            out.push(
              `<div class="flex gap-2 py-0.5" style="padding-left:${indent * 8}px"><span class="text-text-muted shrink-0">・</span><span>${inline(withTitles(line.replace(/^\s*- /, '')))}</span></div>`,
            );
          } else if (line.trim() === '') out.push('<div class="h-2"></div>');
          else out.push(`<div class="py-0.5 leading-relaxed">${inline(line)}</div>`);
          i++;
        }
        return out.join('');
      }

      // ============================================================
      // ストレージ —— **この画面は書かない**（T-0531）。
      // 札の読み書きはデーモン（system/services/loom.html）が「読み直す → 変換する → 書き込む」を 1 本の列で行う
      // （Handoff T-0007 の事故: メモリの本文で全文上書きし、相手の追記を消した ── その規律はデーモン側に移った）。
      // 旧実装（Store / mutate / freshForTransfer / deliverToParent）は git の履歴（T-0531 より前の vfs_root/apps/loom.html）にある。
      // ============================================================
      const fileOf = (id) => `${DIR}/${id}.md`;
      const errMsg = (e) => (e && e.message) || String(e);
      const norm = (s) => String(s == null ? '' : s).trim();
      const META_KEYS = ['title', 'status', 'priority', 'scheduled', 'refs', 'parent', 'supersedes'];

      // ============================================================
      // 通知（Itera へ）
      // ============================================================
      function lineNoOf(text, line) {
        const i = String(text).split('\n').indexOf(line);
        return i < 0 ? null : i + 1;
      }
      function readHint(f, line) {
        if (!f || !f.text) return '';
        const total = String(f.text).split('\n').length;
        const n = line ? lineNoOf(f.text, line) : null;
        if (!n) return `${f.path}（全 ${total} 行）を読んでください。`;
        const s = Math.max(1, n - 4);
        const e = Math.min(total, n + 4);
        return `追記は ${f.path} の ${n} 行目です（全 ${total} 行）。start=${s} end=${e} を読めば足ります。`;
      }

      // 規律が効くのは「着手の瞬間に文脈へ届く」ときだけ。要点だけを短く同梱する。
      // ここを長くしない。長い通知は読まれない。
      const RULE_TAIL = [
        '',
        '---',
        '【Loom の作法】着手前に memory/rules/loom.md を読む —— そこが私の動き方の正。',
        '記法の正は docs/manual/loom_notation.md。',
        '以下は要点の再掲であって、文書の代わりにはならない:',
        '1. 着手前に、親を根まで遡って本文を読む（タスクなら所属プロジェクトの 意図・文脈・履歴 まで）',
        '2. 畳むのは私の仕事。転記は畳まない（子の総括をそのまま親へ載せる）',
        '3. 決めたその場で 総括／レポート に書く（決定・却下・未解決。却下枠を省略しない）',
        '4. 追記は必ず日時から始める（- YYYY-MM-DD HH:MM 名前: 本文。時刻は get_time で取る）',
        '5. 知識はプロジェクトに置く。タスクは仕事の置き場（閉じると失われる）',
        '6. 答えが要るときは ## 確認事項 に書き、チャットでも言う',
      ].join('\n');

      async function notifyAI(message) {
        const body = String(message) + RULE_TAIL;
        try {
          if (MetaOS.ai && MetaOS.ai.task) await MetaOS.ai.task(body, null, { silent: false });
          else await App.AI.logEvent(body, 'loom', true);
        } catch (e) {
          await App.AI.logEvent(body, 'loom', true);
        }
      }

      // ============================================================
      // 描画
      // ============================================================
      const VIEWS = {
        tree: { label: '系譜' },
        ai: { label: 'Iteraの番', test: (n) => !isProject(n) && T_STATUS[n.meta.status]?.ball === 'ai' },
        user: { label: 'あなたの番', test: (n) => !isProject(n) && T_STATUS[n.meta.status]?.ball === 'user' },
        today: {
          label: '今日',
          test: (n) => !isProject(n) && !!n.meta.scheduled && n.meta.scheduled <= todayStr() && !isClosed(n),
        },
        closed: { label: '閉じた', test: (n) => isClosed(n) },
        census: { label: '全景', test: () => true },
      };

      // すべて開く／すべて閉じる（T-0202）。畳んだ既定から戻れるようにするためのもの。
      window.collapseAll = () => {
        collapsed.clear();
        for (const n of nodes) if (hasKids(n)) collapsed.add(n.meta.id);
        openPathTo(selectedId); // 閉じた瞬間に、選んでいる札を見失わない
        saveUiState();
        renderAll();
      };
      window.expandAll = () => {
        collapsed.clear();
        saveUiState();
        renderAll();
      };

      function renderViews() {
        const btns = Object.entries(VIEWS)
          .map(([k, v]) => {
            const n = v.test ? nodes.filter(v.test).length : nodes.filter(isProject).filter((p) => !isClosed(p)).length;
            const on = k === view;
            return `<button onclick="setView('${k}')" class="px-2.5 py-1 rounded-full text-xs font-medium transition ${on ? 'bg-primary text-text-inverted' : 'text-text-muted hover:bg-hover'}">${v.label}<span class="ml-1 opacity-70">${n}</span></button>`;
          })
          .join('');
        const extra =
          view === 'tree'
            ? `<button onclick="toggleTasks()" class="px-2.5 py-1 rounded-full text-xs transition ${showTasks ? 'bg-hover' : 'text-text-muted hover:bg-hover'}" title="プロジェクトの下にタスクを出す">タスク</button>
             <button onclick="toggleClosed()" class="px-2.5 py-1 rounded-full text-xs transition ${showClosed ? 'bg-hover' : 'text-text-muted hover:bg-hover'}" title="凍結・継承済み・完了も出す">閉じたもの</button>
             <span class="mx-1 text-text-muted opacity-40">|</span>
             <button onclick="collapseAll()" class="px-2.5 py-1 rounded-full text-xs text-text-muted hover:bg-hover transition" title="すべて畳む（選んでいる札までの道は開いたまま）">すべて閉じる</button>
             <button onclick="expandAll()" class="px-2.5 py-1 rounded-full text-xs text-text-muted hover:bg-hover transition" title="すべて開く">すべて開く</button>`
            : '';
        DOM('views').innerHTML = btns + extra;
      }

      function nodeCard(n, depth = 0) {
        const st = statusDef(n);
        const on = n.meta.id === selectedId;
        const proj = isProject(n);
        const indent = depth * 14;
        const kids = proj ? childrenOf(n.meta.id).length : 0;
        const stale = proj ? staleSources(n).length : 0;
        const pend = LoomCore.dOf(n).pending;
        const pri = proj
          ? ''
          : n.meta.priority === 'high'
            ? '<span class="text-error font-bold">●</span> '
            : n.meta.priority === 'low'
              ? '<span class="text-text-muted">○</span> '
              : '<span class="text-warning">●</span> ';
        const plan = proj ? null : LoomCore.dOf(n).plan;
        return `<button onclick="select('${n.meta.id}')" style="margin-left:${indent}px;width:calc(100% - ${indent}px)"
          class="text-left p-2.5 mb-1.5 rounded-lg border transition ${on ? 'bg-panel border-primary' : 'bg-panel/50 border-border-main hover:border-primary/40'} ${isClosed(n) ? 'opacity-60' : ''} ${proj ? 'border-l-4 border-l-primary/60' : ''}">
          <div class="flex items-center gap-1.5 mb-1">
            <span class="text-[0.625rem] px-1.5 py-0.5 rounded border font-bold ${st.cls}">${st.label}</span>
            ${!proj && n.meta.scheduled ? `<span class="text-[0.625rem] font-mono ${n.meta.scheduled < todayStr() && !isClosed(n) ? 'text-error font-bold' : 'text-text-muted'}">${esc(n.meta.scheduled.slice(5))}</span>` : ''}
            ${proj && kids ? `<span class="text-[0.625rem] font-mono text-text-muted">子 ${kids}</span>` : ''}
            ${stale ? `<span class="text-[0.625rem] text-warning font-bold" title="上流が伸びています（追随が要る）">→ ${stale}</span>` : ''}
            ${pend ? `<span class="text-[0.625rem] text-success font-bold" title="親へ渡していない${recapName(n)}">↑ ${pend}</span>` : ''}
            <span class="text-[0.625rem] text-text-muted font-mono ml-auto">${esc(n.meta.id)}</span>
          </div>
          <div class="text-xs ${proj ? 'font-bold' : 'font-medium'} leading-snug ${isClosed(n) ? 'line-through text-text-muted' : ''}">${pri}${esc(n.meta.title)}</div>
          ${
            plan
              ? `<div class="flex items-center gap-1.5 mt-1.5">
            <div class="flex-1 h-1 rounded-full bg-hover overflow-hidden"><div class="h-full bg-success transition-all" style="width:${Math.round((plan.done / plan.total) * 100)}%"></div></div>
            <span class="text-[0.625rem] font-mono text-text-muted">${plan.done}/${plan.total}</span></div>`
              : ''
          }
        </button>`;
      }

      /** 系譜。プロジェクトが主役で、タスクはその下にぶら下がる。 */
      function renderTree(el) {
        const out = [];
        const seen = new Set();
        /**
         * 描かないが「辿り着いた」ことにする。
         * ★ ここを怠ると、末尾の救済ループが**畳んだ枝の子を孤児とみなして根として描き直す**。
         *   畳んでも消えず、むしろ増える —— Handoff が一度直した穴で、移植のときに戻してしまった
         *   （2026-08-23 / T-0003。「描いた」と「辿り着いた」は違う）。
         */
        const coverAll = (n) => {
          for (const c of childrenOf(n.meta.id)) {
            if (seen.has(c.meta.id)) continue;
            seen.add(c.meta.id);
            coverAll(c);
          }
        };
        /**
         * 開いた子孫を持つか。
         * ★ 閉じた札を打ち切ると、その下の「開いた子」ごと画面から消える。
         *   実データで T-0156(todo) と T-0158(blocked) が、閉じた親 T-0134 の下で消えていた
         *   （2026-08-23 / T-0011）。経路は残す。
         */
        const hasOpenDesc = (n) => childrenOf(n.meta.id).some((c) => !isClosed(c) || hasOpenDesc(c));
        /**
         * タスクを深さの上限なく辿る。
         * ★ 以前はここが「直下のタスク＋その子 1 段」の手書きで、再帰していなかった。
         *   Handoff から移した実データは 5 段あり、4 段目以降が黙って出なかった（同 T-0011）。
         *   救済ループ（下）はプロジェクトしか拾わないので、落ちても気づけない。
         */
        const walkT = (t, depth) => {
          if (seen.has(t.meta.id)) return;
          seen.add(t.meta.id);
          if (!showClosed && isClosed(t) && !hasOpenDesc(t)) {
            coverAll(t);
            return;
          }
          // 分解されたタスクも畳めるようにする（プロジェクトと同じつまみ。2026-08-24 / T-0011）。
          // ★ 畳んだら coverAll で子孫を「辿り着いた」ことにする —— T-0003 と同じ穴を空けないため。
          const kidCount = childrenOf(t.meta.id).length;
          const isCol = collapsed.has(t.meta.id);
          const knob = kidCount
            ? `<button onclick="toggleNode('${t.meta.id}')" class="shrink-0 w-4 pt-3 text-text-muted hover:text-primary transition">${isCol ? '▸' : '▾'}</button>`
            : '<span class="shrink-0 w-4"></span>';
          out.push(
            `<div id="row-${esc(t.meta.id)}" class="flex items-start gap-1" style="margin-left:${depth * 14}px">${knob}<div class="flex-1 min-w-0">${nodeCard(t, 0)}</div></div>`,
          );
          if (isCol) {
            coverAll(t);
            return;
          }
          for (const sub of childrenOf(t.meta.id)) walkT(sub, depth + 1);
        };
        const walkP = (p, depth) => {
          if (seen.has(p.meta.id)) return;
          seen.add(p.meta.id);
          if (!showClosed && isClosed(p) && !hasOpenDesc(p)) {
            coverAll(p);
            return;
          }
          const kidCount = childrenOf(p.meta.id).length;
          const isCol = collapsed.has(p.meta.id);
          const knob = kidCount
            ? `<button onclick="toggleNode('${p.meta.id}')" class="shrink-0 w-4 pt-3 text-text-muted hover:text-primary transition">${isCol ? '▸' : '▾'}</button>`
            : '<span class="shrink-0 w-4"></span>';
          out.push(
            `<div id="row-${esc(p.meta.id)}" class="flex items-start gap-1" style="margin-left:${depth * 14}px">${knob}<div class="flex-1 min-w-0">${nodeCard(p, 0)}</div></div>`,
          );
          if (isCol) {
            coverAll(p);
            return;
          }
          for (const sp of subProjectsOf(p.meta.id)) walkP(sp, depth + 1);
          if (showTasks) for (const t of tasksOf(p.meta.id)) walkT(t, depth + 1);
        };
        for (const r of projectRoots()) walkP(r, 0);
        // 系譜から辿り着けないもの（親が壊れている等）は捨てずに出す。
        // ★ 以前ここはプロジェクトしか拾わなかった。**親を失ったタスクは一度も描かれず**、
        //   しかも救済ループが無いことに気づく手段も無かった（2026-08-24 / T-0013）。
        for (const n of nodes) {
          if (seen.has(n.meta.id)) continue;
          if (!showClosed && isClosed(n)) continue;
          (isProject(n) ? walkP : walkT)(n, 0);
        }
        el.innerHTML =
          out.join('') ||
          `<div class="text-center text-text-muted text-xs py-10 italic">プロジェクトがありません。「＋ プロジェクト」で始めてください。</div>`;
        if (selectedId && selectedId !== lastTreeScrollId) {
          const row = el.querySelector(`#row-${CSS.escape(String(selectedId))}`);
          if (row) row.scrollIntoView({ block: 'center' });
          lastTreeScrollId = selectedId;
        }
      }

      /**
       * 板の全景を数える。
       * ★ 「1 枚を読む」画面しか無いと、全体の食い違いに気づけない。
       *   移行のとき「92 枚あるのに画面には 86 行しか無い」に気づけたのは、
       *   照合する相手（総数）を持っていたからだった（2026-08-23 / T-0006・T-0011）。
       *   その相手を、使い捨ての道具ではなく板の中に置く。
       */
      // 実体は核（system/lib/loom_core.js）にある。デーモンの状態表示と同じ算法を使う（T-0531）
      const censusOf = (list) => LoomCore.censusOf(list);

      /**
       * 全部開いた状態で描いて、それでも画面に出ない札を拾う。
       * ★ これが空でないことは、それ自体が警告である（ファイルは在るのに画面に無い）。
       */
      function unreachable(list) {
        const target = list || nodes;
        const saved = { nodes, showClosed, showTasks, selectedId, col: Array.from(collapsed) };
        try {
          nodes = target;
          showClosed = true;
          showTasks = true;
          selectedId = null;
          collapsed.clear();
          const el = document.createElement('div');
          renderTree(el);
          const drawn = new Set(Array.from(el.querySelectorAll('[id^="row-"]')).map((r) => r.id.slice(4)));
          return target.filter((n) => !drawn.has(n.meta.id));
        } finally {
          nodes = saved.nodes;
          showClosed = saved.showClosed;
          showTasks = saved.showTasks;
          selectedId = saved.selectedId;
          collapsed.clear();
          for (const id of saved.col) collapsed.add(id);
        }
      }

      function renderCensus(el) {
        const c = censusOf(nodes);
        const miss = unreachable();
        const files = c.total + loadSkips.length;
        const chip = (label, n, cls = 'border-border-main') =>
          `<span class="text-[0.625rem] px-1.5 py-0.5 rounded border ${cls}">${esc(label)} <span class="font-mono font-bold">${n}</span></span>`;
        const block = (label, inner) =>
          `<div class="mb-4"><div class="text-[0.625rem] font-bold text-text-muted uppercase tracking-wider mb-1.5">${esc(label)}</div><div class="flex flex-wrap gap-1.5">${inner}</div></div>`;
        const alarm = (title, lines) =>
          lines.length
            ? `<div class="mb-3 p-3 rounded-lg border border-error/40 bg-error/10 text-error text-xs leading-relaxed">
                 <div class="font-bold mb-1">⚠ ${esc(title)}（${lines.length}）</div>${lines.map((s) => esc(s)).join('<br>')}
               </div>`
            : '';
        const statusChips = (m, def) =>
          Object.entries(m)
            .map(([k, n]) => chip((def[k] && def[k].label) || k, n))
            .join('');

        const alarms =
          alarm(
            '読めなかったファイル（板から消えている）',
            loadSkips.map((s) => `${s.path} … ${s.why}`),
          ) +
          alarm(
            'ファイルは在るのに画面に出ない札',
            miss.map((n) => `${n.meta.id}「${n.meta.title}」（親 ${n.meta.parent || '無し'}）`),
          ) +
          alarm(
            'id が重複している',
            c.dupIds.map((d) => `${d.id} … ${d.c} 枚`),
          ) +
          alarm(
            '親が板に無い（系譜から切れている）',
            c.orphans.map((n) => `${n.meta.id}「${n.meta.title}」→ ${n.meta.parent}`),
          ) +
          alarm(
            '記法にない辺（タスクの下のプロジェクト）',
            c.badEdges.map((n) => `${n.meta.id} → ${n.meta.parent}`),
          );

        const ok = !alarms
          ? `<div class="mb-3 p-3 rounded-lg border border-success/40 bg-success/10 text-success text-xs">
               ✓ ファイル ${files} 枚がすべて読め、すべて画面から辿り着けます。
             </div>`
          : '';

        el.innerHTML = `
          <div class="text-xs">
            ${ok}${alarms}
            ${block('照合', chip('ファイル', files) + chip('読めた', c.total) + chip('読めない', loadSkips.length, loadSkips.length ? 'border-error/40 text-error' : 'border-border-main') + chip('画面に出ない', miss.length, miss.length ? 'border-error/40 text-error' : 'border-border-main'))}
            ${block('枚数', chip('プロジェクト', c.projects) + chip('タスク', c.tasks))}
            ${block('手番', chip('Itera', c.ball.ai, 'border-primary/40 text-primary') + chip('あなた', c.ball.user, 'border-warning/40 text-warning') + chip('無し', c.ball.none))}
            ${block('プロジェクトの状態', statusChips(c.pStatus, P_STATUS))}
            ${block('タスクの状態', statusChips(c.tStatus, T_STATUS))}
            <div class="mb-4">
              <div class="text-[0.625rem] font-bold text-text-muted uppercase tracking-wider mb-1.5">根（子孫の数）</div>
              ${c.roots
                .map(
                  (
                    r,
                  ) => `<button onclick="select('${esc(r.id)}')" class="w-full text-left p-2 mb-1 rounded-lg border border-border-main bg-panel/50 hover:border-primary/40 transition flex items-center gap-2">
                <span class="font-mono text-[0.625rem] text-text-muted">${esc(r.id)}</span>
                <span class="flex-1 truncate">${esc(r.title)}</span>
                <span class="font-mono text-[0.625rem] text-text-muted">${r.desc}</span>
              </button>`,
                )
                .join('')}
            </div>
            ${block('子の多い親', c.topParents.map((p) => chip(p.id, p.n)).join(''))}
          </div>`;
      }

      function renderList() {
        const el = DOM('list');
        if (view === 'tree') return renderTree(el);
        if (view === 'census') return renderCensus(el);
        const items = nodes.filter(VIEWS[view].test);
        el.innerHTML = items.length
          ? items.map((n) => nodeCard(n, 0)).join('')
          : `<div class="text-center text-text-muted text-xs py-10 italic">該当なし</div>`;
      }

      // ---------- 掲示 ----------
      let noticeText = '';
      let noticeKind = 'error';
      function noticeBanner() {
        if (!noticeText) return '';
        const cls =
          noticeKind === 'error'
            ? 'border-error/40 bg-error/10 text-error'
            : 'border-warning/40 bg-warning/10 text-warning';
        return `<div data-notice class="mb-4 p-3 rounded-lg border ${cls} text-xs flex items-start gap-2">
          <span class="font-bold shrink-0">⚠</span>
          <span class="flex-1 leading-relaxed">${esc(noticeText)}</span>
          <button onclick="reloadNow()" class="px-2 py-1 rounded bg-error text-text-inverted font-bold shrink-0 hover:opacity-90 transition">再読込</button>
        </div>`;
      }
      function warnConflict() {
        noticeText =
          'この札は他の書き手（Itera）が更新したため、本文の保存を中止しました。編集中の文章をコピーしてから再読込してください。';
        noticeKind = 'error';
        renderDetail();
      }
      function clearNotice() {
        noticeText = '';
      }
      window.reloadNow = async () => {
        clearNotice();
        editing = false;
        await refresh();
      };

      // ---------- 打ちかけの入力を守る（Handoff T-0076） ----------
      const DRAFT_FIELDS = ['f-title', 'f-status', 'f-priority', 'f-scheduled', 'f-quick', 'f-body'];
      let lastRenderedId = null;

      function captureDraft() {
        const d = { values: {}, focus: null, sel: null, scroll: 0 };
        const el = DOM('detail');
        d.scroll = el ? el.scrollTop : 0;
        const active = document.activeElement;
        for (const id of DRAFT_FIELDS) {
          const node = DOM(id);
          if (!node) continue;
          d.values[id] = node.value;
          if (node === active) {
            d.focus = id;
            if (typeof node.selectionStart === 'number') d.sel = { start: node.selectionStart, end: node.selectionEnd };
          }
        }
        return d;
      }
      function restoreDraft(d) {
        if (!d) return;
        const el = DOM('detail');
        for (const id of DRAFT_FIELDS) {
          const node = DOM(id);
          if (!node) continue;
          const v = d.values[id];
          if (v === undefined) continue;
          if (node.value !== v) node.value = v;
        }
        if (el) el.scrollTop = d.scroll;
        if (d.focus) {
          const node = DOM(d.focus);
          if (node) {
            node.focus();
            if (d.sel && typeof node.setSelectionRange === 'function') {
              try {
                node.setSelectionRange(d.sel.start, d.sel.end);
              } catch (e) {}
            }
          }
        }
      }
      function hasUnsavedInput() {
        const t = rawCurrent();
        if (!t) return false;
        const q = DOM('f-quick');
        if (q && q.value.trim()) return true;
        const title = DOM('f-title');
        if (title && title.value.trim() !== String(t.meta.title || '').trim()) return true;
        const status = DOM('f-status');
        if (status && status.value !== t.meta.status) return true;
        const pri = DOM('f-priority');
        if (pri && pri.value !== (t.meta.priority || '')) return true;
        const sched = DOM('f-scheduled');
        if (sched && (sched.value || '') !== (t.meta.scheduled || '')) return true;
        const body = DOM('f-body');
        if (editing && body && body.value !== t.body) return true;
        return false;
      }

      // ---------- 系譜パネル ----------
      function chip(id, label) {
        const n = byId(id);
        const st = n ? statusDef(n) : null;
        const text = n ? `${id} ${n.meta.title}` : `${id}（見つかりません）`;
        const cls = n ? 'bg-hover' : 'bg-error/10 text-error';
        return `<span class="text-[0.6875rem] px-2 py-1 rounded ${cls} inline-flex items-center gap-1.5 max-w-full">
          ${label ? `<span class="text-text-muted shrink-0">${label}</span>` : ''}
          <button onclick="select('${esc(id)}')" class="truncate max-w-[14rem] text-left hover:text-primary">${esc(text)}</button>
          ${st ? `<span class="opacity-60 shrink-0">${st.label}</span>` : ''}</span>`;
      }

      let showClosedWork = false;
      window.toggleClosedWork = () => {
        showClosedWork = !showClosedWork;
        renderDetail();
      };

      /**
       * 仕事（タスク）の区画。
       *
       * ★ 系譜の「枝」に混ぜない。プロジェクト同士は**分岐**で繋がり、
       *   プロジェクトとタスクは**起票**で繋がる。別の辺である。
       *   タスクは「小さな枝」ではなく**終わる仕事**なので、状態と進み具合が見えるカードで出す。
       */
      function worksBlock(n) {
        const proj = isProject(n);
        const all = proj ? tasksOf(n.meta.id) : childrenOf(n.meta.id).filter((c) => !isProject(c));
        const open = all.filter((t) => !isClosed(t));
        const closed = all.filter(isClosed);
        const shown = showClosedWork ? all : open;
        const label = proj ? '仕事' : 'サブタスク';
        const addBtn = `<button onclick="${proj ? 'openTask()' : 'decompose()'}" class="ml-auto text-[0.6875rem] px-2 py-1 rounded bg-hover hover:bg-primary hover:text-text-inverted transition font-bold">${proj ? '＋ 起票' : '＋ 分解'}</button>`;
        if (!all.length) {
          return `<div class="mb-4 p-3 rounded-lg bg-panel border border-border-main text-xs flex items-center gap-2">
            <span class="text-[0.6875rem] font-bold text-text-muted">${label}</span>
            <span class="text-text-muted italic">まだありません</span>${addBtn}</div>`;
        }
        return `<div class="mb-4">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-[0.6875rem] font-bold text-text-muted">${label}</span>
            <span class="text-[0.625rem] font-mono text-text-muted">開いている ${open.length} 件</span>
            ${closed.length ? `<button onclick="toggleClosedWork()" class="text-[0.6875rem] px-2 py-0.5 rounded ${showClosedWork ? 'bg-hover' : 'text-text-muted hover:bg-hover'}">閉じた ${closed.length}</button>` : ''}
            ${addBtn}
          </div>
          <div class="grid gap-1.5 sm:grid-cols-2">${shown.map((t) => nodeCard(t, 0)).join('')}</div>
        </div>`;
      }

      function genealogyBlock(n) {
        const anc = ancestorsOf(n.meta.id);
        const trail = anc.length
          ? anc
              .map(
                (a) =>
                  `<button onclick="select('${esc(a.meta.id)}')" class="hover:text-primary hover:underline">${esc(a.meta.title)}</button>`,
              )
              .join('<span class="text-text-muted"> › </span>')
          : '<span class="text-text-muted italic">根</span>';
        const preds = predecessors(n.meta.id);
        const succ = successorOf(n.meta.id);
        const own = owningProject(n);
        // ★ 系譜に並べるのは「枝」＝子プロジェクトだけ。
        //   親子はプロジェクト間の関係（分岐）で、プロジェクトとタスクの間は「起票」という別の辺である。
        //   同じ parent キーで表しているが**流れるものが違う**（文脈・転記 ⇄ 依頼・レポート）ので、
        //   画面で一緒くたにすると、その違いが見えなくなる（山内さん 2026-08-23 / T-0001）。
        const kids = isProject(n) ? subProjectsOf(n.meta.id) : [];
        return `<div class="mb-4 p-3 rounded-lg bg-panel border border-border-main text-xs space-y-2">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-[0.6875rem] font-bold text-text-muted shrink-0">系譜</span>
            <div class="flex-1 min-w-0 truncate">${trail}</div>
          </div>
          ${!isProject(n) && own ? `<div class="flex items-center gap-2 flex-wrap"><span class="text-[0.6875rem] font-bold text-text-muted shrink-0">所属</span>${chip(own.meta.id)}</div>` : ''}
          ${preds.length ? `<div class="flex items-start gap-2 flex-wrap"><span class="text-[0.6875rem] font-bold text-text-muted shrink-0 pt-1">前任</span>${preds.map((p) => chip(p.meta.id)).join('')}</div>` : ''}
          ${succ ? `<div class="flex items-start gap-2 flex-wrap"><span class="text-[0.6875rem] font-bold text-text-muted shrink-0 pt-1">後継</span>${chip(succ.meta.id)}</div>` : ''}
          ${kids.length ? `<div class="flex items-start gap-2 flex-wrap"><span class="text-[0.6875rem] font-bold text-text-muted shrink-0 pt-1">枝</span>${kids.map((k) => chip(k.meta.id)).join('')}</div>` : ''}
        </div>`;
      }

      /** 文脈の取り込み状況。**古びが目で見える**ことがこの板の要。 */
      function contextPanel(n) {
        if (!isProject(n)) return '';
        const ctx = LoomCore.dOf(n).ctx;
        if (!ctx.length) {
          return `<div class="mb-4 p-3 rounded-lg bg-panel border border-border-main text-xs">
            <div class="flex items-center gap-2">
              <span class="text-[0.6875rem] font-bold text-text-muted">文脈</span>
              <span class="text-text-muted italic">まだありません</span>
              <button onclick="askFold('文脈生成')" class="ml-auto text-[0.6875rem] px-2 py-1 rounded bg-primary text-text-inverted font-bold hover:bg-primary/90 transition">Itera に文脈生成を頼む</button>
            </div>
          </div>`;
        }
        const rows = ctx
          .map((c) => {
            const src = c.external ? null : byId(c.source);
            const head = src ? lastLogAt(src) : '';
            const stale = head && (!c.watermark || c.watermark < head);
            const label = c.external
              ? `<span class="text-[0.6875rem] px-2 py-1 rounded bg-hover inline-flex items-center gap-1.5 max-w-full">
                 <span class="text-text-muted shrink-0">外</span>
                 <button onclick="openRef('${esc(c.source)}')" class="truncate max-w-[18rem] text-left font-mono hover:text-primary">${esc(c.source)}</button>
                 ${c.title ? `<span class="opacity-60 shrink-0 truncate max-w-[10rem]">${esc(c.title)}</span>` : ''}</span>`
              : chip(c.source);
            return `<div class="flex items-center gap-2 flex-wrap py-1 border-t border-border-main first:border-0">
            ${label}
            <span class="font-mono text-[0.625rem] text-text-muted">${c.watermark ? esc(c.watermark) + ' まで' : '取り込み点なし'}</span>
            ${
              c.external
                ? '<span class="text-[0.625rem] text-text-muted" title="外の文書は Loom の履歴を持たないので、伸びたかを機械では言えません">古びは自分で見る</span>'
                : stale
                  ? `<span class="text-[0.625rem] text-warning font-bold">→ 源は ${esc(head)} まで伸びています</span>`
                  : '<span class="text-[0.625rem] text-success">最新</span>'
            }
            ${stale ? `<button onclick="askFold('追随','${esc(c.source)}')" class="ml-auto text-[0.6875rem] px-2 py-1 rounded bg-warning text-text-inverted font-bold hover:opacity-90 transition">追随を頼む</button>` : ''}
          </div>`;
          })
          .join('');
        return `<div class="mb-4 p-3 rounded-lg bg-panel border border-border-main text-xs">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-[0.6875rem] font-bold text-text-muted">文脈の取り込み点</span>
            <button onclick="askFold('文脈生成')" class="ml-auto text-[0.6875rem] px-2 py-1 rounded bg-hover hover:bg-primary hover:text-text-inverted transition">源を足す</button>
            <button onclick="askFold('再生成')" class="text-[0.6875rem] px-2 py-1 rounded bg-hover hover:bg-warning hover:text-text-inverted transition" title="肥大した文脈を、意図に照らして畳み直す">再生成を頼む</button>
          </div>
          ${rows}
        </div>`;
      }

      function opsBlock(n) {
        const proj = isProject(n);
        const pend = LoomCore.dOf(n).pending;
        const parent = byId(n.meta.parent);
        const btn = (fn, label, cls, title) =>
          `<button onclick="${fn}" class="text-[0.6875rem] px-2.5 py-1 rounded ${cls} font-bold transition" title="${esc(title || '')}">${label}</button>`;
        if (proj) {
          // ★ 転記のボタンは、未送の総括が 0 件でも出す（2026-08-25 / T-0213）。
          //   隠していたときは、この操作を知らない人の画面に**終結（合流）しか無いように見えた**。
          //   実際、生きているサブプロジェクトは 5 枚とも 0 件だったので、一度も出ていなかった。
          //   「押しても何も起きない」ことは、消すのではなく**薄い見た目と説明で**伝えれば足りる
          //   （押せば pushUp が「まだ渡していない総括がありません」と言う）。
          return `<div class="mb-4 flex flex-wrap items-center gap-2">
            ${btn('fork()', '分岐 ⑂', 'bg-primary text-text-inverted hover:bg-primary/90', '子プロジェクトを切る。意図はあなたが置く')}
            ${btn('openTask()', '起票 ＋', 'bg-hover hover:bg-primary hover:text-text-inverted', 'このプロジェクトの下にタスクを立てる')}
            ${btn('supersede()', '継承 ⇥', 'bg-hover hover:bg-warning hover:text-text-inverted', 'フェーズを切る。前任は凍結し、子は後継が引き継ぐ')}
            ${btn("askFold('総括')", '総括を頼む', 'bg-hover hover:bg-success hover:text-text-inverted', '区切りまでの決定・却下・未解決を Itera が書く')}
            ${
              parent
                ? btn(
                    'pushUp()',
                    pend ? `転記 ↑ (${pend})` : '転記 ↑',
                    pend
                      ? 'bg-success text-text-inverted hover:opacity-90'
                      : 'bg-hover text-text-muted hover:bg-success hover:text-text-inverted',
                    pend
                      ? '未送の総括を、畳まずそのまま親の履歴へ載せる（この枝は終わらない）'
                      : '総括を、畳まずそのまま親の履歴へ載せる（この枝は終わらない）。いま未送の総括は 0 件 —— 先に「総括を頼む」',
                  )
                : ''
            }
            ${parent && n.meta.status === 'live' ? btn('closeMerge()', '終結（合流）', 'bg-hover hover:bg-success hover:text-text-inverted', '転記して役目を終える。続けるなら「転記 ↑」') : ''}
          </div>`;
        }
        const st = T_STATUS[n.meta.status] || T_STATUS.inbox;
        return `<div class="mb-4 flex flex-wrap items-center gap-2">
          ${btn('decompose()', '分解 ⋔', 'bg-hover hover:bg-primary hover:text-text-inverted', 'サブタスクに割る')}
          ${btn("askFold('レポート')", 'レポートを頼む', 'bg-hover hover:bg-success hover:text-text-inverted', '閉じる前に、Itera がレポートを書く')}
          ${!isClosed(n) ? btn('complete()', '確認へ回す ✓', 'bg-success text-text-inverted hover:opacity-90', 'レポートを確かめて確認待ちにする。親へ運ぶのは「確認したので完了にする」を押したとき') : ''}
          ${st.ball === 'user' ? btn('handToAI()', 'Itera に渡す →', 'bg-primary text-text-inverted hover:bg-primary/90', '') : ''}
          ${st.ball === 'ai' ? btn('interruptAI()', '中断', 'bg-warning text-text-inverted hover:opacity-90', 'ここまでと次の一手を書かせてから止める') + btn('handBackToUser()', '← 自分に戻す', 'bg-hover hover:bg-error hover:text-text-inverted', '') : ''}
        </div>`;
      }

      function renderDetail() {
        const el = DOM('detail');
        const draft = captureDraft();
        const prevId = lastRenderedId;
        const n = rawCurrent();
        if (!n) {
          el.innerHTML = `<div class="h-full flex items-center justify-center text-text-muted text-sm italic">左からプロジェクトを選んでください</div>`;
          lastRenderedId = null;
          return;
        }
        const proj = isProject(n);
        const st = statusDef(n);
        // ★ 語彙の外にある値も選択肢に残す。残さないと選択肢の先頭が選ばれた状態になり、
        //   「保存」を押しただけで**黙って別の値に変わる**（2026-08-24 / T-0014）。
        const withCurrent = (list, cur) => (cur && !list.includes(cur) ? [cur].concat(list) : list);
        const opts = withCurrent(Object.keys(proj ? P_STATUS : T_STATUS), n.meta.status)
          .map((k) => {
            const v = (proj ? P_STATUS : T_STATUS)[k];
            return `<option value="${esc(k)}" ${n.meta.status === k ? 'selected' : ''}>${esc(v ? v.label : k + '（記法にない値）')}</option>`;
          })
          .join('');
        const refs = Array.isArray(n.meta.refs) ? n.meta.refs : [];
        const stats = proj ? null : planStats(n.body);
        const ballLabel = proj
          ? 'プロジェクト（手番を持たない）'
          : n.meta.status === 'paused'
            ? 'Itera は中断中（あなたの番）'
            : st.ball === 'ai'
              ? 'Itera が動く番'
              : st.ball === 'user'
                ? 'あなたが動く番'
                : '完了';
        const ballCls = proj
          ? 'bg-primary/10 text-primary border-primary/30'
          : st.ball === 'ai'
            ? 'bg-primary/10 text-primary border-primary/30'
            : st.ball === 'user'
              ? 'bg-warning/10 text-warning border-warning/30'
              : 'bg-success/10 text-success border-success/30';

        el.innerHTML = `
        <div class="max-w-3xl mx-auto p-6">
          ${noticeBanner()}
          <div class="flex items-center gap-2 mb-3">
            <span class="text-[0.6875rem] px-2 py-1 rounded-full border font-bold ${ballCls}">${ballLabel}</span>
            <span class="text-[0.6875rem] px-2 py-1 rounded border font-bold ${st.cls}">${st.label}</span>
            <span class="text-[0.6875rem] text-text-muted font-mono">${esc(n.meta.id)}</span>
            <span class="ml-auto flex items-center gap-3">
              ${isClosed(n) ? '' : `<button onclick="dropNode()" class="text-[0.6875rem] text-text-muted hover:text-warning transition" title="消さずに中止・放棄として残します">中止</button>`}
              <button onclick="removeNode()" class="text-[0.6875rem] text-text-muted hover:text-error transition">削除</button>
            </span>
          </div>

          <input id="f-title" value="${esc(n.meta.title)}" class="w-full bg-transparent text-xl font-bold mb-4 border-b border-transparent hover:border-border-main focus:border-primary focus:outline-none pb-1" />

          ${genealogyBlock(n)}
          ${contextPanel(n)}
          ${opsBlock(n)}
          ${worksBlock(n)}

          ${
            stats
              ? `<div class="flex items-center gap-2 mb-4 p-3 rounded-lg bg-panel border border-border-main">
               <span class="text-[0.6875rem] font-bold text-text-muted shrink-0">計画</span>
               <div class="flex-1 h-1.5 rounded-full bg-hover overflow-hidden"><div class="h-full bg-success transition-all" style="width:${Math.round((stats.done / stats.total) * 100)}%"></div></div>
               <span class="text-xs font-mono">${stats.done} / ${stats.total} 完了${stats.doing ? ` ・ ${stats.doing} 作業中` : ''}</span>
             </div>`
              : ''
          }

          <div class="flex flex-wrap items-center gap-3 mb-4 text-xs">
            <label class="flex items-center gap-1.5">状態
              <select id="f-status" class="bg-card border border-border-main rounded px-2 py-1">${opts}</select>
            </label>
            ${
              proj
                ? ''
                : `<label class="flex items-center gap-1.5">優先度
              <select id="f-priority" class="bg-card border border-border-main rounded px-2 py-1">${withCurrent(
                ['high', 'normal', 'low'],
                n.meta.priority,
              )
                .map((p) => `<option value="${esc(p)}" ${n.meta.priority === p ? 'selected' : ''}>${esc(p)}</option>`)
                .join('')}</select>
            </label>
            <label class="flex items-center gap-1.5">いつやる
              <input type="date" id="f-scheduled" value="${esc(n.meta.scheduled || '')}" class="bg-card border border-border-main rounded px-2 py-1" />
            </label>`
            }
            <button onclick="saveMeta()" class="px-2.5 py-1 rounded bg-hover hover:bg-primary hover:text-text-inverted transition font-medium">保存</button>
          </div>

          <div class="mb-5">
            <div class="text-[0.6875rem] font-bold text-text-muted mb-1.5">参照ファイル（refs）${proj ? '' : ' — タスクの refs は所属プロジェクトの部分集合'}</div>
            <div class="flex flex-wrap gap-1.5 mb-2">
              ${refs.length ? refs.map((p, i) => `<span class="text-[0.6875rem] font-mono px-2 py-1 rounded bg-hover flex items-center gap-1.5"><button onclick="openRef('${esc(p)}')" class="hover:text-primary">${esc(p)}</button><button onclick="removeRef(${i})" class="text-text-muted hover:text-error">×</button></span>`).join('') : '<span class="text-[0.6875rem] text-text-muted italic">なし</span>'}
            </div>
            <div class="flex items-center gap-3">
              <button onclick="addRef(false)" class="text-[0.6875rem] text-primary hover:underline">＋ ファイル</button>
              <button onclick="addRef(true)" class="text-[0.6875rem] text-primary hover:underline">＋ フォルダ</button>
            </div>
          </div>

          <div class="flex items-center gap-2 mb-2">
            <button onclick="toggleEdit()" class="text-xs px-2.5 py-1 rounded ${editing ? 'bg-primary text-text-inverted' : 'bg-hover'} font-medium transition">${editing ? '編集中（クリックで表示）' : '本文を編集'}</button>
            ${editing ? '<button onclick="saveBody()" class="text-xs px-2.5 py-1 rounded bg-success text-text-inverted font-bold">本文を保存</button>' : ''}
          </div>

          ${
            editing
              ? `<textarea id="f-body" class="w-full h-[420px] bg-card border border-border-main rounded-lg p-4 font-mono text-xs leading-relaxed focus:border-primary focus:outline-none resize-y">${esc(n.body)}</textarea>`
              : n.body == null
                ? `<div class="bg-panel border border-border-main rounded-lg p-5 text-sm text-text-muted italic">本文を読み込めていません（${n.pendingFetch ? '中身がまだ降りてきていない stub です' : '読み込み中か、読めませんでした'}）。右上の再読込を試してください。</div>`
                : `<div class="bg-panel border border-border-main rounded-lg p-5 text-sm">${mdRender(n.body, sectionRange(n.body, '計画'))}</div>`
          }

          <div class="mt-5 p-4 rounded-lg bg-panel border border-border-main">
            <div class="text-[0.6875rem] font-bold text-text-muted mb-2">追記</div>
            <textarea id="f-quick" rows="3" placeholder="追記する内容を書く…" class="w-full bg-card border border-border-main rounded p-2 text-xs focus:border-primary focus:outline-none resize-none mb-2"></textarea>
            <div class="flex flex-wrap gap-2">
              ${
                proj
                  ? `<button onclick="quick('履歴', true)" class="text-xs px-3 py-1.5 rounded bg-hover hover:bg-primary hover:text-text-inverted transition font-medium">履歴に書いて Itera に伝える</button>
                   <button onclick="quick('履歴', false)" class="text-xs px-3 py-1.5 rounded bg-hover transition">履歴に書くだけ</button>
                   <button onclick="quick('意図', false)" class="text-xs px-3 py-1.5 rounded bg-hover transition" title="意図はほぼ不変。足すのは慎重に">意図に足す</button>`
                  : `<button onclick="quick('追加要望', true)" class="text-xs px-3 py-1.5 rounded bg-hover hover:bg-primary hover:text-text-inverted transition font-medium">要望・修正を追加して伝える</button>
                   <button onclick="quick('確認事項', true)" class="text-xs px-3 py-1.5 rounded bg-hover hover:bg-primary hover:text-text-inverted transition font-medium">質問に回答する</button>
                   <button onclick="quick('追加要望', false)" class="text-xs px-3 py-1.5 rounded bg-hover transition">メモだけ</button>`
              }
              ${
                LoomCore.dOf(n).ownRecaps > 0
                  ? `<button onclick="appendToRecap()" class="text-xs px-3 py-1.5 rounded bg-hover hover:bg-success hover:text-text-inverted transition font-medium" title="${esc(recapName(n))}の枠の中に書き足します。未解決が解決したときはここへ（枠の外に書くと親へ運ばれません）">${esc(recapName(n))}に追記（解決など）</button>`
                  : ''
              }
            </div>
          </div>

          ${!proj && n.meta.status === 'inbox' ? `<button onclick="send()" class="mt-5 w-full py-3 rounded-lg bg-primary text-text-inverted font-bold hover:bg-primary/90 shadow transition">この依頼を Itera に送る</button>` : ''}
          ${!proj && n.meta.status === 'review' ? `<button onclick="setStatus('done')" class="mt-5 w-full py-3 rounded-lg bg-success text-text-inverted font-bold hover:opacity-90 shadow transition" title="このときレポートと成果物が所属プロジェクトの履歴へ運ばれます（上位タスクへは 1 行）">確認したので完了にする（→ 親へ運ぶ）</button>` : ''}
        </div>`;

        if (prevId === n.meta.id) restoreDraft(draft);
        lastRenderedId = n.meta.id;
      }

      function renderAll() {
        renderViews();
        renderList();
        renderDetail();
      }

      // ============================================================
      // 操作
      // ★ 書き込みはすべてデーモン（system/services/loom.html）に頼む（T-0531）。
      //   ここに残すのは「人に訊く」（ダイアログ）と「Itera に伝える」（notifyAI）と画面の状態だけ。
      //   読む → 変える → 書く はデーモンの列の中で行われ、札ごとに直列になる。
      // ============================================================
      function rawCurrent() {
        return nodes.find((x) => x.meta.id === selectedId);
      }

      function flushEditor(t) {
        if (!t) return t;
        const title = DOM('f-title');
        const status = DOM('f-status');
        const pri = DOM('f-priority');
        const sched = DOM('f-scheduled');
        const body = DOM('f-body');
        if (title) t.meta.title = title.value.trim() || '(無題)';
        if (status) t.meta.status = status.value;
        if (pri) t.meta.priority = pri.value;
        if (sched) t.meta.scheduled = sched.value || '';
        if (editing && body) t.body = body.value;
        return t;
      }
      function current() {
        return flushEditor(rawCurrent());
      }

      /**
       * 画面で変えた front matter だけを差分にする（読み込んだ時点の値と比べる）。
       * ★ done はここに入れない。done は「運ぶ」操作（toDone）だけが行う。
       */
      function metaPatch(t) {
        const base = t.baseMeta || {};
        const patch = {};
        for (const k of META_KEYS) {
          const now = JSON.stringify(t.meta[k] === undefined ? null : t.meta[k]);
          const was = JSON.stringify(base[k] === undefined ? null : base[k]);
          if (now !== was) patch[k] = t.meta[k];
        }
        if (patch.status === 'done') delete patch.status;
        return patch;
      }

      /** 本文の保存（基準は「編集を始めた時点の本文」。違えばデーモンが書かずに conflict を返す） */
      async function saveBodyChecked(t) {
        const base = editBase && editBase.id === t.meta.id ? editBase.body : t.baseBody;
        const r = await call('saveBody', { id: t.meta.id, body: t.body, base, patch: metaPatch(t) });
        return r && r.ok ? r : null;
      }

      async function commitIfEditing() {
        if (!editing) return true;
        const t = rawCurrent();
        const box = DOM('f-body');
        if (!t || !box || box.value === t.body) return true;
        t.body = box.value;
        return !!(await saveBodyChecked(t));
      }
      async function commitAll(t) {
        if (!t) return null;
        if (editing) return await saveBodyChecked(t);
        const patch = metaPatch(t);
        if (!Object.keys(patch).length) return { ok: true, id: t.meta.id };
        const r = await call('saveMeta', { id: t.meta.id, patch });
        return r && r.ok ? r : null;
      }

      /** Itera への通知に添える「どこを読めばよいか」。ファイルから読み直して行番号を数える */
      async function hintOf(id, line) {
        const n = await loadBody(id);
        if (!n) return `${fileOf(id)} を読んでください。`;
        return readHint({ path: fileOf(id), text: serializeNode(n.meta, n.body) }, line);
      }

      window.setView = (k) => {
        view = k;
        lastTreeScrollId = null;
        renderAll();
      };
      window.toggleClosed = () => {
        showClosed = !showClosed;
        renderAll();
      };
      window.toggleTasks = () => {
        showTasks = !showTasks;
        renderAll();
      };
      window.toggleNode = (id) => {
        collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
        saveUiState();
        renderList();
      };
      // ---- スマホ幅の一覧（引き出し）。状態は持たず、開いているかは class から読む ----
      const listIsDrawer = () => window.matchMedia('(max-width: 767px)').matches;
      window.toggleList = (open) => {
        const pane = document.getElementById('list-pane');
        const overlay = document.getElementById('list-overlay');
        const isOpen = !pane.classList.contains('-translate-x-full');
        const next = typeof open === 'boolean' ? open : !isOpen;
        pane.classList.toggle('-translate-x-full', !next);
        overlay.classList.toggle('hidden', !next);
      };
      window.select = async (id) => {
        if (!(await commitIfEditing())) return;
        if (listIsDrawer()) toggleList(false);
        // 一覧はデーモンの写しで足りる。本文は選んだ 1 枚だけ読む（T-0531）
        selectedId = id;
        editing = false;
        editBase = null;
        clearNotice();
        // ★ 選んだ札までの道を開く。畳んだ既定と組み合わさると、
        //   これが無い限り「選んだのに画面に出ない」が起きる（T-0202）。
        if (openPathTo(id)) saveUiState();
        await loadBody(id);
        renderAll();
      };
      window.toggleEdit = async () => {
        if (!(await commitIfEditing())) return;
        editing = !editing;
        // toggleEdit は refresh() を通らないので、ここでも基準を置く（置き忘れると素通しで上書きになる）。
        const t = rawCurrent();
        editBase = editing && t ? { id: t.meta.id, body: t.body } : null;
        renderDetail();
      };

      /**
       * 作った直後に題の入力欄へ焦点を移す。
       * ★ 見た目の親切ではない。**題を決めずに置かれた札は、出来事の行に「(無題)」を焼き付ける**
       *   （履歴は書き換えないので後から直せない）。入り口で題を書かせるのがいちばん安い（T-0002）。
       */
      function focusTitle() {
        const el = DOM('f-title');
        if (el) {
          el.focus();
          el.select();
        }
      }

      /** 札を起こして、それを選び、題の入力へ（起票・分解・分岐・新しいプロジェクト） */
      async function createAndOpen(args) {
        const r = await call('create', args);
        if (!r || !r.ok) return null;
        selectedId = r.id;
        editing = true;
        await refresh();
        focusTitle();
        return r;
      }

      window.newProject = async () => {
        view = 'tree';
        await createAndOpen({ kind: 'project', title: '(無題のプロジェクト)', status: 'live' });
      };

      // 分岐。承認は要らない ── 切れないと、要らない事実が親に溜まる。
      window.fork = async () => {
        const p = rawCurrent();
        if (!p || !isProject(p)) return;
        if (!(await commitIfEditing())) return;
        await createAndOpen({ kind: 'project', parent: p.meta.id, title: '(無題の枝)', status: 'live' });
      };

      // 起票。タスクは所属プロジェクトの下に立つ。T→P の辺は無いので、親は必ずプロジェクト。
      window.openTask = async () => {
        const p = rawCurrent();
        if (!p || !isProject(p)) return;
        if (!(await commitIfEditing())) return;
        await createAndOpen({
          kind: 'task',
          parent: p.meta.id,
          title: '(無題のタスク)',
          status: 'inbox',
          priority: 'normal',
        });
      };

      // 分解。親がタスクのときの「起票」の別名。
      window.decompose = async () => {
        const t = rawCurrent();
        if (!t || isProject(t)) return;
        if (!(await commitIfEditing())) return;
        await createAndOpen({
          kind: 'task',
          parent: t.meta.id,
          title: '(無題のサブタスク)',
          status: 'inbox',
          priority: t.meta.priority || 'normal',
        });
      };

      /**
       * 継承。フェーズを切る。
       * **子の parent は書き換えない。**前任を指したまま、系譜の解決側（childrenOf）で引き継ぐ。
       */
      window.supersede = async () => {
        const p = rawCurrent();
        if (!p || !isProject(p)) return;
        const res = await AppUI.showMessageBox({
          title: 'フェーズを切る（継承）',
          message: `${p.meta.id}「${p.meta.title}」を凍結し、後継のプロジェクトを作ります。子はそのまま後継が引き継ぎます（辺は書き換えません）。前任は消えません。`,
          type: 'warning',
          buttons: [
            { label: 'キャンセル', value: false, style: 'normal', isCancel: true },
            { label: '継承する', value: true, style: 'primary', isDefault: true },
          ],
        });
        if (!res || res.action !== true) return;
        if (!(await commitIfEditing())) return;
        const r = await call('supersede', { id: p.meta.id });
        if (!r || !r.ok) return;
        selectedId = r.id;
        editing = true;
        await refresh();
        await notifyAI(
          `Loom: ${p.meta.id}「${p.meta.title}」から ${r.id} へ継承しました。後継の ## 意図 は山内さんが書きます。` +
            `そのうえで、前任の履歴を全部読み、意図に照らして畳んだものを後継の ## 文脈 に書いてください（文脈生成）。`,
        );
      };

      /** 転記（上げる）。**畳まない。**子の総括をそのまま親の履歴へ載せる（デーモンがファイルから読み直して運ぶ）。 */
      window.pushUp = async () => {
        const n = rawCurrent();
        if (!n) return;
        if (!(await commitIfEditing())) return;
        const r = await call('pushUp', { id: n.meta.id }, { quiet: true });
        if (!r) return;
        if (!r.ok) {
          AppUI.notify(r.reason || '転記できませんでした', 'warning');
          return;
        }
        AppUI.notify(`${r.to} へ ${r.count} 件を転記しました`, 'info', 2500);
        await refresh();
      };

      /** 終結（合流）。転記して役目を終える。**一緒になるのは、この最後の一回だけ。** */
      window.closeMerge = async () => {
        const n = rawCurrent();
        if (!n || !isProject(n)) return;
        if (!(await commitIfEditing())) return;
        // ★ 確認ダイアログより前に、ファイルから数え直す（古い写しの「0 件」で納得させない）。
        const info = await call('recapInfo', { id: n.meta.id });
        if (!info || !info.ok) return;
        const res = await AppUI.showMessageBox({
          title: '終結（合流）',
          message: `${n.meta.id}「${n.meta.title}」を親へ合流させ、凍結します。未送の総括 ${info.pending} 件を転記します。`,
          type: 'warning',
          buttons: [
            { label: 'キャンセル', value: false, style: 'normal', isCancel: true },
            { label: '合流する', value: true, style: 'primary', isDefault: true },
          ],
        });
        if (!res || res.action !== true) return;
        const r = await call('closeMerge', { id: n.meta.id });
        if (!r || !r.ok) return;
        await refresh();
      };

      /**
       * 完了 —— **確認へ回すだけ。運ばない**（T-0203）。
       *
       * @param {string} [id] 対象の札。省略すると「画面で選択中の札」。
       *   ★ 自律呼び出し（inject_js）で id を省くと、選択を取り違えて**別の札を閉じる**（T-0201）。
       *   ★ いまは Itera の道具 loom_update status="review" が同じことをする（T-0531）。こちらは互換のために残す。
       * @param {object} [opts] `{ force: true }` でレポートが無くても回す。
       * @returns {{ok:boolean, id:string, reports:number, artifacts:boolean, empty:boolean, delivered:boolean, reason?:string}}
       */
      window.complete = async (id, opts) => {
        const o = opts || {};
        const t0 = id ? byId(id) : rawCurrent();
        if (!t0) return { ok: false, id: id || null, reason: id ? `${id} は板にありません` : '札が選ばれていません' };
        if (isProject(t0)) return { ok: false, id: t0.meta.id, reason: 'プロジェクトは完了にしません' };
        // 編集中の本文を保存するのは「いま画面に出ている札」のときだけ（別の札を巻き込まない）
        if (t0.meta.id === selectedId && !(await commitIfEditing()))
          return { ok: false, id: t0.meta.id, reason: '編集中の本文を保存できませんでした' };
        let r = await call('complete', { id: t0.meta.id, force: !!o.force }, { quiet: true });
        if (!r) return { ok: false, id: t0.meta.id, delivered: false, reason: 'デーモンが応答しません' };
        if (!r.ok && r.empty && !id) {
          // 画面から押された（id 省略）なら、人がそこに居るので訊く。id 指定＝自律呼び出しなら訊かない（T-0191）
          const go = await AppUI.showMessageBox({
            title: 'レポートがありません',
            message:
              'レポート（決定・却下・未解決）がまだ書かれていません。書かずに確認へ回しますか？（Itera に頼むこともできます）',
            type: 'warning',
            buttons: [
              { label: 'やめる', value: false, style: 'normal', isCancel: true },
              { label: 'それでも回す', value: true, style: 'danger', isDefault: true },
            ],
          });
          if (!go || go.action !== true)
            return { ok: false, id: t0.meta.id, reports: 0, empty: true, delivered: false, reason: '取り消しました' };
          r = await call('complete', { id: t0.meta.id, force: true });
          if (!r) return { ok: false, id: t0.meta.id, delivered: false, reason: 'デーモンが応答しません' };
        }
        if (!r.ok) {
          if (!id) AppUI.notify(r.reason || '確認へ回せませんでした', 'error');
          return r;
        }
        AppUI.notify(
          `${r.id} を確認へ回しました（親へ運ぶのは確認のとき）` + (r.reports ? '' : ' ／ レポートなし'),
          r.reports ? 'info' : 'warning',
          2500,
        );
        await refresh();
        return r;
      };

      /** 畳むのは Itera の仕事。ここは依頼を送るだけで、機械で要約文を作らない。 */
      window.askFold = async (kind, source) => {
        const n = rawCurrent();
        if (!n) return;
        const map = {
          文脈生成: `${n.meta.id}「${n.meta.title}」の ## 文脈 を作ってください。親（および必要なら傍系）の履歴を**全部**読み、この札の ## 意図 に照らして畳みます。書式は記法 §5（源ごとに ### 、取り込み点は #### に「… まで」）。`,
          追随: `${n.meta.id}「${n.meta.title}」の ## 文脈 が古びています。源 ${source || ''} の、取り込み点より後の差分だけを畳んで **追記**してください（#### 追随 <日時>（<源> を <日時> まで））。既存の記述は消さないこと。`,
          再生成: `${n.meta.id}「${n.meta.title}」の ## 文脈 が肥大しています。意図に照らして畳み直してください（再生成）。**文脈は写しなので丸ごと書き換えてよい**が、## 履歴 に「再生成: …（前版は … 生成）」の 1 行を残すこと。`,
          総括: `${n.meta.id}「${n.meta.title}」の ## 履歴 に「### 総括 <日時>」を書いてください。前回の区切り以降の 決定・却下・未解決 を、決定は 1 行で、却下枠を省略せずに。`,
          レポート: `${n.meta.id}「${n.meta.title}」の ## 進捗 に「### レポート <日時>」を書いてください（決定・却下・未解決）。これを書いてから閉じます。`,
        };
        await notifyAI(`Loom: ${map[kind] || kind}`);
        AppUI.notify('Itera に依頼しました', 'info', 2000);
      };

      window.dropNode = async () => {
        const n = current();
        if (!n) return;
        const res = await AppUI.showMessageBox({
          title: isProject(n) ? 'この枝を放棄する' : 'このタスクを中止する',
          message: `${n.meta.id}「${n.meta.title}」を${isProject(n) ? '放棄' : '中止'}にしますか？削除はしません。理由を${recapName(n)}に書いてください。`,
          type: 'warning',
          buttons: [
            { label: 'キャンセル', value: false, style: 'normal', isCancel: true },
            { label: 'そうする', value: true, style: 'danger', isDefault: true },
          ],
        });
        if (!res || res.action !== true) return;
        if (!(await commitAll(n))) return; // 画面で打ちかけた題などを先に保存する
        const r = await call('drop', { id: n.meta.id });
        if (!r || !r.ok) return;
        await refresh();
      };

      window.removeNode = async () => {
        const n = current();
        if (!n) return;
        const kids = childrenOf(n.meta.id);
        const res = await AppUI.showMessageBox({
          title: '削除',
          message: `${n.meta.id}「${n.meta.title}」を削除しますか？（trash へ移ります）${kids.length ? `\n子が ${kids.length} 件あります（親を失います）。` : ''}`,
          type: 'warning',
          buttons: [
            { label: 'キャンセル', value: false, style: 'normal', isCancel: true },
            { label: '削除', value: true, style: 'danger', isDefault: true },
          ],
        });
        if (!res || res.action !== true) return;
        const r = await call('remove', { id: n.meta.id });
        if (!r || !r.ok) return;
        selectedId = null;
        await refresh();
      };

      /**
       * `done` にする＝親へ運ぶ（T-0203）。運べなければ `done` にしない。
       * ★ デーモンが列の中で「既に運ばれたか」を読み直して見るので、二度押しでも二重に載らない（T-0531）。
       * ★ 画面からの操作なので、レポートが無ければ**訊く**（人がそこに居る）。
       */
      async function toDone(n) {
        let r = await call('done', { id: n.meta.id }, { quiet: true });
        if (!r) return false;
        if (!r.ok && r.empty) {
          const go = await AppUI.showMessageBox({
            title: 'レポートがありません',
            message: `${n.meta.id}「${n.meta.title}」にレポート（決定・却下・未解決）がありません。このまま完了にすると、親には 1 行の「完了」だけが載ります。よろしいですか？`,
            type: 'warning',
            buttons: [
              { label: 'やめる', value: false, style: 'normal', isCancel: true },
              { label: 'それでも完了にする', value: true, style: 'danger', isDefault: true },
            ],
          });
          if (!go || go.action !== true) return false;
          r = await call('done', { id: n.meta.id, force: true }, { quiet: true });
          if (!r) return false;
        }
        if (!r.ok) {
          AppUI.notify('親へ運べませんでした: ' + (r.reason || ''), 'error');
          return false;
        }
        if (r.skipped) AppUI.notify('この札は既に親へ運ばれています（二重には載せません）', 'info', 2500);
        else
          AppUI.notify(
            `親（${r.to || '—'}）へ運びました` + (r.reports ? `（レポート ${r.reports} 件）` : '（レポートなし）'),
            'info',
            2500,
          );
        n.baseMeta = { ...n.baseMeta, status: 'done' };
        return true;
      }

      window.saveMeta = async () => {
        // ★ 変更前の状態は current() より先に読む。current() は入力欄を同じ物へ流し込む。
        const cur = rawCurrent();
        const before = cur ? cur.meta.status : null;
        const n = current();
        if (!n) return;
        // 状態の選択から done にした場合も運ぶ。経路を 1 つに絞ると、絞られなかった側が黙って抜ける。
        if (!isProject(n) && n.meta.status === 'done' && before !== 'done' && !(await toDone(n))) return;
        if (!(await commitAll(n))) return;
        await refresh();
      };
      window.setStatus = async (s) => {
        const n = current();
        if (!n) return;
        const before = n.meta.status;
        n.meta.status = s;
        // ★ ここが「確認したので完了にする」。**運ぶのはこの瞬間**（T-0203）。
        if (!isProject(n) && s === 'done' && before !== 'done' && !(await toDone(n))) return;
        if (!(await commitAll(n))) return;
        await refresh();
      };
      window.saveBody = async () => {
        const n = current();
        if (!n) return;
        n.body = DOM('f-body').value;
        const r = await saveBodyChecked(n);
        if (!r) return; // 競合時は編集画面を閉じない（入力を捨てないため）
        editing = false;
        await refresh();
      };

      window.cyclePlan = async (i) => {
        const t = rawCurrent();
        if (!t || t.body == null) return;
        const target = String(t.body).split('\n')[i];
        if (target === undefined) return;
        const r = await call('cyclePlan', { id: t.meta.id, line: target }, { quiet: true });
        if (r && !r.ok) {
          noticeText = r.reason || 'この項目が見つかりませんでした（外部で書き換えられた可能性があります）。';
          noticeKind = 'error';
        }
        await refresh();
      };

      const quickNote = () => {
        const b = DOM('f-quick');
        return b ? b.value.trim() : '';
      };
      const clearQuick = () => {
        const b = DOM('f-quick');
        if (b) b.value = '';
      };

      window.quick = async (section, notify) => {
        const n = rawCurrent();
        if (!n) return;
        const text = quickNote();

      /**
       * レポート／総括の **枠の中へ** 追記する。
       * ふつうの追記（`- <日時> 山内: …`）は枠を閉じるので、枠の外に落ちて運ばれない。
       * だから書式を `- **追記 <日時> 山内**: …` にする（デーモンの append form=addendum）。
       */
      window.appendToRecap = async () => {

          AppUI.notify('追記する内容を書いてください', 'warning');

          AppUI.notify(`${name}がまだありません`, 'warning');

        // ★ もう親へ運ばれていたら、ここに書いても**親には届かない**。黙って書くと「直したつもり」だけが残る。訊く。
        if (info.delivered) {

            title: `この${name}はもう親へ運ばれています`,

            type: 'warning',
            buttons: [

        await refresh();

      window.send = async () => {
        const t = current();
        if (!t) return;
        t.meta.status = 'todo';
        const f = await commitAll(t);

      window.handToAI = async () => {

        if (!r || !r.ok) return;
        clearQuick();
        await notifyAI(
          `Loom ${t.meta.id}「${t.meta.title}」について、山内さんから中断の指示です。新しい作業を始めず、ここまでと次の一手を ## 進捗 に書いてから止めてください。${await hintOf(t.meta.id, r.lines[0])}`,
        );
