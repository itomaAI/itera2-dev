<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Google Drive Sync Daemon</title>
  </head>
  <body>
    <script>
      /**
       * Google Drive Sync Daemon
       *
       * Drive の 1 フォルダを VFS へマウントし、3-way マージで双方向同期する。
       * マウント先は設定で切り替える:
       *   mountPath: "drive"  → 部分木マウント
       *   mountPath: ""       → VFS 全体（ルートマウント）
       *
       * 認証は system/adapters/google_drive_auth.js が行い、本デーモンは
       * system/temp/gdrive_token.json 経由でアクセストークンを受け取るだけ。
       *
       * ── firebase_sync.html からの本質的な変更点 ─────────────────
       *
       * 1. ハッシュ空間が異なるため L と R を直接比較しない
       *    Drive の md5Checksum は Google が計算したもので、VFS のハッシュとは別物。
       *    そのまま比較すると全ファイルが恒久的に「差分あり」となり、
       *    延々とアップロードし続ける。
       *    → アンカーに両方を保持し、それぞれ自分の系で比較する:
       *         A[path].hash  ←→ L[path].hash   (VFS 側)
       *         A[path].rhash ←→ R[path].md5    (Drive 側)
       *
       * 2. パスではなく fileId が正
       *    Drive はパスを持たない。parents を辿って構成する派生情報にすぎない。
       *
       * 3. Google ネイティブ形式は同期対象外
       *    Docs/Sheets/Slides は md5Checksum も size も持たず、比較が成立しない。
       * ──────────────────────────────────────────────────
       */

      const CONFIG_PATH = 'system/config/gdrive.json';
      const TOKEN_PATH = 'system/temp/gdrive_token.json';
      const ANCHOR_PATH = 'system/temp/gdrive_anchor.json';

      const POLL_INTERVAL_MS = 20000;
      const DEBOUNCE_MS = 1500;

      /**
       * アンカーをサイクル途中で保存する間隔。
       *
       * 初回同期は数千ファイル・数時間に及ぶ。最後に一度しか保存しないと、
       * 途中で落ちたときに進捗がまったく残らない。
       */
      const ANCHOR_FLUSH_MS = 10000;

      const DRIVE_API = 'https://www.googleapis.com/drive/v3';
      const DRIVE_UPLOAD = 'https://www.googleapis.com/upload/drive/v3';

      /**
       * system/ 配下は allowlist 方式。
       * 環境ごとに異なる「設定」だけを同期し、ビルド成果物は同期しない。
       */
      const SYSTEM_SYNCED = ['system/config', 'system/registry', 'system/themes'];

      /**
       * 常に除外する領域。
       *   system/credentials … 認証情報。クラウドへ出してはならない
       *   system/temp        … 揮発領域。アンカーとトークンが入るため、
       *                        含めると自分の書き込みで自分が起動する無限ループになる
       *   system/logs        … ローカル固有かつ肥大する
       *   trash              … 削除済み
       */
      const ALWAYS_EXCLUDED = ['system/credentials', 'system/temp', 'system/logs', 'trash'];

      let config = null;
      let mountPath = 'drive';
      let rootFolderId = null;

      let accessToken = null;
      let tokenExpiresAt = 0;

      let foreignMountPaths = [];

      /**
       * 利用者が設定アプリで指定した追加の除外パス（VFS のフルパス）。
       *
       * ★ これは「同期しないもの」を増やす方向にしか働かない。
       *   ALWAYS_EXCLUDED と SYSTEM_SYNCED を緩めることはできない。
       *   認証情報の流出は取り返しがつかないため、除外は設定で穴を開けられない
       *   構造にしておく。
       */
      let userExcludedPaths = [];
      let remoteCache = {};
      let syncTimer = null;
      let isSyncing = false;
      let lastError = null;

      // ==========================================
      // パス変換
      //
      // ★ mountPath が空文字（ルートマウント）のときの取り扱いに注意。
      //   素朴に path.substring(mountPath.length + 1) と書くと、
      //   空文字では先頭 1 文字を削ってしまう。
      //   同様に path.startsWith(mountPath + '/') は '/' 始まり判定になり、
      //   全ファイルがスキップされる（エラーも出ずに何も同期されない）。
      // ==========================================

      function toRel(path) {
        return mountPath ? path.substring(mountPath.length + 1) : path;
      }

      function toFull(rel) {
        return mountPath ? `${mountPath}/${rel}` : rel;
      }

      function isUnderMount(path) {
        if (!mountPath) return !!path;
        return path === mountPath || path.startsWith(mountPath + '/');
      }

      // ==========================================
      // 除外判定
      // ==========================================

      function matchesPrefix(path, prefix) {
        return path === prefix || path.startsWith(prefix + '/');
      }

      function isExcluded(path) {
        if (!path) return true;

        // 他プロバイダの管轄下（listMounts から導出）
        for (const m of foreignMountPaths) {
          if (matchesPrefix(path, m)) return true;
        }

        for (const p of ALWAYS_EXCLUDED) {
          if (matchesPrefix(path, p)) return true;
        }

        // 利用者指定の追加除外（増やす方向にのみ作用する）
        for (const p of userExcludedPaths) {
          if (matchesPrefix(path, p)) return true;
        }

        // system/ 配下は allowlist
        if (path === 'system' || path.startsWith('system/')) {
          // 許可領域そのもの、またはその配下
          if (SYSTEM_SYNCED.some((p) => matchesPrefix(path, p))) return false;

          // ★ 許可領域の「祖先」ディレクトリは除外してはならない。
          //
          //   'system' 自身はどの許可エントリにも前方一致しないため、素朴な
          //   allowlist 判定では除外される。しかし derivePathMap() は除外した
          //   パスを導出結果から落とすので、実在する 'system' フォルダが R から
          //   消える。すると ensureRemoteFolder() は毎回「親が無い」と判断して
          //   新しい 'system' を作り、その直後に既存の 'system/config' へ飛ぶため、
          //   空のフォルダだけが取り残される。
          //
          //   実際に Drive 上へ空フォルダが 125 個堆積した（約 6 個/時）。
          //   入れ物としての祖先は同期対象に含める必要がある。
          if (SYSTEM_SYNCED.some((p) => matchesPrefix(p, path))) return false;

          return true;
        }

        return false;
      }

      /**
       * 他プロバイダが管轄する部分木をマウント表から導出する。
       *
       * ★ fail-open にしてはならない。
       * 取得に失敗したときに「他マウントは無い」とみなすと、他プロバイダの領域を
       * 自分の同期対象に含めてしまう。1 サイクル飛ばせば次のポーリングで回復するため、
       * 失敗時は中断する。
       */
      /**
       * 設定から追加の除外パスを取り込む。
       *
       * 前後の空白とスラッシュを落として正規化し、空になったものは捨てる。
       *
       * ★ 空文字を残しても「全件除外」にはならない。
       *   matchesPrefix(path, '') は path === '' か path.startsWith('/') を見るため、
       *   通常のパスには一致しない（当初コメントに誤りがあり、変異試験で判明した）。
       *   それでも捨てるのは、意味を持たない要素を毎パス走査する無駄を避け、
       *   設定の内容と実際の挙動を一致させるため。
       */
      function applyUserExcludes(cfg) {
        const list = cfg && Array.isArray(cfg.excludePaths) ? cfg.excludePaths : [];
        userExcludedPaths = list
          .filter((p) => typeof p === 'string')
          .map((p) => p.trim().replace(/^\/+|\/+$/g, ''))
          .filter((p) => p.length > 0);
      }

      async function resolveForeignMounts() {
        const mounts = await MetaOS.fs.listMounts();
        const self = (mountPath || '').replace(/^\/+|\/+$/g, '');
        return mounts.map((m) => (m.mountPath || '').replace(/^\/+|\/+$/g, '')).filter((p) => p !== '' && p !== self);
      }

      // ==========================================
      // 基本ユーティリティ
      // ==========================================

      function log(msg, level = 'info') {
        const tag = '[GDriveSync]';
        if (level === 'error') console.error(tag, msg);
        else if (level === 'warn') console.warn(tag, msg);
        else console.log(tag, msg);
      }

      function isNativeDoc(mimeType) {
        return (
          typeof mimeType === 'string' &&
          mimeType.startsWith('application/vnd.google-apps') &&
          mimeType !== 'application/vnd.google-apps.folder'
        );
      }

      function isFolder(mimeType) {
        return mimeType === 'application/vnd.google-apps.folder';
      }

      // ==========================================
      // 認証
      // ==========================================

      async function loadToken() {
        try {
          const raw = await MetaOS.fs.read(TOKEN_PATH);
          const data = JSON.parse(raw || '{}');
          if (!data.accessToken) return false;
          if (data.expiresAt && Date.now() >= data.expiresAt) {
            accessToken = null;
            return false;
          }
          accessToken = data.accessToken;
          tokenExpiresAt = data.expiresAt || 0;
          return true;
        } catch (e) {
          return false;
        }
      }

      /**
       * ★ 401 を受けたら、ディスク上のトークンを読み直して 1 回だけ再試行する。
       *
       * accessToken はモジュール変数で、reconcile() の先頭で一度読むだけだった。
       * ブラウザのみの OAuth は 1 時間・リフレッシュ無しのため、初回同期のように
       * 長いサイクルでは走行中に必ず失効する。再読込が無いと、ユーザーが
       * その場で再認証してもサイクルは復活せず、丸ごと捨てることになっていた。
       */
      async function driveFetch(url, options = {}, _retried = false) {
        if (!accessToken) throw new Error('NOT_AUTHENTICATED');

        // ★ DELETE の成功応答は 204 No Content で本文が空。
        //   JSON として解析すると例外になり、成功が失敗として報告される。
        const method = (options.method || 'GET').toUpperCase();
        const responseType = options.responseType || (method === 'DELETE' ? 'text' : 'json');

        const res = await MetaOS.net.fetch(url, {
          ...options,
          headers: {
            ...(options.headers || {}),
            Authorization: `Bearer ${accessToken}`,
          },
          responseType,
        });

        if (res.status === 401) {
          accessToken = null;
          if (!_retried && (await loadToken())) {
            log('Access token was refreshed mid-cycle. Retrying.');
            return driveFetch(url, options, true);
          }
          throw new Error('TOKEN_EXPIRED');
        }
        if (res.status < 200 || res.status >= 300) {
          const detail =
            typeof res.data === 'string' ? res.data.slice(0, 200) : JSON.stringify(res.data || {}).slice(0, 200);
          // ★ ステータスを構造化して持たせる。呼び出し側は「不在(404)」と
          //   「判定不能(5xx・レート制限)」を区別する必要があり、
          //   メッセージ文字列の解析でそれを行うのは脆い。
          const err = new Error(`Drive API ${res.status}: ${detail}`);
          err.status = res.status;
          throw err;
        }
        return res.data;
      }

      // ==========================================
      // リモート索引（ベースライン + 差分）
      //
      // firebase_sync.html は vfs_index（チャンク化ベースライン）を一括ロードし、
      // vfs_nodes（WAL）を onSnapshot で購読する。よって reconcile() の中では
      // 通信をしない。Drive には購読が無いため、同じ性質を 2 つで再現する:
      //
      //   ベースライン … files.list のフラット検索（親を指定しない）。
      //                  1,000 件/リクエストのため 6,000 件でも約 7 通信で揃う。
      //   WAL         … changes.list。前回カーソル以降の差分だけを取る。
      //
      // ★ 索引は fileId を主キーとし、パスは毎サイクル導出する。
      //   Drive はパスを持たず、フォルダ名の変更は配下すべてのパスを変える。
      //   パスを直接保存して更新する実装は、リネーム時に必ず壊れる。
      //
      // ★ 以前の実装はフォルダごとに 'id' in parents を投げる BFS だった。
      //   1,468 ディレクトリで 1,400 回以上のラウンドトリップを要し、しかも
      //   キャッシュが無いため 20 秒ごとに永久に繰り返していた。
      // ==========================================

      const INDEX_PATH = 'system/temp/gdrive_index.json';

      /** 差分が積み上がるとカーソルが失効しうるため、一定時間で作り直す。 */
      const INDEX_MAX_AGE_MS = 24 * 60 * 60 * 1000;

      let index = { byId: {}, pageToken: null, builtAt: 0, rootFolderId: null };
      let changesSupported = true;

      /**
       * ★ 索引がメモリ上でのみ変化していることを示す。
       *
       * index.byId は saveIndex() を経ない経路（ensureRemoteFolder / indexUploaded /
       * trashRemote / verifyRemoteAlive）でも書き換わる。これらを保存しないまま
       * 再起動すると、前回保存以降にアップロードした分が索引から欠落し、
       * 次サイクルで「リモートから消えた」と誤読される。
       *
       * ただし 1 件ごとに保存すると数百 KB の書き込みを初回同期中に数千回行うため、
       * アンカーと同じくダーティフラグ + 定期フラッシュ方式にする。
       */
      let indexDirty = false;

      function markIndexDirty() {
        indexDirty = true;
      }

      function isAuthError(e) {
        return !!e && (e.message === 'TOKEN_EXPIRED' || e.message === 'NOT_AUTHENTICATED');
      }

      function nodeFromDriveFile(f) {
        return {
          name: f.name,
          parents: Array.isArray(f.parents) ? f.parents.slice() : [],
          kind: isFolder(f.mimeType) ? 'directory' : 'file',
          md5: f.md5Checksum || null,
          size: Number(f.size || 0),
          modifiedTime: f.modifiedTime ? Date.parse(f.modifiedTime) : Date.now(),
        };
      }

      async function saveIndex() {
        try {
          await MetaOS.fs.write(INDEX_PATH, JSON.stringify(index), {
            overwrite: true,
            silent: true,
          });
          indexDirty = false;
        } catch (e) {
          // 失敗時はフラグを落とさない。次のフラッシュ機会に再試行される。
          log(`Could not persist the index: ${e.message}`, 'warn');
        }
      }

      async function loadIndex() {
        try {
          const raw = await MetaOS.fs.read(INDEX_PATH);
          const data = JSON.parse(raw || '{}');
          if (!data || !data.byId || !data.builtAt) return false;

          // ★ マウント先フォルダを差し替えたのに前の索引を使うと、
          //   別フォルダの内容をこのフォルダの状態だと誤認する。
          if (data.rootFolderId !== rootFolderId) return false;
          if (Date.now() - data.builtAt > INDEX_MAX_AGE_MS) return false;

          index = {
            byId: data.byId,
            pageToken: data.pageToken || null,
            builtAt: data.builtAt,
            rootFolderId,
          };
          changesSupported = !!index.pageToken;
          log(`Index restored from disk: ${Object.keys(index.byId).length} node(s)`);
          return true;
        } catch (e) {
          return false;
        }
      }

      /**
       * 全件をフラット検索で取得して索引を作り直す。
       *
       * ★ 変更カーソルはスキャンの「前」に取る。
       *   後に取ると、スキャン中に起きた変更が両方から漏れる。
       */
      async function buildIndexFlat() {
        let pageToken = null;
        try {
          const cur = await driveFetch(`${DRIVE_API}/changes/startPageToken?fields=startPageToken`);
          pageToken = (cur && cur.startPageToken) || null;
        } catch (e) {
          if (isAuthError(e)) throw e;
          log(`Could not obtain a change cursor: ${e.message}. Delta sync disabled.`, 'warn');
        }

        const byId = {};
        const t0 = Date.now();
        let requests = 0;
        let next = null;

        do {
          const q = encodeURIComponent('trashed=false');
          const fields = encodeURIComponent(
            'nextPageToken,files(id,name,mimeType,md5Checksum,size,modifiedTime,parents)',
          );
          let url = `${DRIVE_API}/files?q=${q}&fields=${fields}&pageSize=1000`;
          if (next) url += `&pageToken=${encodeURIComponent(next)}`;

          const data = await driveFetch(url);
          requests++;

          for (const f of (data && data.files) || []) {
            if (isNativeDoc(f.mimeType)) continue;
            byId[f.id] = nodeFromDriveFile(f);
          }
          next = (data && data.nextPageToken) || null;
        } while (next);

        index = { byId, pageToken, builtAt: Date.now(), rootFolderId };
        changesSupported = !!pageToken;

        log(`Index built: ${Object.keys(byId).length} node(s), ` + `${requests} request(s), ${Date.now() - t0} ms`);
        await saveIndex();
      }

      /**
       * 前回カーソル以降の差分を索引へ適用する。
       * 差分が使えない環境では false を返し、呼び出し側が全件取得へ退避する。
       */
      async function applyChanges() {
        if (!index.pageToken) return false;

        let cursor = index.pageToken;
        let applied = 0;

        while (true) {
          const fields = encodeURIComponent(
            'newStartPageToken,nextPageToken,' +
              'changes(fileId,removed,file(id,name,mimeType,md5Checksum,size,modifiedTime,parents,trashed))',
          );
          const url =
            `${DRIVE_API}/changes?pageToken=${encodeURIComponent(cursor)}` +
            `&fields=${fields}&pageSize=1000&includeRemoved=true`;

          let data;
          try {
            data = await driveFetch(url);
          } catch (e) {
            if (isAuthError(e)) throw e;
            log(`changes.list is unavailable (${e.message}). Falling back to a full scan.`, 'warn');
            changesSupported = false;
            return false;
          }

          for (const c of (data && data.changes) || []) {
            const f = c.file;
            if (c.removed || !f || f.trashed || isNativeDoc(f.mimeType)) {
              delete index.byId[c.fileId];
            } else {
              index.byId[f.id] = nodeFromDriveFile(f);
            }
            applied++;
          }

          if (data && data.newStartPageToken) {
            index.pageToken = data.newStartPageToken;
            break;
          }
          cursor = (data && data.nextPageToken) || null;
          if (!cursor) break;
        }

        // ★ 無変更のときは書かない。20 秒ごとに数 MB を書き直すのは無駄なうえ、
        //   カーソルだけ進めて保存しないことによる不利益は「再起動時に
        //   少し前から差分を読み直す」ことだけで、適用は冪等なので害が無い。
        if (applied > 0) {
          log(`Applied ${applied} remote change(s).`);
          await saveIndex();
        }
        return true;
      }

      /**
       * 索引（id 基準）から、このサイクルで使うパス表を導出する。
       *
       * rootFolderId から到達できないものは捨てる。これは範囲の限定であると同時に、
       * ゴミ箱に入ったフォルダの子を自動的に除外する働きも持つ。
       * （親フォルダは trashed=false の検索に現れないため、子は到達不能になる）
       */
      function derivePathMap() {
        const byId = index.byId;
        const memo = new Map();
        const visiting = new Set();

        const relOf = (id) => {
          if (id === rootFolderId) return '';
          if (memo.has(id)) return memo.get(id);

          const node = byId[id];
          if (!node) return null; // 圏外・ゴミ箱・親が取得できない
          if (visiting.has(id)) return null; // 循環ガード（保険）

          visiting.add(id);
          let rel = null;
          for (const parentId of node.parents.slice().sort()) {
            const parentRel = relOf(parentId);
            if (parentRel === null) continue;
            rel = parentRel ? `${parentRel}/${node.name}` : node.name;
            break;
          }
          visiting.delete(id);

          memo.set(id, rel);
          return rel;
        };

        const result = {};
        const claimed = new Map();

        for (const id of Object.keys(byId)) {
          const node = byId[id];

          if (node.name.includes('/')) {
            log(`Skipping '${node.name}': name contains a path separator.`, 'warn');
            continue;
          }

          const rel = relOf(id);
          if (rel === null || rel === '') continue;

          const fullPath = toFull(rel);
          if (isExcluded(fullPath)) continue;

          // Drive は同一フォルダ内の同名を許す。どちらを採るかは決定的に選ぶ。
          const prev = claimed.get(fullPath);
          if (prev) {
            const wins =
              node.modifiedTime > prev.modifiedTime || (node.modifiedTime === prev.modifiedTime && id > prev.id);
            log(`Duplicate remote path '${fullPath}'. Keeping ${wins ? id : prev.id}.`, 'warn');
            if (!wins) continue;
          }
          claimed.set(fullPath, { id, modifiedTime: node.modifiedTime });

          result[fullPath] =
            node.kind === 'directory'
              ? { id, kind: 'directory' }
              : {
                  id,
                  kind: 'file',
                  md5: node.md5,
                  size: node.size,
                  modifiedTime: node.modifiedTime,
                };
        }

        return result;
      }

      async function getRemoteState() {
        if (!index.builtAt || index.rootFolderId !== rootFolderId) {
          if (!(await loadIndex())) await buildIndexFlat();
        } else if (Date.now() - index.builtAt > INDEX_MAX_AGE_MS) {
          await buildIndexFlat();
        } else if (changesSupported) {
          if (!(await applyChanges())) await buildIndexFlat();
        } else {
          // 差分が使えなくても、全件フラット取得なら約 7 通信で済む。
          await buildIndexFlat();
        }

        return derivePathMap();
      }

      /**
       * リモートに本当に存在しないことを 1 件だけ直接確認する。
       *
       * ★ 索引の取りこぼしは「リモートで削除された」と等価に見え、
       *   3-way マージの Pull 分岐がローカルの実体を恒久削除する。
       *   削除は稀なので、実行前に必ず現物を確認する。
       *   生きていた場合は索引へ戻し、取りこぼしをその場で修復する。
       *
       * ★ 戻り値は 3 値。「不在」と「判定不能」を混同してはならない。
       *   以前はここが 2 値で、5xx・レート制限・通信瞬断まで「不在」に倒しており、
       *   安全網の内部に安全網を無効化する穴が開いていた。
       *
       *     'alive'   … 現物が存在する（索引へ復元済み）
       *     'gone'    … 存在しないことが確定した（404 / trashed）
       *     'unknown' … 判定できなかった（5xx・ネットワーク・id 不明）
       *
       *   認証エラーは従来どおり throw し、サイクルを中断させる。
       */
      async function verifyRemoteAlive(fileId) {
        if (!fileId) return 'unknown';
        try {
          const f = await driveFetch(
            `${DRIVE_API}/files/${fileId}` + `?fields=id,name,mimeType,md5Checksum,size,modifiedTime,parents,trashed`,
          );
          if (f && f.id && f.trashed === true) return 'gone';
          if (!f || !f.id) return 'unknown'; // 200 だが解釈できない応答
          index.byId[f.id] = nodeFromDriveFile(f);
          markIndexDirty();
          return 'alive';
        } catch (e) {
          if (isAuthError(e)) throw e;
          if (e && e.status === 404) return 'gone';
          return 'unknown';
        }
      }

      // ==========================================
      // アンカー
      // ==========================================

      async function getAnchor() {
        try {
          const raw = await MetaOS.fs.read(ANCHOR_PATH);
          return JSON.parse(raw || '{}');
        } catch (e) {
          return {};
        }
      }

      async function saveAnchor(anchor) {
        await MetaOS.fs.write(ANCHOR_PATH, JSON.stringify(anchor, null, 2), {
          overwrite: true,
          silent: true,
        });
      }

      // ==========================================
      // Drive への書き込み
      // ==========================================

      async function ensureRemoteFolder(relDirPath, remoteState) {
        if (!relDirPath) return rootFolderId;

        const parts = relDirPath.split('/');
        let parentId = rootFolderId;
        let acc = '';

        for (const part of parts) {
          acc = acc ? `${acc}/${part}` : part;
          const fullPath = toFull(acc);
          const known = remoteState[fullPath];

          if (known && known.kind === 'directory') {
            parentId = known.id;
            continue;
          }

          const created = await driveFetch(`${DRIVE_API}/files?fields=id`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: part,
              mimeType: 'application/vnd.google-apps.folder',
              parents: [parentId],
            }),
          });

          // ★ 自分の書き込みは即座に索引へ反映する。
          //   反映を怠ると、次サイクルの導出結果に作ったばかりのものが現れず、
          //   3-way マージが「リモートで消えた」と誤読する。
          //   （parentId はこの直後に上書きされるため、ここで記録する）
          index.byId[created.id] = {
            name: part,
            parents: [parentId],
            kind: 'directory',
            md5: null,
            size: 0,
            modifiedTime: Date.now(),
          };

          markIndexDirty();

          parentId = created.id;
          remoteState[fullPath] = { id: created.id, kind: 'directory' };
        }
        return parentId;
      }

      /** アップロード結果を索引へ反映する。 */
      function indexUploaded(res, name, parentId) {
        if (!res || !res.id) return;
        const prev = index.byId[res.id];
        index.byId[res.id] = {
          name: name !== null && name !== undefined ? name : prev ? prev.name : '',
          parents: parentId ? [parentId] : prev ? prev.parents : [],
          kind: 'file',
          md5: res.md5Checksum || null,
          size: Number(res.size || 0),
          modifiedTime: res.modifiedTime ? Date.parse(res.modifiedTime) : Date.now(),
        };
        markIndexDirty();
      }

      async function uploadNew(path, bytes, remoteState) {
        const rel = toRel(path);
        const idx = rel.lastIndexOf('/');
        const dir = idx === -1 ? '' : rel.substring(0, idx);
        const name = idx === -1 ? rel : rel.substring(idx + 1);

        const parentId = await ensureRemoteFolder(dir, remoteState);

        const boundary = `itera${Date.now()}${Math.random().toString(16).slice(2)}`;
        const metadata = JSON.stringify({ name, parents: [parentId] });

        const enc = new TextEncoder();
        const head = enc.encode(
          `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metadata}\r\n` +
            `--${boundary}\r\nContent-Type: application/octet-stream\r\n\r\n`,
        );
        const tail = enc.encode(`\r\n--${boundary}--\r\n`);

        const body = new Uint8Array(head.length + bytes.length + tail.length);
        body.set(head, 0);
        body.set(bytes, head.length);
        body.set(tail, head.length + bytes.length);

        const res = await driveFetch(
          `${DRIVE_UPLOAD}/files?uploadType=multipart&fields=id,md5Checksum,size,modifiedTime`,
          {
            method: 'POST',
            headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
            body,
          },
        );
        indexUploaded(res, name, parentId);
        return res;
      }

      async function uploadUpdate(fileId, bytes) {
        const res = await driveFetch(
          `${DRIVE_UPLOAD}/files/${fileId}?uploadType=media&fields=id,md5Checksum,size,modifiedTime`,
          {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/octet-stream' },
            body: bytes,
          },
        );
        indexUploaded(res, null, null);
        return res;
      }

      /**
       * 削除ではなくゴミ箱へ送る。
       * 同期の誤判定でユーザーのファイルが復元不能になる事故を避けるため、
       * 恒久削除は行わない。
       */
      async function trashRemote(fileId) {
        await driveFetch(`${DRIVE_API}/files/${fileId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ trashed: true }),
        });
        delete index.byId[fileId];
        markIndexDirty();
      }

      // ==========================================
      // 3-way マージ
      // ==========================================

      function triggerSync() {
        clearTimeout(syncTimer);
        syncTimer = setTimeout(async () => {
          if (isSyncing) {
            triggerSync();
            return;
          }
          isSyncing = true;
          try {
            await reconcile();
            lastError = null;
          } catch (e) {
            if (e.message === 'NOT_AUTHENTICATED' || e.message === 'TOKEN_EXPIRED') {
              log('Waiting for authentication...');
            } else {
              lastError = e.message;
              log(`Sync failed: ${e.message}`, 'error');
            }
          } finally {
            isSyncing = false;
          }
        }, DEBOUNCE_MS);
      }

      async function reconcile() {
        if (!(await loadToken())) throw new Error('NOT_AUTHENTICATED');
        if (!rootFolderId) throw new Error('Root folder is not configured');

        // 管轄外の導出を最初に行う。失敗したらサイクルごと中断する（fail-closed）。
        try {
          foreignMountPaths = await resolveForeignMounts();
        } catch (e) {
          log('Could not resolve mount table. Skipping this cycle.', 'warn');
          return;
        }

        const L = await MetaOS.fs.getSyncState(mountPath);
        const R = await getRemoteState();
        const A = await getAnchor();
        remoteCache = R;

        const isAnchorEmpty = Object.keys(A).length === 0;
        const allPaths = new Set([...Object.keys(L), ...Object.keys(R), ...Object.keys(A)]);
        const newAnchor = { ...A };

        if (mountPath) allPaths.delete(mountPath);

        let ops = 0;
        // コールドスタートでローカル実体を温存した件数（ループ後に要約を出す）
        let coldStartKept = 0;
        let lastFlush = Date.now();

        /**
         * ★ ここでアンカーを定期保存する。
         *
         * newAnchor の各エントリは、対応する操作が成功した「後」にのみ書かれる。
         * よって途中まで保存されたアンカーは常に正しい部分集合であり、
         * 早めに永続化しても不整合は生じない。
         * 失われるのは最大でも ANCHOR_FLUSH_MS 分の進捗にとどまる。
         */
        const breathe = async () => {
          if (++ops % 25 === 0) await new Promise((r) => setTimeout(r, 0));
          if (Date.now() - lastFlush >= ANCHOR_FLUSH_MS) {
            lastFlush = Date.now();
            try {
              await saveAnchor(newAnchor);
            } catch (e) {
              log(`Could not flush anchor: ${e.message}`, 'warn');
            }
            // ★ 索引も同じ間隔で永続化する。アップロードで得た fileId が
            //   ディスクに残らないまま再起動すると、その分が索引から欠落し、
            //   次サイクルで「リモートから消えた」と誤読される。
            //   （この時点の索引は全件スキャン完了後の完全な集合であり、
            //     部分的な索引を保存することにはならない）
            if (indexDirty) await saveIndex();
          }
        };

        for (const path of allPaths) {
          if (!isUnderMount(path)) continue;
          if (isExcluded(path)) continue;

          try {
            const l = L[path];
            const r = R[path];
            const a = A[path];

            const lExists = !!l && !l.isDeleted;
            const rExists = !!r;

            // ★ ハッシュ空間が異なるため、L と R を直接比較してはならない。
            const localChanged = lExists ? !a || a.hash !== l.hash : !!a;
            const remoteChanged = rExists ? !a || a.rhash !== (r.md5 || null) : !!a;

            // --- コールドスタート: アンカーが空ならリモートを正とする ---
            //
            // ★ ただし「ローカルに実体があるファイル」を決してスタブ化しないこと。
            //
            //   createStub() は contentRef を外すため、ローカルのバイト列が失われる。
            //   「リモートに同名パスがある」ことは、その実体を後から取得できることを
            //   保証しない。接続先フォルダの変更、リモート側での削除、索引の取りこぼし
            //   などで fileId は容易に到達不能になる。そうなった瞬間スタブは二度と
            //   実体化できず、Push 分岐も read に失敗する（スタブは読めない）ため
            //   自力復帰もできない。つまり片道の破壊になる。
            //
            //   2026-08-12 07:49 に実際にこれで 104 ファイルを失った。マウント先を
            //   'drive' から VFS ルートへ変更したことでアンカーが空になり、当時の
            //   接続先フォルダに存在したパスのローカル実体が捨てられた。そのフォルダは
            //   現在到達不能で（Drive のゴミ箱にも無い）、内容は復元不能である。
            //
            //   したがってスタブ化は「ローカルに実体が無い」場合に限る。新規端末では
            //   ローカルが存在しないため従来どおり動作し、挙動が変わるのは
            //   「実体を捨てようとしていた場合」だけである。
            //
            //   実体がある場合はローカルを残し、anchor.hash を null にしておく。
            //   次サイクルで localChanged が立ち、Push 分岐がリモートへ送る。
            //   リモートを上書きしうるが、Drive 側は版管理とゴミ箱で復旧できる一方、
            //   ローカルのバイト列は復旧できない。この非対称性に従って局所を優先する。
            if (isAnchorEmpty && rExists) {
              if (r.kind === 'directory') {
                if (!(await MetaOS.fs.exists(path))) await MetaOS.fs.mkdir(path);
                newAnchor[path] = { id: r.id, kind: 'directory', hash: null, rhash: r.md5 || null };
              } else if (lExists && l.hash) {
                // ローカルに実体がある。スタブ化せず温存し、次サイクルで Push する。
                // （スタブは hash === null なので、この判定で実体の有無を見分けられる）
                coldStartKept++;
                newAnchor[path] = { id: r.id, kind: 'file', hash: null, rhash: r.md5 || null };
              } else {
                await MetaOS.fs.createStub(path, {
                  size: r.size,
                  hash: null,
                  updatedAt: r.modifiedTime,
                });
                newAnchor[path] = { id: r.id, kind: 'file', hash: null, rhash: r.md5 || null };
              }
              await breathe();
              continue;
            }

            if (!localChanged && !remoteChanged) continue;

            // --- Pull (リモートのみ変化) ---
            if (!localChanged && remoteChanged) {
              if (!rExists) {
                // ★ 削除は取り返しがつかないため、索引だけを根拠に実行しない。
                //   索引の取りこぼしは「リモートで削除された」と区別がつかない。
                //   現物を 1 件確認し、"不在が確定したときだけ" 削除する（fail-closed）。
                //
                //   'alive'   … 索引の取りこぼし。復元済みなので次サイクルで正しい分岐に入る。
                //   'unknown' … 5xx・通信瞬断・アンカーに id が無い等。判断材料が無いので触らない。
                //               本当に消えていた場合はローカルに残り続けるが、
                //               ユーザーのファイルを誤って消すより軽微である。
                const remoteState = a && a.id ? await verifyRemoteAlive(a.id) : 'unknown';
                if (remoteState === 'alive') {
                  log(`'${path}' is still present on Drive. Index gap repaired.`, 'warn');
                  await breathe();
                  continue;
                }
                if (remoteState !== 'gone') {
                  log(`Skipping deletion of '${path}': remote state is ${remoteState}.`, 'warn');
                  await breathe();
                  continue;
                }
                if (await MetaOS.fs.exists(path)) await MetaOS.fs.delete(path, { permanent: true });
                delete newAnchor[path];
              } else if (r.kind === 'directory') {
                if (!(await MetaOS.fs.exists(path))) await MetaOS.fs.mkdir(path);
                newAnchor[path] = { id: r.id, kind: 'directory', hash: null, rhash: null };
              } else {
                await MetaOS.fs.createStub(path, {
                  size: r.size,
                  hash: null,
                  updatedAt: r.modifiedTime,
                });
                newAnchor[path] = { id: r.id, kind: 'file', hash: null, rhash: r.md5 || null };
              }
              await breathe();
              continue;
            }

            // --- Push (ローカルのみ変化) ---
            if (localChanged && !remoteChanged) {
              if (!lExists) {
                if (a && a.id) await trashRemote(a.id);
                delete newAnchor[path];
              } else if (l.kind === 'directory') {
                const id = await ensureRemoteFolder(toRel(path), R);
                newAnchor[path] = { id, kind: 'directory', hash: null, rhash: null };
              } else {
                const bytes = await MetaOS.fs.read(path, { encoding: 'binary' });
                const res = a && a.id ? await uploadUpdate(a.id, bytes) : await uploadNew(path, bytes, R);
                newAnchor[path] = {
                  id: res.id,
                  kind: 'file',
                  hash: l.hash,
                  rhash: res.md5Checksum || null,
                };
              }
              await breathe();
              continue;
            }

            // --- Conflict (両方変化) ---
            if (lExists && l.kind !== 'directory') {
              const conflictPath = path.match(/(\.[^.]+)$/)
                ? path.replace(/(\.[^.]+)$/, ' (Conflicted Copy)$1')
                : `${path} (Conflicted Copy)`;
              await MetaOS.fs.rename(path, conflictPath);
            }

            if (rExists) {
              if (r.kind === 'directory') {
                if (!(await MetaOS.fs.exists(path))) await MetaOS.fs.mkdir(path);
                newAnchor[path] = { id: r.id, kind: 'directory', hash: null, rhash: null };
              } else {
                await MetaOS.fs.createStub(path, {
                  size: r.size,
                  hash: null,
                  updatedAt: r.modifiedTime,
                });
                newAnchor[path] = { id: r.id, kind: 'file', hash: null, rhash: r.md5 || null };
              }
            } else {
              delete newAnchor[path];
            }
            await breathe();
          } catch (e) {
            if (e.message === 'TOKEN_EXPIRED' || e.message === 'NOT_AUTHENTICATED') {
              // ★ 中断はここからしか抜けない。捨てる前に進捗を残す。
              //   これを怠るとアンカーが空のままになり、次サイクルが
              //   コールドスタート分岐に入ってアップロード済みの実体をスタブ化する。
              try {
                await saveAnchor(newAnchor);
              } catch (e2) {
                log(`Could not persist anchor before aborting: ${e2.message}`, 'warn');
              }
              // ★ 索引も残す。アンカーだけを残すと、アップロード済みの id が
              //   索引から欠落した状態で次サイクルが始まる。
              if (indexDirty) await saveIndex();
              throw e;
            }
            log(`Skipped '${path}': ${e.message}`, 'warn');
          }
        }

        if (coldStartKept > 0) {
          log(
            `Cold start: kept local content for ${coldStartKept} file(s) instead of replacing them with stubs. ` +
              `These will be pushed to Drive on the next cycles.`,
            'warn'
          );
        }

        await saveAnchor(newAnchor);
        if (indexDirty) await saveIndex();
      }

      // ==========================================
      // 遅延実体化
      // ==========================================

      async function onFetchContent(path) {
        try {
          if (!(await loadToken())) return false;

          const anchor = await getAnchor();
          const entry = anchor[path] || remoteCache[path];
          const fileId = entry && entry.id;
          if (!fileId) {
            log(`No fileId known for ${path}`, 'warn');
            return false;
          }

          const res = await MetaOS.net.fetch(`${DRIVE_API}/files/${fileId}?alt=media`, {
            headers: { Authorization: `Bearer ${accessToken}` },
            responseType: 'arraybuffer',
          });
          if (res.status < 200 || res.status >= 300) {
            log(`Download failed for ${path}: HTTP ${res.status}`, 'error');
            return false;
          }

          await MetaOS.fs.write(path, res.data, { overwrite: true, silent: true });

          // 実体化したのでアンカーのローカル側ハッシュを更新する。
          // ここを怠ると次のサイクルで「ローカルが変化した」と誤判定し、
          // 落としたばかりの内容をそのまま押し返してしまう。
          try {
            const stat = await MetaOS.fs.stat(path);
            if (stat && anchor[path]) {
              anchor[path].hash = stat.hash || null;
              await saveAnchor(anchor);
            }
          } catch (e) {
            log(`Could not refresh anchor hash for ${path}: ${e.message}`, 'warn');
          }

          return true;
        } catch (e) {
          log(`onFetchContent failed for ${path}: ${e.message}`, 'error');
          return false;
        }
      }

      // ==========================================
      // 初期化
      // ==========================================

      async function init() {
        if (!window.MetaOS) return setTimeout(init, 100);

        try {
          const raw = await MetaOS.fs.read(CONFIG_PATH);
          config = JSON.parse(raw || '{}');
        } catch (e) {
          log(`Config not found at ${CONFIG_PATH}. Daemon will stay idle.`, 'warn');
          return;
        }

        // 空文字はルートマウントを意味する。未指定（undefined）とは区別する。
        mountPath = typeof config.mountPath === 'string' ? config.mountPath.replace(/^\/+|\/+$/g, '') : 'drive';
        applyUserExcludes(config);

        if (mountPath && !(await MetaOS.fs.exists(mountPath))) {
          try {
            await MetaOS.fs.mkdir(mountPath);
          } catch (e) {
            log(`Could not create mount point '${mountPath}': ${e.message}`, 'error');
            return;
          }
        }

        await MetaOS.fs.registerSyncProvider(mountPath, {
          onFetchContent,
          onMutate: () => triggerSync(),
        });

        log(mountPath ? `Mounted at /${mountPath}` : 'Mounted at VFS root');

        const waitForFolder = async () => {
          try {
            const raw = await MetaOS.fs.read(CONFIG_PATH);
            const cfg = JSON.parse(raw || '{}');
            if (cfg.folderId) {
              rootFolderId = cfg.folderId;
              config = cfg;
              applyUserExcludes(cfg);
              log(`Root folder resolved: ${rootFolderId}`);
              triggerSync();
              return;
            }
          } catch (e) {
            /* 設定が読めない間は待つ */
          }
          setTimeout(waitForFolder, 3000);
        };
        waitForFolder();

        setInterval(() => {
          if (rootFolderId) triggerSync();
        }, POLL_INTERVAL_MS);
      }

      init();
    </script>
  </body>
</html>
