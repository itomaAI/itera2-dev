<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Itera Local Bridge Daemon v3</title>
  </head>
  <body>
    <script>
      // Itera Local Bridge Daemon v3
      //   接続(サーバー) x ルート(ディレクトリ) の二段構造。
      //   マウント先は local/<接続名>/<ルート名> に固定する。
      //   設計メモ: docs/blueprints/local_bridge_v3.md
      (async function main() {
        if (!window.MetaOS) return setTimeout(main, 100);

        const CONFIG_PATH = 'system/config/local_bridge.json';
        // アンカーは非揮発の場所に置く。system/temp はセッション破棄で消え、
        // 「アンカーが無い」状態は調停の分岐4（ローカルに新規）を誤成立させる。
        const ANCHOR_DIR = 'data/apps/local_bridge/anchors';
        const LEGACY_ANCHOR_DIR = 'system/temp/local_bridge';
        const MOUNT_BASE = 'local';
        // ホスト側の変更に気づく経路。
        // v3.5 以降のサーバーは long-poll に対応し、変化があるまで応答を保留する。
        // ROOT_POLL_MS は「旧サーバー相手の間隔」と「切断時の再確認の間隔」として残す。
        const ROOT_POLL_MS = 5000;
        // 保留の上限。長すぎると詰まったときの復帰が遅れ、短すぎると往復が増える。
        const LONG_POLL_SEC = 25;
        // long-poll のつもりが即座に返り続ける相手（想定外のサーバー）でも
        // 秒間4回を超えて叩かないための歯止め。
        const MIN_LOOP_MS = 250;
        // VFS 側の連続した書き込みをまとめるための待ち。
        const SYNC_DEBOUNCE_MS = 800;
        // ホスト由来（rev の変化）の待ち。ホスト側で既に 1.5 秒まとめられているので、
        // ここで重ねて待つ必要はない。ただし直前に VFS 側の書き込みがあったときは
        // SYNC_DEBOUNCE_MS に戻す（衝突の窓を自分から広げない）。
        const REMOTE_SYNC_DEBOUNCE_MS = 150;
        const ANCHOR_VERSION = 2;

        const DEFAULT_CONFIG = {
          connections: [{ serverUrl: 'http://127.0.0.1:8001', execMode: 'ask', enabled: true }],
          ignorePatterns: [
            '.git',
            '.venv',
            'venv',
            'node_modules',
            '__pycache__',
            '*.pyc',
            '.DS_Store',
            'dist',
            'build',
          ],
        };

        let config = DEFAULT_CONFIG;
        try {
          config = { ...DEFAULT_CONFIG, ...JSON.parse(await MetaOS.fs.read(CONFIG_PATH)) };
        } catch (e) {
          try {
            await MetaOS.fs.write(CONFIG_PATH, JSON.stringify(DEFAULT_CONFIG, null, 2), {
              overwrite: true,
              silent: true,
            });
          } catch (e2) {}
        }

        const log = (msg) => console.log('[LocalBridge] ' + msg);

        async function saveConfig() {
          try {
            await MetaOS.fs.write(CONFIG_PATH, JSON.stringify(config, null, 2), { overwrite: true, silent: true });
          } catch (e) {
            log(`設定の書き戻しに失敗: ${e.message}`);
          }
        }

        // 接続の実行時表現。name はサーバーが名乗ったホスト名で確定させる。
        // 設定に name があればそれを優先する（一度決まったマウントパスを勝手に変えない）。
        const connections = (config.connections || [])
          .filter((c) => c && c.enabled !== false)
          .map((cfg) => ({
            cfg,
            name: cfg.name || null,
            serverUrl: (cfg.serverUrl || '').replace(/\/+$/, ''),
            execMode: cfg.execMode || 'ask',
            identity: null,
          }));

        const mounts = new Map(); // mountPath -> {conn, root, rootPath, syncing, halted, timer}

        // ホスト名をマウント名に使える形へ落とす。'.local' は Bonjour の飾りなので落とす。
        function sanitizeName(raw) {
          const s = String(raw || '')
            .trim()
            .toLowerCase()
            .replace(/\.local$/, '')
            .replace(/[^a-z0-9._-]+/g, '-')
            .replace(/^[-.]+|[-.]+$/g, '');
          return s || 'unknown-host';
        }

        // ---------- 無視パターン ----------
        function globToRegex(glob) {
          let re = '';
          for (const c of glob) {
            if (c === '*') re += '.*';
            else if (c === '?') re += '.';
            else if ('.+^$()[]{}|\\'.includes(c)) re += '\\' + c;
            else re += c;
          }
          return new RegExp('^' + re + '$');
        }

        function compileIgnorePatterns(patterns) {
          const compiled = [];
          for (const raw of patterns || []) {
            let pat = (raw || '').trim();
            if (!pat || pat.startsWith('#')) continue;
            if (pat.endsWith('/')) pat = pat.slice(0, -1);
            if (!pat) continue;
            try {
              compiled.push({ re: globToRegex(pat), matchesFullPath: pat.includes('/') });
            } catch (e) {}
          }
          return compiled;
        }

        function isIgnoredCompiled(rel, compiled) {
          if (!compiled || !compiled.length) return false;
          const parts = rel.split('/');
          for (const entry of compiled) {
            if (entry.matchesFullPath) {
              if (entry.re.test(rel)) return true;
            } else if (parts.some((seg) => entry.re.test(seg))) return true;
          }
          return false;
        }

        /**
         * 無視パターンは「全体の既定 ∪ 接続ごと ∪ ルートごと」の**和**で効く（T-0059）。
         *
         *   config.ignorePatterns                … 全体の既定
         *   conn.ignorePatterns                  … 接続ごと
         *   conn.roots?.[root]?.ignorePatterns   … ルートごと
         *
         * 上書きにしなかったのは、接続ごとの設定が全体の既定を黙って弱める書き方を
         * 生まないため。緩めたいときは全体の既定から外す。
         */
        function ignorePatternsFor(conn, root) {
          const out = [...(config.ignorePatterns || [])];
          if (conn && Array.isArray(conn.ignorePatterns)) out.push(...conn.ignorePatterns);
          const perRoot = conn && conn.roots && conn.roots[root];
          if (perRoot && Array.isArray(perRoot.ignorePatterns)) out.push(...perRoot.ignorePatterns);
          return out;
        }

        // 走査1回で数万件を照合するので、コンパイル結果は使い回す。
        // ただし**パターンそのものを鍵にする** —— 設定を読み直したときに古い規則が残らない。
        const ignoreCache = new Map();
        function compiledIgnoreFor(conn, root) {
          const patterns = ignorePatternsFor(conn, root);
          const key = patterns.join('\n');
          const id = `${(conn && conn.name) || ''}/${root}`;
          const hit = ignoreCache.get(id);
          if (hit && hit.key === key) return hit.compiled;
          const compiled = compileIgnorePatterns(patterns);
          ignoreCache.set(id, { key, compiled });
          return compiled;
        }

        // ---------- 補助 ----------
        const api = (conn, path) => `${conn.serverUrl}${path}`;

        async function getJson(url, opts) {
          const res = await fetch(url, opts);
          if (!res.ok) {
            const text = await res.text().catch(() => '');
            const err = new Error(`HTTP ${res.status} ${text.slice(0, 200)}`);
            err.status = res.status;
            throw err;
          }
          return res.json();
        }

        function parentPath(full) {
          const i = full.lastIndexOf('/');
          return i > 0 ? full.substring(0, i) : '';
        }

        async function ensureDirRecursive(dir, knownDirs) {
          if (!dir) return;
          let cur = '';
          for (const seg of dir.split('/').filter(Boolean)) {
            cur = cur ? `${cur}/${seg}` : seg;
            if (knownDirs && knownDirs.has(cur)) continue;
            try {
              await MetaOS.fs.mkdir(cur);
            } catch (e) {}
            if (knownDirs) knownDirs.add(cur);
          }
        }

        const anchorPath = (conn, root) => `${ANCHOR_DIR}/${conn.name}__${root}.json`;
        const legacyAnchorPath = (conn, root) => `${LEGACY_ANCHOR_DIR}/${conn.name}__${root}.json`;

        /**
         * アンカーを読む。返すのは { identity, entries, fresh }。
         * identity は「前回このマウントが向き合っていた相手」で、machineId と実パスを持つ。
         * 旧形式（rel -> info の平坦な地図）は identity を持たないため null を返す。
         * その場合は初回の照合を素通しし、以後は今回の相手を記録する（trust on first use）。
         */
        async function loadAnchor(conn, root) {
          for (const p of [anchorPath(conn, root), legacyAnchorPath(conn, root)]) {
            let raw;
            try {
              raw = await MetaOS.fs.read(p);
            } catch (e) {
              continue;
            }
            try {
              const obj = JSON.parse(raw);
              if (obj && obj.v === ANCHOR_VERSION) {
                return { identity: obj.identity || null, entries: obj.entries || {}, fresh: false };
              }
              return { identity: null, entries: obj || {}, fresh: false };
            } catch (e) {
              // 壊れたアンカーを空として扱うと、全ファイルが「ローカルに新規」に見える。
              // 空にするのではなく、調停を止められるよう壊れていることを伝える。
              log(`アンカーが壊れています (${p}): ${e.message}`);
              return { identity: null, entries: null, fresh: false, broken: true };
            }
          }
          return { identity: null, entries: {}, fresh: true };
        }

        async function saveAnchor(conn, root, rootPath, entries) {
          const body = {
            v: ANCHOR_VERSION,
            identity: {
              machineId: conn.identity?.machineId || null,
              hostname: conn.identity?.hostname || null,
              path: rootPath || null,
            },
            entries,
          };
          await MetaOS.fs.write(anchorPath(conn, root), JSON.stringify(body), { overwrite: true, silent: true });
        }

        /**
         * 「前回の相手」と「今の相手」が同じかを見る。
         * 違っていたら調停してはならない。同名ルートを別ディレクトリに向け直した場合、
         * 残骸が新しいディレクトリへ送信される（分岐4）ためである。
         * 判定材料が無いとき（旧サーバーは machineId を名乗らない）は、
         * 分かる範囲だけで比べる。パスは v3.0 のサーバーでも取れる。
         */
        function identityMismatch(prev, conn, rootPath) {
          if (!prev) return null;
          const now = conn.identity || {};
          if (prev.machineId && now.machineId && prev.machineId !== now.machineId) {
            return `別の機械です（前回 ${prev.hostname || prev.machineId} / 今回 ${now.hostname || now.machineId}）`;
          }
          if (prev.path && rootPath && prev.path !== rootPath) {
            return `ルートの実パスが変わりました（前回 ${prev.path} / 今回 ${rootPath}）`;
          }
          return null;
        }

        /**
         * 調停を止める。止めた事実が見えないと「同期されている」と思い込まれる。
         * 1マウントにつき1度だけ通知する（毎周期鳴らすと無視されるようになる）。
         */
        function halt(mount, reason) {
          if (mount.halted) return;
          mount.halted = reason;
          clearTimeout(mount.timer);
          const msg =
            `[Local Bridge] /${mount.mountPath} の同期を停止しました。\n${reason}\n` +
            `意図した組み合わせであれば、アンカー ${anchorPath(mount.conn, mount.root)} を削除すると再開します。`;
          log(msg);
          try {
            MetaOS.host.notify(msg, 'Local Bridge');
          } catch (e) {}
          try {
            MetaOS.ai.log(msg, 'warning', { trigger_llm: true });
          } catch (e) {}
        }

        // ---------- 衝突（両側が動いた） ----------

        // 1ファイルにつき1度だけ知らせる。毎周期（約20秒ごと）鳴らすと無視されるようになる。
        // 解消したら忘れる（分岐7・8の成功時に削除）。
        const conflictNotified = new Set();

        /**
         * 両側がアンカーから動いたか。
         *
         * ★ 分岐5（ローカルだけ）・6（リモートだけ）・7（一致）のいずれでもないことを、
         *   条件として明示する。ここを「その他」で受けると、
         *   将来また別の場合分けが漏れたときに黙って飲み込んでしまう。
         *
         * 内容が同じなら衝突ではない。両側が別々に同じ結果へ辿り着いた場合で、
         * これは分岐7が吸収する（実際、止まった項目はこれで復旧させた）。
         */
        function isConflict(l, r, a, same) {
          if (!l || !r) return false;
          if (same(l, r)) return false;
          return !same(l, a) && !same(r, a);
        }

        /**
         * 衝突の解消。方針は「どちらも消さない」（2026-08-18 山内さん判断）。
         *
         *   1. VFS 側の内容を <名前>.conflict-<時刻> としてホストへ退避する
         *   2. 退避ファイルの節点を VFS 側にも作る（★下記）
         *   3. 元のパスはホスト側を正として揃える（git やツールはホスト側で動くため）
         *   4. 必ず知らせる
         *
         * ★ 退避に失敗したら**何もしない**。上書きすれば消える側ができてしまう。
         *   その場合この項目は止まったままだが、止まっていることは通知する。
         *   黙って止まるのが元の欠陥であり、そこへ戻してはならない。
         *
         * ★★ アンカーに載せるなら、VFS 側にも節点を作る。★★（T-0069 / 2026-08-22）
         *   退避ファイルを next（＝次のアンカー）にだけ書いて VFS に節点を作らずにいると、
         *   次の巡回で「アンカーにある・リモートにある・VFS に無い」となり、
         *   isLocallyDeleted() が「利用者が VFS 側で消した」と読んで**ホストの退避を消す**。
         *   実測（0.1 秒刻みで観測）: 退避は作られた **1.97 秒後**にデーモン自身の DELETE で消えていた。
         *   それでいて通知は「どちらも失われていません」と言っていた。
         *   番人が「守った」と報告して実際には守っていないのは、番人が無いことより悪い。
         *
         * @returns {Promise<boolean>} 解消できたか（false なら保留＝どちらも触っていない）
         */
        async function resolveConflict(mount, rel, full, r, next) {
          const { conn, root, mountPath } = mount;
          const key = `${mountPath}/${rel}`;
          const notifyOnce = (msg) => {
            log(msg);
            if (conflictNotified.has(key)) return;
            conflictNotified.add(key);
            try {
              MetaOS.host.notify(msg, 'Local Bridge');
            } catch (e) {}
            try {
              MetaOS.ai.log(msg, 'warning');
            } catch (e) {}
          };

          const stamp = new Date().toISOString().replace(/[:.]/g, '-');
          const backupRel = `${rel}.conflict-${stamp}`;
          const backupFull = `${mountPath}/${backupRel}`;

          let saved = null;
          try {
            const u8 = await MetaOS.fs.read(full, { encoding: 'binary' });
            saved = await getJson(api(conn, `/api/${root}/file/${backupRel}`), { method: 'PUT', body: u8 });
          } catch (e) {
            notifyOnce(
              `[Local Bridge] /${mountPath}/${rel} は両側が変更されています。` +
                `VFS 側の退避に失敗したため、このファイルの同期を保留しました（内容はどちらも保持しています）。\n` +
                `理由: ${e.message}`,
            );
            return false;
          }

          await MetaOS.fs.createStub(full, { size: r.size, updatedAt: r.updatedAt, hash: r.hash });
          next[rel] = { kind: 'file', size: r.size, updatedAt: r.updatedAt, hash: r.hash };

          // 退避ファイルは「ホストに置いた」だけでは守れない。VFS 側にも節点を作って初めて、
          // 次の巡回で「利用者が消した」と読まれなくなる（上の ★★ を参照）。
          // 節点を作れなかったときは**アンカーにも載せない**。載せない側に倒しておけば、
          // 次の巡回で分岐3（リモートに新規）が拾って、正しくスタブを作り直す。
          let backupTracked = false;
          if (saved) {
            try {
              await MetaOS.fs.createStub(backupFull, {
                size: saved.size,
                updatedAt: saved.updatedAt,
                hash: saved.hash,
              });
              backupTracked = true;
            } catch (e) {
              log(`退避 ${backupRel} の節点を VFS に作れませんでした（次の巡回で拾い直します）: ${e.message}`);
            }
          }
          if (backupTracked) {
            next[backupRel] = { kind: 'file', size: saved.size, updatedAt: saved.updatedAt, hash: saved.hash };
          }
          conflictNotified.delete(key);

          // 言えるのは「サーバーが受領を返した」ところまで。確かめていないことを書かない。
          notifyOnce(
            `[Local Bridge] /${mountPath}/${rel} は両側が変更されていました。\n` +
              `ホスト側を採用し、VFS 側の内容はホストへ ${backupRel} として退避しました` +
              `（サーバーの受領: ${saved ? saved.size : '?'} バイト）。`,
          );
          return true;
        }

        /**
         * 「利用者が VFS 側で消した」と読んでよいか。── 分岐2
         *
         * ★ ここはホストの実体を消す唯一の推論である。**不在**（VFS に節点が無い）から
         *   **出来事**（利用者が消した）を導いているので、前提が崩れると人のファイルが消える。
         *   前提は「アンカーに載っている項目には、必ず VFS 側の節点がある」こと。
         *   2026-08-22（T-0069）、衝突の退避を next にだけ載せて節点を作らなかったため、
         *   この推論が退避ファイルを「消された」と読み、**デーモンが自分の退避を消していた**。
         *   したがってアンカーへ項目を足す側は、必ず VFS 側にも節点を作ること。
         */
        function isLocallyDeleted(l, r, a, same) {
          return !l && !!r && !!a && same(r, a);
        }

        /**
         * リモート一覧から消えた項目（墓石なし）をどう扱うか。── T-0027
         *
         * 「一覧に無い」＝「削除された」ではない。サーバーは読めなかったファイルを
         * 一覧に載せない（itera_bridge_server.py の走査）。欠落と削除は区別できないので、
         * **VFS 側に未送信の変更が無いときだけ**消してよい。
         *
         *   'delete'    … VFS 側は前回の同期から動いていない。消してよい。
         *                 判断を誤っても実体はサーバーにあり、次の走査で戻る。
         *   'revive'    … VFS 側に未送信の変更がある。消さずにホストへ復活させる。
         *   'directory' … ループ内では消さない。最後に深い方から、空のものだけ消す。
         *   'none'      … この分岐の対象ではない。
         */
        function classifyVanished(l, a, same) {
          if (!l || !a) return 'none';
          if (l.kind === 'directory' || a.kind === 'directory') return 'directory';
          return same(l, a) ? 'delete' : 'revive';
        }

        /**
         * リモート一覧が信用できないほど不自然か。
         * 走査に失敗したサーバーは「空」に見える。空を鵜呑みにすると全消しになる。
         */
        function isDegenerateListing(remoteCount, anchorCount) {
          return remoteCount === 0 && anchorCount > 0;
        }

        // 「消えたのに片付けられない」ものを一度だけ知らせる。黙って残すのが元の欠陥（T-0027）。
        const vanishNotified = new Set();
        function notifyVanishOnce(key, msg) {
          log(msg);
          if (vanishNotified.has(key)) return;
          vanishNotified.add(key);
          try {
            MetaOS.host.notify(msg, 'Local Bridge');
          } catch (e) {}
          try {
            MetaOS.ai.log(msg, 'warning');
          } catch (e) {}
        }

        // ---------- 調停（3-way マージ） ----------
        async function reconcile(mount) {
          const { conn, root, mountPath } = mount;
          let remote;
          try {
            remote = await getJson(api(conn, `/api/${root}/meta`));
          } catch (e) {
            log(`meta 取得に失敗 (${conn.name}/${root}): ${e.message}`);
            return;
          }

          const local = await MetaOS.fs.getSyncState(mountPath);
          const loaded = await loadAnchor(conn, root);

          if (loaded.broken) {
            return halt(mount, 'アンカーが壊れているため調停を中止しました。');
          }
          const mismatch = identityMismatch(loaded.identity, conn, mount.rootPath);
          if (mismatch) {
            return halt(mount, `同一性が食い違うため調停を中止しました。${mismatch}`);
          }

          const anchor = loaded.entries;
          const next = { ...anchor };
          const compiledIgnore = compiledIgnoreFor(conn, root);

          // ★ 走査に失敗したサーバーは「空」に見える。空を鵜呑みにすると全消しになる。
          //   一覧の欠落と削除は区別できないので、疑わしいときは何も消さずに止める。
          const anchorCount = Object.keys(anchor).length;
          if (isDegenerateListing(Object.keys(remote).length, anchorCount)) {
            return halt(
              mount,
              `リモート一覧が空です（アンカーには ${anchorCount} 件）。` +
                `走査の失敗と区別できないため、何も消さずに停止しました。`,
            );
          }

          // 消えたディレクトリはループ内では消さない（理由はループ後の掃除を参照）。
          const vanishedDirs = [];

          const knownDirs = new Set([mountPath]);
          for (const [p, info] of Object.entries(local)) {
            if (info && info.kind === 'directory') knownDirs.add(p);
          }

          const rels = new Set([
            ...Object.keys(remote),
            ...Object.keys(local).map((p) => p.substring(mountPath.length + 1)),
            ...Object.keys(anchor),
          ]);

          const sorted = Array.from(rels).sort((a, b) => {
            const da = a.split('/').length,
              db = b.split('/').length;
            return da !== db ? da - db : a < b ? -1 : a > b ? 1 : 0;
          });

          let n = 0;
          for (const rel of sorted) {
            if (!rel) continue;
            if (isIgnoredCompiled(rel, compiledIgnore)) continue;
            if (++n % 50 === 0) await new Promise((r) => setTimeout(r, 0));

            try {
              const full = `${mountPath}/${rel}`;
              const r = remote[rel];
              const l = local[full];
              const a = anchor[rel];
              const same = (x, y) => (x?.hash || null) === (y?.hash || null);

              if (!l && !r) {
                delete next[rel];
                continue;
              }

              // 1. リモートで削除済み（墓石）
              if (r && r.isDeleted) {
                if (l) {
                  try {
                    await MetaOS.fs.delete(full, { permanent: true });
                  } catch (e) {}
                }
                delete next[rel];
                continue;
              }

              // 2. ローカルで削除された → リモートへ反映
              if (isLocallyDeleted(l, r, a, same)) {
                const res = await fetch(api(conn, `/api/${root}/file/${rel}`), {
                  method: 'DELETE',
                  headers: a.hash ? { 'X-Expected-Hash': a.hash } : {},
                });
                if (res.ok) delete next[rel];
                continue;
              }

              // 2b. リモートから消えた（墓石が無い）── T-0027
              //
              // 墓石（isDeleted）はサーバーの DELETE API を通したときだけ作られる。
              // シェルの `mv` や `rm` は API を通らないので墓石が残らず、次の走査で
              // リモート一覧から黙って消えるだけになる。その結果この項目は
              // 「リモートに無い（!r）・VFS にある（l）・アンカーにある（a）」となる。
              //
              // ★ ここが無かった。分岐1〜8のどれにも当たらず素通りし、next は { ...anchor } で
              //   作られるため古いアンカーが生き残り、VFS の項目も消えない。次の巡回でも同じ
              //   判定になるので、移動元が**永久に**残る（実際に約180MBの幽霊が溜まっていた）。
              //   T-0013 と同じ「漏れた組み合わせが黙って素通りする」型の欠陥。
              //
              // ただし「一覧に無い」＝「削除された」と即断してはならない。サーバーは
              // **読めなかったファイルを一覧に載せない**（itera_bridge_server.py の走査。
              // 「黙って消さないため記録もしない」）。欠落と削除は区別できない。
              // そこで、消してよいのは「VFS 側に未送信の変更が無い」ときだけに限る。
              if (l && !r && a) {
                const verdict = classifyVanished(l, a, same);

                if (verdict === 'directory') {
                  vanishedDirs.push({ rel, full });
                  continue;
                }

                if (verdict === 'delete') {
                  // VFS 側は前回の同期から動いていない。実体はサーバーにあり、
                  // 仮に判断を誤っても次の走査でスタブとして戻るので、消してよい。
                  try {
                    await MetaOS.fs.delete(full, { permanent: true });
                    delete next[rel];
                    vanishNotified.delete(full);
                  } catch (e) {
                    // ★ 消せなかったときにアンカーから外すと、次の巡回で分岐4（ローカル新規）へ
                    //   流れ、実体の無いファイルを読もうとして延々と失敗する。アンカーは残して再試行する。
                    notifyVanishOnce(
                      full,
                      `[Local Bridge] /${full} はホスト側に存在しませんが、VFS から削除できませんでした。\n` +
                        `理由: ${e.message}`,
                    );
                  }
                } else {
                  // VFS 側に未送信の変更がある。ホスト側が消えたからといって、
                  // まだ送っていない変更を消してはならない。
                  // アンカーから外すと次の巡回で分岐4に流れ、サーバーへ復活する。
                  delete next[rel];
                  notifyVanishOnce(
                    full,
                    `[Local Bridge] /${full} はホスト側から消えていますが、VFS 側に未送信の変更があります。\n` +
                      `消さずにホストへ復活させます。不要であれば VFS 側で削除してください。`,
                  );
                }
                continue;
              }

              // 3. リモートに新規 → スタブを作る
              if (r && !l && !a) {
                if (r.kind === 'directory') {
                  await ensureDirRecursive(full, knownDirs);
                  next[rel] = { kind: 'directory', size: 0, updatedAt: r.updatedAt, hash: null };
                } else {
                  await ensureDirRecursive(parentPath(full), knownDirs);
                  await MetaOS.fs.createStub(full, { size: r.size, updatedAt: r.updatedAt, hash: r.hash });
                  next[rel] = { kind: 'file', size: r.size, updatedAt: r.updatedAt, hash: r.hash };
                }
                continue;
              }

              // 4. ローカルに新規 → リモートへ送る
              if (l && !r && !a) {
                if (l.kind === 'directory') continue;
                const u8 = await MetaOS.fs.read(full, { encoding: 'binary' });
                const data = await getJson(api(conn, `/api/${root}/file/${rel}`), { method: 'PUT', body: u8 });
                next[rel] = { kind: 'file', size: data.size, updatedAt: data.updatedAt, hash: data.hash };
                continue;
              }

              // 5. ローカルだけ変わった → 送る
              if (l && r && !same(l, a) && same(r, a)) {
                if (l.kind === 'directory') continue;
                const u8 = await MetaOS.fs.read(full, { encoding: 'binary' });
                const data = await getJson(api(conn, `/api/${root}/file/${rel}`), {
                  method: 'PUT',
                  headers: a?.hash ? { 'X-Expected-Hash': a.hash } : {},
                  body: u8,
                });
                next[rel] = { kind: 'file', size: data.size, updatedAt: data.updatedAt, hash: data.hash };
                continue;
              }

              // 6. リモートだけ変わった → スタブへ差し替える
              if (l && r && same(l, a) && !same(r, a)) {
                if (r.kind === 'directory') {
                  await ensureDirRecursive(full, knownDirs);
                } else {
                  await ensureDirRecursive(parentPath(full), knownDirs);
                  await MetaOS.fs.createStub(full, { size: r.size, updatedAt: r.updatedAt, hash: r.hash });
                }
                next[rel] = { kind: r.kind, size: r.size, updatedAt: r.updatedAt, hash: r.hash };
                continue;
              }

              // 7. 一致している
              if (l && r && same(l, r)) {
                next[rel] = { kind: l.kind, size: r.size, updatedAt: r.updatedAt, hash: r.hash };
                conflictNotified.delete(`${mountPath}/${rel}`);
                continue;
              }

              // 8. 両方が動いた（衝突）
              //
              // ★ ここが無かった（T-0013）。分岐1〜7のどれにも該当しないまま素通りし、
              //   next は { ...anchor } で作られるため**古いアンカーがそのまま残る**。
              //   次の巡回でも同じ判定になり、この項目は**永久に、無言で**同期されなくなる。
              //   アンカーを消しても直らない（分岐5・6・7がいずれも成立しないため）。
              //   実際に、私の edit_file とデーモンの書き込みが同一ミリ秒で衝突して発生した。
              if (isConflict(l, r, a, same)) {
                if (l.kind === 'directory' || r.kind === 'directory') continue;
                await resolveConflict(mount, rel, full, r, next);
                continue;
              }
            } catch (e) {
              log(`項目の調停に失敗 ${conn.name}/${root}/${rel}: ${e.message}`);
            }
          }

          // 消えたディレクトリの掃除。
          //
          // ループ内で消さないのは、親を再帰削除すると「未送信の変更があるので残した子」を
          // 巻き添えにするため。深い方から順に、**空になったものだけ**を消す。
          // 空でないものはアンカーを残す（次の巡回で再試行され、子が片付けば消える）。
          vanishedDirs.sort((x, y) => y.rel.split('/').length - x.rel.split('/').length);
          for (const d of vanishedDirs) {
            try {
              const remain = await MetaOS.fs.list(d.full);
              if (remain && remain.length > 0) continue;
              await MetaOS.fs.delete(d.full, { permanent: true });
              delete next[d.rel];
              vanishNotified.delete(d.full);
            } catch (e) {
              log(`ディレクトリの掃除に失敗 ${d.full}: ${e.message}`);
            }
          }

          await saveAnchor(conn, root, mount.rootPath, next);
        }

        function scheduleSync(mount, delayMs) {
          if (mount.halted) return;
          const delay = typeof delayMs === 'number' ? delayMs : SYNC_DEBOUNCE_MS;
          clearTimeout(mount.timer);
          mount.timer = setTimeout(async () => {
            if (mount.halted) return;
            if (mount.syncing) return scheduleSync(mount, delay);
            mount.syncing = true;
            try {
              await reconcile(mount);
            } catch (e) {
              log(`調停エラー: ${e.message}`);
            } finally {
              mount.syncing = false;
            }
          }, delay);
        }

        /**
         * 調停と掃除を同時に走らせない。
         * 進行中の調停は `{ ...anchor }` から作った `next` を最後に書き戻すので、
         * その途中で掃除がアンカーを書き換えると**掃除の結果が黙って打ち消される**。
         * 新しい錠前は作らず、既存の直列化（mount.syncing）に相乗りする。
         */
        async function withSyncPaused(mount, fn) {
          const deadline = Date.now() + 60000;
          while (mount.syncing) {
            if (Date.now() > deadline) throw new Error('調停が終わらないため中止しました。');
            await new Promise((r) => setTimeout(r, 200));
          }
          clearTimeout(mount.timer);
          mount.syncing = true;
          try {
            return await fn();
          } finally {
            mount.syncing = false;
            scheduleSync(mount, SYNC_DEBOUNCE_MS);
          }
        }

        /**
         * 無視対象になった「既存の」項目を索引から落とす（T-0059）。
         *
         * 無視は走査の入口で `continue` するだけなので、**あとから足したパターンは
         * 既に作られたスタブに効かない**。索引を軽くするにはこの掃除が要る。
         *
         * 安全の規則は増やさない。調停の分岐2b と同じ考えに揃え、さらに狭める:
         *   **消すのはスタブだけ。** 実体化済みのファイルは、ホストと同じ内容でも触らない
         *   （捨てたいなら `local_release` がある。あちらは一致を1件ずつ確かめる）。
         *
         * ホスト側は一切変更しない。消えるのは VFS のノードとアンカーの項目だけで、
         * パターンを外せば次の走査でスタブとして戻る。
         */
        async function ignoreCleanup(mount, opts) {
          const { conn, root, mountPath } = mount;
          const dryRun = !!(opts && opts.dryRun);
          const onProgress = (opts && opts.onProgress) || (() => {});

          const compiled = compiledIgnoreFor(conn, root);
          const empty = {
            total: 0,
            removed: 0,
            stubs: 0,
            dirs: 0,
            anchorOnly: 0,
            keptTotal: 0,
            kept: [],
            failed: [],
            dryRun,
          };
          if (!compiled.length) return empty;

          const state = await MetaOS.fs.getSyncState(mountPath);
          const prefix = `${mountPath}/`;

          const stubs = [];
          const dirs = [];
          const kept = [];
          for (const [full, info] of Object.entries(state)) {
            if (!full.startsWith(prefix)) continue;
            const rel = full.substring(prefix.length);
            if (!rel || !isIgnoredCompiled(rel, compiled)) continue;
            if (info && info.kind === 'directory') dirs.push({ rel, full });
            else if (isStub(info)) stubs.push({ rel, full });
            else kept.push(rel);
          }

          // 深い方から消す。親を先に消すと、実体化済みの子を巻き込む。
          const deepFirst = (a, b) => b.rel.split('/').length - a.rel.split('/').length || (a.rel < b.rel ? 1 : -1);
          stubs.sort(deepFirst);
          dirs.sort(deepFirst);

          const loaded = await loadAnchor(conn, root);
          if (loaded.broken) throw new Error('アンカーが壊れているため掃除を中止しました。');
          const entries = { ...loaded.entries };

          // 無視に当たるのに VFS に居ない項目（アンカーにだけ残っている残骸）を数える。
          const anchorOnlyRels = Object.keys(entries).filter(
            (rel) => isIgnoredCompiled(rel, compiled) && !state[`${prefix}${rel}`],
          );

          const total = stubs.length + dirs.length + anchorOnlyRels.length;
          if (dryRun) {
            return {
              total,
              removed: 0,
              stubs: stubs.length,
              dirs: dirs.length,
              anchorOnly: anchorOnlyRels.length,
              keptTotal: kept.length,
              kept: kept.slice(0, 50),
              failed: [],
              dryRun: true,
            };
          }

          const failed = [];
          const survivors = kept.slice();
          let removed = 0;
          let n = 0;

          for (const item of stubs) {
            try {
              await MetaOS.fs.delete(item.full, { permanent: true });
              delete entries[item.rel];
              removed++;
            } catch (e) {
              failed.push(`${item.rel}: ${e.message}`);
              survivors.push(item.rel);
            }
            if (++n % 50 === 0) {
              onProgress({ done: n, total });
              await new Promise((r) => setTimeout(r, 0));
            }
          }

          // ディレクトリは、残った項目が下に無いときだけ消す。
          // （深い順なので、子が残ったことは親から見える）
          for (const d of dirs) {
            if (survivors.some((s) => s === d.rel || s.startsWith(`${d.rel}/`))) {
              survivors.push(d.rel);
              continue;
            }
            try {
              await MetaOS.fs.delete(d.full, { permanent: true });
              delete entries[d.rel];
              removed++;
            } catch (e) {
              failed.push(`${d.rel}: ${e.message}`);
              survivors.push(d.rel);
            }
            if (++n % 50 === 0) {
              onProgress({ done: n, total });
              await new Promise((r) => setTimeout(r, 0));
            }
          }

          for (const rel of anchorOnlyRels) {
            delete entries[rel];
            removed++;
          }

          await saveAnchor(conn, root, mount.rootPath, entries);
          onProgress({ done: total, total });

          return {
            total,
            removed,
            stubs: stubs.length,
            dirs: dirs.length,
            anchorOnly: anchorOnlyRels.length,
            keptTotal: kept.length,
            kept: kept.slice(0, 50),
            failed: failed.slice(0, 50),
            dryRun: false,
          };
        }

        // ---------- マウント管理 ----------
        async function mountRoot(conn, rootInfo) {
          const root = rootInfo.name;
          const mountPath = `${MOUNT_BASE}/${conn.name}/${root}`;
          const known = mounts.get(mountPath);
          if (known) {
            // 実パスが動いていたら覚え直す。次の調停で同一性照合に引っかかる。
            if (rootInfo.path) known.rootPath = rootInfo.path;
            return;
          }
          await ensureDirRecursive(mountPath, null);
          const mount = {
            conn,
            root,
            rootPath: rootInfo.path || null,
            mountPath,
            syncing: false,
            halted: null,
            timer: null,
          };

          await MetaOS.fs.registerSyncProvider(mountPath, {
            onFetchContent: async (reqPath) => {
              const rel = reqPath.substring(mountPath.length + 1);
              try {
                const res = await fetch(api(conn, `/api/${root}/file/${rel}`));
                if (!res.ok) return false;
                const buf = await res.arrayBuffer();
                await MetaOS.fs.write(reqPath, new Uint8Array(buf), { overwrite: true, silent: true });
                return true;
              } catch (e) {
                log(`実体取得に失敗 ${rel}: ${e.message}`);
                return false;
              }
            },
            onMutate: async () => {
              // 直後にホスト由来の同期が来ても、書き込みの最中に踏み込まないための目印。
              mount.lastMutateAt = Date.now();
              scheduleSync(mount);
            },
          });

          mounts.set(mountPath, mount);
          log(`マウント: /${mountPath}`);
          scheduleSync(mount);
        }

        /**
         * マウントを外す。cleanup は「サーバーは応答しているのにルートが消えた」＝
         * 意図的な detach のときだけ true にする。接続断では呼んではならない。
         */
        async function unmountRoot(mountPath, opts) {
          const mount = mounts.get(mountPath);
          if (!mount) return;
          const cleanup = !!(opts && opts.cleanup);
          clearTimeout(mount.timer);

          // 後始末の前に状態を読む。読めたかどうかで「消してよいか」が決まる。
          let state = null;
          if (cleanup) {
            try {
              state = await MetaOS.fs.getSyncState(mountPath);
            } catch (e) {
              log(`[detach] ${mountPath}: 状態を読めませんでした（${e.message}）`);
            }
          }

          // 順序が命。provider を残したまま削除すると、削除がホストへ伝播し、
          // スタブは実体化されてから消える（＝ホストの実ファイルを道連れにする）。
          try {
            await MetaOS.fs.unregisterSyncProvider(mountPath);
          } catch (e) {}
          mounts.delete(mountPath);
          log(`アンマウント: /${mountPath}`);

          if (cleanup) await cleanupDetached(mount, state);
        }

        /**
         * detach された残骸の処分。
         * 残骸を放置すると、同名ルートを別ディレクトリへ attach したときに
         * 「ローカルに新規」と誤解され、古い残骸が新しいディレクトリへ送信される。
         * ただし、VFS にしか無いバイト列を持つ実体が1件でもあるなら消さない。退避して名前だけ空ける。
         */
        async function cleanupDetached(mount, state) {
          const { mountPath, conn, root } = mount;
          if (!state) {
            log(`[detach] ${mountPath} は状態不明のため残置しました。`);
            return;
          }
          const files = Object.entries(state).filter(([, i]) => i && i.kind !== 'directory');
          const materialized = files.filter(([, i]) => !isStub(i));
          try {
            if (!materialized.length) {
              // すべてスタブ。VFS 側にしか無い中身は1件も無いので、消しても何も失われない。
              await MetaOS.fs.delete(mountPath, { permanent: true });
              log(`[detach] ${mountPath} を削除しました（スタブ ${files.length} 件）。`);
            } else {
              const stamp = new Date().toLocaleDateString('sv-SE').replace(/-/g, '');
              let dest = `${mountPath}.detached-${stamp}`;
              for (let i = 2; await MetaOS.fs.exists(dest); i++) dest = `${mountPath}.detached-${stamp}-${i}`;
              await MetaOS.fs.rename(mountPath, dest);

              // 退避先に残ったスタブは取得経路を失った「死んだスタブ」で、
              // ファイルに見えるのに永久に開けない。紛らわしいので捨てる。
              // provider は解除済みなので、この削除はホストへ伝播しない。
              let ghosts = 0;
              for (const [full, info] of files) {
                if (!isStub(info)) continue;
                const moved = `${dest}/${full.substring(mountPath.length + 1)}`;
                try {
                  await MetaOS.fs.delete(moved, { permanent: true });
                  ghosts++;
                } catch (e) {}
              }

              const msg =
                `[Local Bridge] ${mountPath} が取り外されました。実体 ${materialized.length} 件が VFS 側にあるため、` +
                `削除せず /${dest} へ退避しました（開けなくなるスタブ ${ghosts} 件は除去）。`;
              log(msg);
              try {
                MetaOS.host.notify(msg, 'Local Bridge');
              } catch (e) {}
              try {
                MetaOS.ai.log(msg, 'warning');
              } catch (e) {}
            }
            try {
              await MetaOS.fs.delete(anchorPath(conn, root), { permanent: true });
            } catch (e) {}
          } catch (e) {
            log(`[detach] ${mountPath} の後始末に失敗: ${e.message}`);
          }
        }

        function warnOnce(conn, key, msg) {
          conn.warned = conn.warned || new Set();
          if (conn.warned.has(key)) return;
          conn.warned.add(key);
          log(msg);
          try {
            MetaOS.host.notify(msg, 'Local Bridge');
          } catch (e) {}
          try {
            MetaOS.ai.log('[Local Bridge] ' + msg, 'warning');
          } catch (e) {}
        }

        const dupWarned = new Set();

        /**
         * 同じ機械へ2本以上繋がっていないかを見る。
         * ssh -L を挟むと、直結もトンネルも 127.0.0.1:<port> に見えるため URL では気づけない。
         * 同じディレクトリを2つの provider が同期すると、互いの書き込みを削除と誤読して壊れる。
         */
        function checkDuplicateMachines() {
          const byId = new Map();
          for (const c of connections) {
            const id = c.identity && c.identity.machineId;
            if (!id) continue;
            byId.set(id, (byId.get(id) || []).concat([c]));
          }
          for (const [id, list] of byId) {
            if (list.length < 2 || dupWarned.has(id)) continue;
            dupWarned.add(id);
            const msg =
              `同じ機械に ${list.length} 本の接続が繋がっています（` +
              list.map((c) => `${c.name || '(名前未確定)'}=${c.serverUrl}`).join(' / ') +
              `）。同じディレクトリを二重にマウントしていると壊れます。`;
            log(msg);
            try {
              MetaOS.host.notify(msg, 'Local Bridge');
            } catch (e) {}
            try {
              MetaOS.ai.log('[Local Bridge] ' + msg, 'warning', { trigger_llm: true });
            } catch (e) {}
          }
        }

        /**
         * サーバーの名乗りを取り込み、接続名を確定させる。
         * 名前が決まらないうちはマウントしない（マウントパスに名前が入るため）。
         */
        async function applyIdentity(conn, status) {
          conn.identity = {
            hostname: status.hostname || null,
            user: status.user || null,
            platform: status.platform || null,
            machineId: status.machineId || null,
          };
          conn.serverVersion = status.version || null;

          const mid = conn.identity.machineId;
          if (mid) {
            if (conn.cfg.machineId && conn.cfg.machineId !== mid) {
              warnOnce(
                conn,
                'machine-changed',
                `${conn.serverUrl} の先が別の機械に変わりました（設定 ${conn.cfg.machineId} / 今回 ${mid}）。` +
                  `マウント名は ${conn.name} のままです。同期は同一性照合で止まります。`,
              );
            } else if (!conn.cfg.machineId) {
              conn.cfg.machineId = mid;
              await saveConfig();
            }
          }

          if (!conn.name) {
            if (!conn.identity.hostname) {
              warnOnce(
                conn,
                'no-name',
                `${conn.serverUrl} のサーバーはホスト名を名乗りません（v3.1 より前）。` +
                  `設定に name を書くか、サーバーを更新してください。マウントは保留します。`,
              );
              return false;
            }
            let name = sanitizeName(conn.identity.hostname);
            // 別の機械が同じホスト名を名乗ることはある。その場合だけ machineId で分ける。
            const clash = connections.find(
              (c) => c !== conn && c.name === name && (c.identity && c.identity.machineId) !== mid,
            );
            if (clash && mid) name = `${name}-${mid.slice(0, 6)}`;
            conn.name = name;
            conn.cfg.name = name;
            await saveConfig();
            log(`接続名を確定: ${name} (${conn.serverUrl})`);
          }

          checkDuplicateMachines();
          return true;
        }

        // サーバー側のルート増減に追随する（itera attach / detach を反映）。
        // 接続できないときは何もしない。切断ではアンマウントも削除もしない。
        async function refreshConn(conn, opts) {
          const waitSec = (opts && opts.waitSec) || 0;
          // 待てるのは「前回受け取った版」を持っているときだけ。
          // 版が無い初回に待たせても、起動が遅れるだけで得るものが無い。
          const query = waitSec && conn.revToken ? `?wait=${waitSec}&since=${encodeURIComponent(conn.revToken)}` : '';
          let status;
          try {
            status = await getJson(api(conn, '/api/status' + query));
          } catch (e) {
            return null;
          }
          // 旧サーバー（v3.4 以前）は longPoll を名乗らない。名乗らない相手には待機を頼まない。
          conn.longPoll = status.longPoll === true;
          conn.revToken = typeof status.revToken === 'string' ? status.revToken : null;
          if (!(await applyIdentity(conn, status))) return status;

          const roots = status.roots || [];
          const wanted = new Set(roots.map((r) => `${MOUNT_BASE}/${conn.name}/${r.name}`));
          for (const r of roots) {
            await mountRoot(conn, r);
            const m = mounts.get(`${MOUNT_BASE}/${conn.name}/${r.name}`);
            if (!m) continue;
            // ホスト側の変更に気づく唯一の経路。rev は中身が変わったときだけ増える。
            // rev を返さない旧サーバー相手には、毎回調停して取りこぼしを防ぐ。
            const rev = r.rev === undefined ? Date.now() : r.rev;
            if (m.rev !== rev) {
              m.rev = rev;
              const busy = Date.now() - (m.lastMutateAt || 0) < SYNC_DEBOUNCE_MS;
              scheduleSync(m, busy ? SYNC_DEBOUNCE_MS : REMOTE_SYNC_DEBOUNCE_MS);
            }
          }
          for (const mountPath of Array.from(mounts.keys())) {
            const m = mounts.get(mountPath);
            // サーバーは応答している。それでもルートが無い＝意図的な detach。
            if (m.conn === conn && !wanted.has(mountPath)) await unmountRoot(mountPath, { cleanup: true });
          }
          return status;
        }

        // ホスト側の変更に気づく巡回。
        //   v3.5 以降 : /api/status が変化まで応答を保留する → 変わった瞬間に次の調停へ進む
        //   v3.4 以前 : wait を無視して即返すので、ROOT_POLL_MS の間隔で回す
        // 未接続のときも必ず回し続ける（サーバーを後から起動しても復帰できるようにする）。
        async function startPollLoop(conn) {
          for (;;) {
            const started = Date.now();
            let status = null;
            try {
              status = await refreshConn(conn, { waitSec: conn.longPoll ? LONG_POLL_SEC : 0 });
            } catch (e) {
              log(`巡回に失敗 (${connLabel(conn)}): ${e.message}`);
            }
            const spent = Date.now() - started;
            // 保留してもらえた場合だけ即座に次を投げる。それ以外は間隔をあける。
            const gap = status && conn.longPoll ? MIN_LOOP_MS - spent : ROOT_POLL_MS;
            if (gap > 0) await new Promise((r) => setTimeout(r, gap));
          }
        }

        // WebSocket による push は廃止した。サーバーは購読を貯めるだけで一度も送信しておらず、
        // さらに素の uvicorn には WebSocket ライブラリが無く upgrade 自体が失敗していた
        // （5秒ごとの再接続がホスト側のログを埋めていた）。
        // ホスト側の変更検知は /api/status の rev をポーリングして行う。

        // ---------- 接続の解決 ----------
        const connLabel = (c) => c.name || `(名前未確定: ${c.serverUrl})`;

        function resolveConn(name) {
          const ready = connections.filter((c) => c.name);
          if (name) {
            const c = connections.find((x) => x.name === name);
            if (!c)
              throw new Error(`接続 '${name}' はありません（${connections.map(connLabel).join(', ') || 'なし'}）`);
            return c;
          }
          if (ready.length === 1) return ready[0];
          if (!ready.length) {
            throw new Error(`接続がまだ確立していません（${connections.map(connLabel).join(', ') || '設定なし'}）`);
          }
          throw new Error(
            `接続が複数あります。connection 属性で指定してください（${ready.map((c) => c.name).join(', ')}）`,
          );
        }

        function resolveRoot(conn, root) {
          if (root) return root;
          const owned = Array.from(mounts.values()).filter((m) => m.conn === conn);
          if (owned.length === 1) return owned[0].root;
          throw new Error(
            `ルートが複数あります。root 属性で指定してください（${owned.map((m) => m.root).join(', ') || 'なし'}）`,
          );
        }

        // 同期を止めたマウントに対して VFS 側を触る操作を通さない。
        // 相手が変わっている疑いがある状態で実体化やスタブ化をすると、取り違えが確定する。
        function ensureLive(conn, root) {
          const m = mounts.get(`${MOUNT_BASE}/${conn.name}/${root}`);
          if (m && m.halted) throw new Error(`このマウントは同期を停止しています。${m.halted}`);
          return m;
        }

        // ---------- LPML ツール ----------
        const DEFS = {
          bash_exec: `<define_tag name="bash_exec">
Executes a shell command on a connected local machine (Itera Local Bridge).
Attributes:
  - connection (optional): Connection name. Omit if only one is configured.
  - root (optional): Root name. Omit if the connection has only one root.
  - cwd (optional): Directory relative to the root (default: root itself). NOT persisted between calls.
  - scope (optional): "root" (default) or "host". Use "host" to run outside the registered roots.
  - timeout (optional): Seconds (default 60, max 600).
Content:
  The shell command to execute.
Note: The effective working directory is always reported back in the result.
</define_tag>`,
          local_search: `<define_tag name="local_search">
Searches file contents on the host machine. Works even when the VFS side is still a stub.
Attributes:
  - query (required): Text or regex to search for.
  - connection (optional) / root (optional): Target selection.
  - regex (optional): "true" to treat query as a regular expression.
  - include (optional): Comma separated extensions (e.g. ".py,.md").
  - limit (optional): Max matches (default 40).
</define_tag>`,
          local_fetch: `<define_tag name="local_fetch">
Materializes stubs and re-checks already-materialized files against the host.
Attributes:
  - path (required): Path relative to the root. A directory covers everything under it.
  - connection (optional) / root (optional): Target selection.
  - limit (optional): Max files to process (default 200).
Behaviour:
  - stub                    => download from the host
  - materialized, same hash => reported as "一致" (nothing to do)
  - materialized, different => treated as a conflict: the VFS copy is saved on the
                               host as <name>.conflict-<time>, then the host copy wins
  - stash failed            => reported as "保留"; neither side is touched
  - missing on the host     => reported; nothing is deleted
Note: it never reports success without comparing hashes with the host.
</define_tag>`,
          local_release: `<define_tag name="local_release">
Turns materialized files back into stubs to free VFS space.
Only runs when the host copy is confirmed present with a matching hash; aborts if that cannot be determined.
Attributes:
  - path (required): Path relative to the root. A directory releases everything under it.
  - connection (optional) / root (optional): Target selection.
</define_tag>`,
        };

        function fmtExec(data) {
          return [
            `[exit ${data.exitCode}] ${data.durationMs}ms`,
            `[cwd] ${data.cwd}`,
            '--- STDOUT ---',
            data.stdout || '(empty)',
            '--- STDERR ---',
            data.stderr || '(empty)',
          ].join('\n');
        }

        MetaOS.tools.register({
          name: 'bash_exec',
          description: 'Executes a shell command on a connected local machine.',
          definition: DEFS.bash_exec,
          handler: async (p) => {
            try {
              const conn = resolveConn(p.connection);
              const scope = p.scope === 'host' ? 'host' : 'root';
              const root = scope === 'host' ? null : resolveRoot(conn, p.root);
              const command = (p.content || '').trim();
              if (!command) return 'コマンドが空です。';

              if ((conn.execMode || 'ask') === 'ask') {
                const res = await MetaOS.host.showMessageBox({
                  title: 'ローカル実行の確認',
                  message: `${conn.name}${root ? ' / ' + root : ' (host)'} でコマンドを実行します。`,
                  detail: `${command}\n\ncwd: ${p.cwd || (scope === 'host' ? 'ホームディレクトリ' : 'ルート直下')}`,
                  type: 'question',
                  buttons: [
                    { label: '実行しない', value: false, style: 'normal', isCancel: true },
                    { label: '実行する', value: true, style: 'primary', isDefault: true },
                  ],
                });
                if (!res || res.action !== true) return '[未実行] 山内さんが実行を許可しませんでした。';
              }

              const data = await getJson(api(conn, '/api/exec'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ root, cwd: p.cwd || '.', command, scope, timeout: parseInt(p.timeout) || 60 }),
              });
              return fmtExec(data);
            } catch (e) {
              return `[エラー] ${e.message}`;
            }
          },
        });

        MetaOS.tools.register({
          name: 'local_search',
          description: 'Searches file contents on the host machine (works on stubs).',
          definition: DEFS.local_search,
          handler: async (p) => {
            try {
              const conn = resolveConn(p.connection);
              const root = resolveRoot(conn, p.root);
              const data = await getJson(api(conn, `/api/${root}/search`), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  query: p.query,
                  regex: p.regex === 'true',
                  include: p.include || '',
                  limit: parseInt(p.limit) || 40,
                }),
              });
              if (!data.count) return `一致なし（${conn.name}/${root}, engine=${data.engine}）`;
              const lines = data.matches.map((m) => `${m.path}:${m.line}: ${m.text}`);
              return `${data.count} 件（${conn.name}/${root}, engine=${data.engine}）\n` + lines.join('\n');
            } catch (e) {
              return `[エラー] ${e.message}`;
            }
          },
        });

        // スタブか実体かの判定。
        // hash の有無では判定できない。createStub にホスト側のハッシュを渡しているため、
        // スタブでも hash は非 null になる（実測で確認済み）。
        // 実体化済みのエントリは syncState キー自体が消える。
        const isStub = (info) => !!info && info.syncState === 'stub';

        /**
         * local_fetch が1件をどう扱うかを決める。
         *
         * ★ 「実体があるか」と「ホストと一致しているか」を混同しないための関数である。
         *   以前の実装は前者だけを見て「既に実体」と成功を返しており、
         *   中身が食い違っていても何もしなかった（T-0013）。
         *
         *   'stub'     … まだ中身が無い。落としてくる
         *   'gone'     … ホストに無い。**消さない**。数えて報告するだけ
         *   'match'    … ホストと一致。することは無い
         *   'conflict' … 実体があり、かつ違う。調停と同じ方針で扱う（どちらも消さない）
         */
        function classifyFetchTarget(info, r) {
          if (isStub(info)) return 'stub';
          if (!r || r.isDeleted) return 'gone';
          if ((info?.hash || null) === (r.hash || null)) return 'match';
          return 'conflict';
        }

        MetaOS.tools.register({
          name: 'local_fetch',
          description: 'Materializes stubs from the host machine.',
          definition: DEFS.local_fetch,
          handler: async (p) => {
            try {
              const conn = resolveConn(p.connection);
              const root = resolveRoot(conn, p.root);
              ensureLive(conn, root);
              const mountPath = `${MOUNT_BASE}/${conn.name}/${root}`;
              const limit = parseInt(p.limit) || 200;
              const target = `${mountPath}/${p.path}`.replace(/\/+$/, '');
              const state = await MetaOS.fs.getSyncState(mountPath);
              const targets = Object.entries(state).filter(
                ([full, info]) => info.kind !== 'directory' && (full === target || full.startsWith(target + '/')),
              );
              if (!targets.length) return `対象がありません: ${p.path}`;

              // ★ ホスト側の meta を必ず引く。
              //   以前は「実体化済みなら何もしない」で成功を返していた。しかしそれは
              //   『VFS に実体があるか』の報告であって『ホストと一致しているか』の報告ではない。
              //   中身が食い違っていても「既に実体」と答えるため、修復に使えないばかりか
              //   「確認した」という誤った安心を与えていた（T-0013 で実際に踏んだ）。
              const remote = await getJson(api(conn, `/api/${root}/meta`));
              const mount = mounts.get(mountPath);

              let done = 0,
                matched = 0,
                resolved = 0,
                held = 0,
                gone = 0,
                failed = 0;

              for (const [full, info] of targets.slice(0, limit)) {
                const rel = full.substring(mountPath.length + 1);
                const r = remote[rel];
                try {
                  const kind = classifyFetchTarget(info, r);
                  if (kind === 'stub') {
                    await MetaOS.fs.read(full, { encoding: 'binary' }); // 読むと onFetchContent が走る
                    done++;
                    continue;
                  }
                  if (kind === 'gone') {
                    // ホストに無いものを消しはしない。数えて報告するだけにとどめる。
                    gone++;
                    continue;
                  }
                  if (kind === 'match') {
                    matched++;
                    continue;
                  }
                  // 'conflict' … 実体があり、ホストと違う。調停と同じ方針で扱う（どちらも消さない）。
                  // ここで素直に上書きすると、VFS 側にしか無い編集が黙って消える。
                  if (!mount) {
                    held++;
                    continue;
                  }
                  // next を捨てているのは、アンカーの更新を次の巡回に任せるため。
                  // 解消後は l と r が一致するので、分岐7が拾って正しい値を書く。
                  const ok = await resolveConflict(mount, rel, full, r, {});
                  if (ok) resolved++;
                  else held++;
                } catch (e) {
                  failed++;
                }
              }

              const parts = [
                `実体化: ${done} 件`,
                `一致: ${matched} 件`,
                `衝突を解消: ${resolved} 件`,
                `保留: ${held} 件`,
                `ホストに無し: ${gone} 件`,
                `失敗: ${failed} 件`,
              ];
              return `${parts.join(' / ')}（対象 ${targets.length} 件、上限 ${limit}）`;
            } catch (e) {
              return `[エラー] ${e.message}`;
            }
          },
        });

        // ---------- 検証付きスタブ化（ここだけが createStub を呼ぶ） ----------
        //
        // ツール（local_release）も設定アプリからの依頼も、必ずこの関数を通す。
        // 「捨てる前にホストと照合する」という判定を 2 か所に書くと、
        // 片方だけ直って乖離する。安全に関わる判定は 1 つに保つ。
        //
        // 分割するのは、ルート全体（数千件）を 1 回の verify に載せると
        // ホストが全件のハッシュを計算し終えるまで何も返らず、進捗も出せないため。
        const VERIFY_CHUNK = 200;

        async function releaseVerified(conn, root, relPath, onProgress) {
          ensureLive(conn, root);
          const mountPath = `${MOUNT_BASE}/${conn.name}/${root}`;
          const target = `${mountPath}/${relPath || ''}`.replace(/\/+$/, '');
          const state = await MetaOS.fs.getSyncState(mountPath);
          const targets = Object.entries(state).filter(
            ([full, info]) =>
              info.kind !== 'directory' && !isStub(info) && (full === target || full.startsWith(target + '/')),
          );

          const result = { total: targets.length, released: 0, bytes: 0, skipped: [] };
          if (!targets.length) return result;

          for (let i = 0; i < targets.length; i += VERIFY_CHUNK) {
            const chunk = targets.slice(i, i + VERIFY_CHUNK);
            const rels = chunk.map(([full]) => full.substring(mountPath.length + 1));

            // ここで失敗したら「判定不能」。バイト列を捨てる前に必ず中断する。
            // 途中まで進んでいることがあるので、その分を持たせて投げる（無かったことにしない）。
            let verify;
            try {
              verify = await getJson(api(conn, `/api/${root}/verify`), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paths: rels }),
              });
            } catch (e) {
              const err = new Error(`[中断] ホスト側の確認が取れませんでした（${e.message}）。実体は残しています。`);
              err.partial = result;
              throw err;
            }

            for (const [full, info] of chunk) {
              const rel = full.substring(mountPath.length + 1);
              const v = verify.results?.[rel];
              if (!v || !v.present) {
                result.skipped.push(`${rel}: ホストに実体が無い`);
                continue;
              }
              if (v.hash !== info.hash) {
                result.skipped.push(`${rel}: ハッシュ不一致`);
                continue;
              }
              try {
                await MetaOS.fs.createStub(full, { size: v.size, updatedAt: info.updatedAt, hash: v.hash });
                result.released++;
                result.bytes += v.size || 0;
              } catch (e) {
                result.skipped.push(`${rel}: ${e.message}`);
              }
            }

            if (onProgress) {
              onProgress({
                done: Math.min(i + VERIFY_CHUNK, targets.length),
                total: targets.length,
                released: result.released,
                skipped: result.skipped.length,
                bytes: result.bytes,
              });
            }
          }
          return result;
        }

        function releaseSummary(r) {
          let out = `スタブ化: ${r.released} 件 / 見送り: ${r.skipped.length} 件（対象 ${r.total} 件、解放 ${r.bytes} バイト）`;
          if (r.skipped.length)
            out +=
              '\n見送りの理由:\n' +
              r.skipped
                .slice(0, 20)
                .map((s) => '  - ' + s)
                .join('\n');
          return out;
        }

        MetaOS.tools.register({
          name: 'local_release',
          description: 'Turns materialized files back into stubs (verified against the host first).',
          definition: DEFS.local_release,
          handler: async (p) => {
            try {
              const conn = resolveConn(p.connection);
              const root = resolveRoot(conn, p.root);
              const r = await releaseVerified(conn, root, p.path);
              if (!r.total) return `スタブ化できる実体がありません: ${p.path}`;
              return releaseSummary(r);
            } catch (e) {
              const head = e.message.startsWith('[') ? e.message : `[エラー] ${e.message}`;
              return e.partial && e.partial.released
                ? `${head}\n（中断前に ${e.partial.released} 件をスタブ化しています）`
                : head;
            }
          },
        });

        // ---------- 設定アプリからの依頼（IPC） ----------
        //
        // broadcast は**送信者自身にも届く**（2026-08-20 に実測）。origin を見て自分の放送を
        // 弾かないと、自分の依頼に自分で答えることになる。
        const IPC_ORIGIN = `local_bridge_${Date.now()}_${Math.random().toString(36).slice(2)}`;

        MetaOS.system.on('local_bridge:request', async (msg) => {
          if (!msg || !msg.id || msg.origin === IPC_ORIGIN) return;
          const reply = (type, payload) =>
            MetaOS.system.broadcast(`local_bridge:${type}`, { id: msg.id, origin: IPC_ORIGIN, ...payload });
          try {
            if (msg.action === 'ignore_cleanup') {
              const conn = resolveConn(msg.connection);
              const root = resolveRoot(conn, msg.root);
              const mountPath = `${MOUNT_BASE}/${conn.name}/${root}`;
              const mount = mounts.get(mountPath);
              if (!mount) throw new Error(`マウントされていません: ${mountPath}`);
              const r = await withSyncPaused(mount, () =>
                ignoreCleanup(mount, { dryRun: !!msg.dryRun, onProgress: (p) => reply('progress', p) }),
              );
              reply('result', { ok: true, ...r });
              return;
            }
            if (msg.action !== 'release') throw new Error(`不明な依頼: ${msg.action}`);
            const conn = resolveConn(msg.connection);
            const root = resolveRoot(conn, msg.root);
            const r = await releaseVerified(conn, root, msg.path || '', (p) => reply('progress', p));
            reply('result', {
              ok: true,
              total: r.total,
              released: r.released,
              bytes: r.bytes,
              skippedTotal: r.skipped.length,
              skipped: r.skipped.slice(0, 50),
            });
          } catch (e) {
            reply('result', {
              ok: false,
              error: e.message,
              released: e.partial ? e.partial.released : 0,
              bytes: e.partial ? e.partial.bytes : 0,
            });
          }
        });

        for (const def of Object.values(DEFS)) {
          MetaOS.ai.log(def, 'tool_available');
        }

        // ---------- 起動 ----------
        await ensureDirRecursive(ANCHOR_DIR, null);

        const summary = [];
        for (const conn of connections) {
          const status = await refreshConn(conn);
          if (!status) {
            summary.push(`${connLabel(conn)}: 未接続 (${conn.serverUrl}) — ${ROOT_POLL_MS / 1000}秒ごとに再確認します`);
          } else {
            const id = conn.identity || {};
            const who = id.hostname ? `${id.hostname} / ${id.user || '?'}` : '名乗りなし（v3.1 未満のサーバー）';
            summary.push(
              `${connLabel(conn)}: v${status.version} [${who}] ルート ${(status.roots || []).length} 件 / 実行 ${conn.execMode}`,
            );
          }
          // 起動時に繋がらなくても巡回は必ず仕掛ける。
          // ここを status の有無で分岐させると、サーバーを後から起動した場合に
          // 永久に繋がらないままになる（実際にこれで踏んだ）。
          startPollLoop(conn);
        }

        MetaOS.ai.log(
          'Local Bridge (daemon v3.8) 起動\n' + (summary.join('\n') || '（有効な接続がありません）'),
          'system',
        );
      })();
    </script>
  </body>
</html>
