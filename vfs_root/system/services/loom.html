<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <script src="/system/lib/loom_core.js"></script>
    <script>
      /**
       * Loom デーモン（T-0531 / P-0013）
       *
       * 何をするか:
       *   1. 札（data/apps/loom/*.md）の写しを持つ。行ごとに VFS の hash を持たせ、
       *      getSyncState（1 回の呼び出しで全部の hash が来る。実測 3ms）と突き合わせて、**読まずに腐りを検出**する。
       *      食い違った札だけを読み直す。本文もメモリに持つので、一覧・検索はファイルを読まずに済む
       *      （全件読みは実測 1.1 秒／480 枚。メモリ上の走査は 2ms）。
       *   2. 札への書き込みを**ここで直列に**する（読む → 変える → 書く を 1 本の列で）。
       *      画面（system/apps/loom.html）と Itera の道具が同じ列を通るので、並行した書き込みが互いを踏まない。
       *      「確認したので完了にする」の二度押しで転記が二重に走った件（2026-09-18）も、
       *      2 回目は列の後ろで「既に運ばれている」を見て止まる。
       *   3. 写しの行（front matter ＋ 本文から導いた事実）を system/temp/loom_index.json に保存する。
       *      system/temp は Drive に同期されない（gdrive_sync の ALWAYS_EXCLUDED）ので、**端末ごとの写し**になる。
       *      新しい端末で札が stub のままでも、写しの hash が一致すれば中身を取りに行かずに一覧が出せる。
       *
       * 何をしないか:
       *   🔴 **要約しない。説明書を作らない。**（T-0055: ctx_brief が要約の空欄を「決定なし」と答え、
       *      完全性の錯覚を作った。P-0013 の文脈「道具を賢くして規律を機械に読ませる」は却下済み）
       *      道具は「どの札のどの行か」を返すだけ。祖先を根まで読むのは Itera が read_file でやる。
       *   🔴 **ダイアログを出さない。** 人に訊くのは画面の仕事。ここは訊かずに理由を返す。
       *   🔴 **写しを唯一の正にしない。** 正はいつも札のファイル。写しが無い・古い・壊れていても、
       *      読み直しに落ちるだけで答えは正しい（上がるのは費用だけ）。
       *
       * 画面との IPC:
       *   画面 → 'loom.req' { rid, op, args }   デーモン → 'loom.res' { rid, ok, result | error }
       *   デーモン → 'loom.changed' { rev, rows: [行…], removed: [id…] }（写しが変わったとき）
       *
       * 手引き: docs/manual/loom_daemon.md
       */
      (async () => {
        const M = window.MetaOS;
        const C = window.LoomCore;
        // 起動引数（試験用）: 別の板・別の写し・別の IPC の名前で動かせる。道具を出さないこともできる。
        //   例: spawn pid="loom_sandbox" dir="system/temp/loom_sandbox" index="system/temp/loom_sandbox_index.json" channel="loom_sb" tools="false"
        let ARGS = {};
        try {
          ARGS = (await M.system.getArgs()) || {};
        } catch (e) {}
        const DIR = ARGS.dir || C.DIR;
        const INDEX_PATH = ARGS.index || 'system/temp/loom_index.json';
        const CH = ARGS.channel || 'loom';
        const WITH_TOOLS = String(ARGS.tools) !== 'false';
        const STUB_BUDGET = 20; // 1 回の突き合わせで取りに行く stub の上限（波を作らない）
        const RECONCILE_EVERY_MS = 30000; // 取りこぼしの掃除（監視の穴を塞ぐだけ。主は vfs_mutation）

        // ------------------------------------------------------------
        // 写し
        // ------------------------------------------------------------
        /** path → { path, meta, body, raw, d, hash, updatedAt, size, stub, loaded } */
        const cards = new Map();
        /** path → 理由（読めなかった／id が無い）。黙って捨てない */
        const skips = new Map();
        let list = []; // 系譜の関数に渡す配列（写しが変わるたびに作り直す）
        let L = C.lineage(() => list);
        let rev = 0;
        let lastReconcile = 0;
        let lastSaved = 0;
        let bootMs = 0;
        let lastError = '';
        const changedIds = new Set();
        const removedIds = new Set();

        const rebuildList = () => {
          list = Array.from(cards.values()).sort(C.byIdAsc);
        };
        const byId = (id) => L.byId(id);
        const pathOf = (id) => `${DIR}/${id}.md`;
        const errMsg = (e) => (e && e.message) || String(e);
        const jst = (iso) => {
          if (!iso) return '';
          const t = new Date(iso);
          return isNaN(t.getTime()) ? String(iso) : C.localDate(t).slice(0, 16).replace('T', ' ');
        };

        /** 読んだ本文を写しに入れる。変わったら true */
        const accept = (path, raw, info) => {
          const n = C.parseNode(raw);
          if (!n.meta.id) {
            skips.set(path, 'front matter に id がありません');
            const old = cards.get(path);
            if (old) {
              cards.delete(path);
              removedIds.add(old.meta.id);
            }
            return !!old;
          }
          skips.delete(path);
          const old = cards.get(path);
          const card = {
            path,
            meta: n.meta,
            body: n.body,
            raw,
            d: C.derive(n),
            hash: (info && info.hash) || null,
            updatedAt: (info && info.updatedAt) || Date.now(),
            size: (info && info.size) || raw.length,
            stub: false,
            loaded: true,
          };
          cards.set(path, card);
          const changed = !old || old.raw !== raw || JSON.stringify(old.meta) !== JSON.stringify(n.meta);
          if (changed) changedIds.add(n.meta.id);
          return changed;
        };

        const readInto = async (path, info, since) => {
          try {
            const raw = await M.fs.read(path);
            // 読んでいる間に列の側が書いたなら、こちらの読みは古い。書いた側の写しを残す
            const cur = cards.get(path);
            if (since && cur && cur.writtenAt && cur.writtenAt >= since) return false;
            return accept(path, String(raw), info);
          } catch (e) {
            skips.set(path, '読めません: ' + errMsg(e));
            return false;
          }
        };

        /**
         * getSyncState と写しを突き合わせる。hash が一致すれば読まない。
         * opts.fetchStubs … stub も上限なしで読む（検索など、明示的に全部が要るとき）
         * opts.fill       … 本文を持っていない札（写しから復元しただけの札）も読む
         */
        // 突き合わせは重ならないように 1 本に並べる（重なると同じ札を二度読み、古い方が後から入りうる）
        let rcChain = Promise.resolve();
        const reconcile = (opts = {}) => {
          const p = rcChain.then(() => reconcileInner(opts));
          rcChain = p.catch(() => {});
          return p;
        };
        const reconcileInner = async (opts = {}) => {
          const since = Date.now();
          const st = await M.fs.getSyncState(DIR);
          const seen = new Set();
          const toRead = [];
          const stubsToRead = [];
          for (const path of Object.keys(st)) {
            const info = st[path];
            if (!info || info.kind !== 'file' || !/\.md$/.test(path)) continue;
            // 直下だけ（下位のディレクトリは板ではない）
            if (path.slice(DIR.length + 1).includes('/')) continue;
            if (!C.idOfPath(path)) {
              skips.set(path, '札の名前（P-0000.md / T-0000.md）ではありません');
              continue;
            }
            seen.add(path);
            const c = cards.get(path);
            const stub = info.syncState === 'stub';
            const same = c && c.hash && info.hash && c.hash === info.hash;
            if (same) {
              c.stub = stub;
              c.updatedAt = info.updatedAt || c.updatedAt;
              if (!c.loaded && opts.fill) (stub ? stubsToRead : toRead).push([path, info]);
              continue;
            }
            if (stub) stubsToRead.push([path, info]);
            else toRead.push([path, info]);
          }
          for (const [path, c] of Array.from(cards.entries()))
            if (!seen.has(path)) {
              cards.delete(path);
              removedIds.add(c.meta.id);
            }
          for (const path of Array.from(skips.keys())) if (!(path in st)) skips.delete(path);

          for (const [path, info] of toRead) await readInto(path, info, since);
          const budget = opts.fetchStubs ? Infinity : STUB_BUDGET;
          let fetched = 0;
          for (const [path, info] of stubsToRead) {
            if (fetched >= budget) {
              // 読まない。写しの行があればそれを見せる。無ければ「まだ取れていない」行を置く
              if (!cards.has(path)) {
                const id = C.idOfPath(path);
                cards.set(path, {
                  path,
                  meta: { id, kind: id.charAt(0) === 'P' ? 'project' : 'task', title: '', status: '' },
                  body: null,
                  raw: null,
                  d: C.derive({ meta: { id, kind: id.charAt(0) === 'P' ? 'project' : 'task' }, body: '' }),
                  hash: null,
                  updatedAt: info.updatedAt || 0,
                  size: info.size || 0,
                  stub: true,
                  loaded: false,
                  pendingFetch: true,
                });
              }
              continue;
            }
            await readInto(path, info, since);
            fetched++;
          }
          rebuildList();
          lastReconcile = Date.now();
          flushChanges();
          return {
            read: toRead.length,
            fetchedStubs: fetched,
            pendingStubs: Math.max(0, stubsToRead.length - fetched),
          };
        };

        /** その札の本文を必ず持つ（持っていなければ読む）。読めなければ null */
        const ensureLoaded = async (c) => {
          if (!c) return null;
          if (c.loaded) return c;
          await readInto(c.path, { hash: null });
          rebuildList();
          const fresh = cards.get(c.path);
          return fresh && fresh.loaded ? fresh : null;
        };

        // ------------------------------------------------------------
        // 写しの保存・変更の通知
        // ------------------------------------------------------------
        const rowOf = (c) => ({
          path: c.path,
          meta: c.meta,
          d: c.d,
          hash: c.hash,
          updatedAt: c.updatedAt,
          size: c.size,
          stub: !!c.stub,
          loaded: !!c.loaded,
          pendingFetch: !!c.pendingFetch,
        });

        let saveTimer = null;
        const saveIndex = () => {
          clearTimeout(saveTimer);
          saveTimer = setTimeout(async () => {
            try {
              const rows = {};
              for (const c of cards.values()) if (!c.pendingFetch && c.hash) rows[c.path] = rowOf(c);
              await M.fs.write(INDEX_PATH, JSON.stringify({ version: C.INDEX_VERSION, savedAt: Date.now(), rows }), {
                overwrite: true,
                silent: true,
              });
              lastSaved = Date.now();
            } catch (e) {
              lastError = '写しを保存できませんでした: ' + errMsg(e);
              console.warn('[loom] ' + lastError);
            }
          }, 2000);
        };

        let flushTimer = null;
        // 読めないファイルの一覧も、変わったときは知らせに載せる（画面の全景が古い警告を出し続けないように）
        let lastSkipSig = '';
        const skipSig = () => Array.from(skips.keys()).sort().join('\n');
        const skipList = () => Array.from(skips.entries()).map(([path, why]) => ({ path, why }));
        const flushChanges = () => {
          if (!changedIds.size && !removedIds.size && skipSig() === lastSkipSig) return;
          clearTimeout(flushTimer);
          flushTimer = setTimeout(() => {
            const ids = Array.from(changedIds);
            const removed = Array.from(removedIds);
            changedIds.clear();
            removedIds.clear();
            rev++;
            const rows = ids
              .map((id) => byId(id))
              .filter(Boolean)
              .map(rowOf);
            const payload = { rev, rows, removed };
            const sig = skipSig();
            if (sig !== lastSkipSig) {
              lastSkipSig = sig;
              payload.skips = skipList();
            }
            try {
              M.system.broadcast(CH + '.changed', payload);
            } catch (e) {}
            if (ids.length || removed.length) saveIndex();
          }, 120);
        };

        const loadIndex = async () => {
          try {
            if (!(await M.fs.exists(INDEX_PATH))) return 0;
            const j = JSON.parse(await M.fs.read(INDEX_PATH));
            if (!j || j.version !== C.INDEX_VERSION || !j.rows) return 0; // 版の違う写しは信じない
            let n = 0;
            for (const path of Object.keys(j.rows)) {
              const r = j.rows[path];
              if (!r || !r.meta || !r.meta.id || !r.hash) continue;
              cards.set(path, { ...r, body: null, raw: null, loaded: false });
              n++;
            }
            rebuildList();
            return n;
          } catch (e) {
            lastError = '写しを読めませんでした（読み直しで動く）: ' + errMsg(e);
            return 0;
          }
        };

        // ------------------------------------------------------------
        // 書き込み（1 本の列）
        // ------------------------------------------------------------
        let chain = Promise.resolve();
        const serial = (fn) => {
          const p = chain.then(() => fn());
          chain = p.catch(() => {});
          return p;
        };

        /**
         * 読む → 変える → 書く。fn が false を返したら書かない（fresh.reason に理由）。
         * 🔴 写しの本文では書かない。必ずファイルから読み直す（Handoff T-0007: メモリの本文で全文上書きして相手の追記を消した）
         */
        const mutate = async (id, fn) => {
          const path = pathOf(id);
          let raw;
          try {
            raw = await M.fs.read(path);
          } catch (e) {
            return { ok: false, id, reason: '読めませんでした: ' + errMsg(e) };
          }
          const fresh = C.parseNode(String(raw));
          if (!fresh.meta.id) return { ok: false, id, reason: 'front matter に id がありません' };
          fresh.path = path;
          if (fn(fresh) === false)
            return { ok: false, id, reason: fresh.reason || '変更しませんでした', ...(fresh.extra || {}) };
          fresh.meta.updated = C.nowIso();
          const text = C.serializeNode(fresh.meta, fresh.body);
          try {
            await M.fs.write(path, text, { overwrite: true, silent: true });
          } catch (e) {
            return { ok: false, id, reason: '保存に失敗しました: ' + errMsg(e) };
          }
          // hash は VFS が付ける。ここでは分からないので null にして、次の突き合わせで読み直させる
          accept(path, text, { hash: null });
          const wc = cards.get(path);
          if (wc) wc.writtenAt = Date.now();
          rebuildList();
          flushChanges();
          return { ok: true, id, node: fresh, text };
        };

        /** 書いた行が本当にファイルに在るかを読み直して確かめ、行番号を返す（成功の表示は入った証拠ではない） */
        const verifyLines = async (id, lines) => {
          try {
            const raw = String(await M.fs.read(pathOf(id)));
            const all = raw.split('\n');
            const first = String(lines[0]);
            const at = all.lastIndexOf(first);
            if (at < 0) return { ok: false, total: all.length };
            return { ok: true, from: at + 1, to: at + lines.length, total: all.length };
          } catch (e) {
            return { ok: false, total: 0, reason: errMsg(e) };
          }
        };

        const META_KEYS = ['title', 'status', 'priority', 'scheduled', 'refs', 'parent', 'supersedes'];

        // ------------------------------------------------------------
        // 操作（画面と道具の両方がここを呼ぶ）
        // ------------------------------------------------------------
        const Ops = {};

        Ops.rows = async () => {
          if (!lastReconcile) await reconcile();
          return {
            rev,
            rows: list.map(rowOf),
            skips: Array.from(skips.entries()).map(([path, why]) => ({ path, why })),
          };
        };

        /** 1 枚を読む（画面の詳細に使う）。写しではなくファイルから */
        Ops.get = async ({ id }) => {
          const path = pathOf(id);
          let raw;
          try {
            raw = String(await M.fs.read(path));
          } catch (e) {
            return { ok: false, id, reason: '読めませんでした: ' + errMsg(e) };
          }
          accept(path, raw, { hash: (cards.get(path) || {}).hash || null });
          rebuildList();
          flushChanges();
          const n = C.parseNode(raw);
          return { ok: true, id, meta: n.meta, body: n.body };
        };

        /** front matter を変える（done 以外）。patch に来たキーだけを書く */
        Ops.saveMeta = ({ id, patch }) =>
          serial(async () => {
            const p = patch || {};
            if (p.status === 'done') {
              const cur = byId(id);
              if (cur && !C.isProject(cur) && cur.meta.status !== 'done')
                return { ok: false, id, reason: 'done は「done」の操作で行う（親へ運ぶのはそこだけ）' };
            }
            const before = {};
            const r = await mutate(id, (fresh) => {
              for (const k of META_KEYS)
                if (k in p) {
                  before[k] = fresh.meta[k];
                  fresh.meta[k] = p[k];
                }
              return true;
            });
            return r.ok ? { ok: true, id, before, after: p } : r;
          });

        /** 本文を丸ごと保存する（画面の「本文を保存」）。base（編集を始めた時点の本文）と違えば書かない */
        Ops.saveBody = ({ id, body, base, patch }) =>
          serial(async () => {
            const norm = (s) => String(s == null ? '' : s).trim();
            const r = await mutate(id, (fresh) => {
              if (norm(fresh.body) !== norm(base)) {
                fresh.reason = '他の書き手が先に更新しました';
                fresh.extra = { conflict: true };
                return false;
              }
              fresh.body = body;
              const p = patch || {};
              for (const k of META_KEYS) if (k in p && k !== 'status') fresh.meta[k] = p[k];
              if ('status' in p && p.status !== 'done') fresh.meta.status = p.status;
              return true;
            });
            return r.ok ? { ok: true, id } : r;
          });

        /**
         * 節へ追記する。form:
         *   entry    … `- <日時> <who>: <text>`（既定）
         *   raw      … そのまま（計画のチェックボックス・成果物の行・意図の行）
         *   report   … `### レポート <日時>`（タスク → 進捗）／`### 総括 <日時>`（プロジェクト → 履歴）の見出しを付けて
         *   addendum … 最後の自分の総括／レポートの**枠の中**へ `- **追記 <日時> <who>**: <text>`
         * status を渡すと同じ書き込みで状態も変える。unblock=true なら blocked のときだけ todo に戻す。
         */
        Ops.append = ({ id, section, text, form, who, status, unblock }) =>
          serial(async () => {
            const f = form || 'entry';
            const w = who || 'Itera';
            const s = C.stamp();
            const body = String(text == null ? '' : text).replace(/\s+$/, '');
            if (!body) return { ok: false, id, reason: '書く内容がありません' };
            if (status === 'done') return { ok: false, id, reason: 'done は「done」の操作で行う' };
            let lines = null;
            let sec = section;
            const r = await mutate(id, (fresh) => {
              const proj = C.isProject(fresh);
              if (f === 'addendum') {
                const rs = C.ownRecaps(fresh);
                if (!rs.length) {
                  fresh.reason = `${C.recapName(fresh)}がまだありません`;
                  return false;
                }
                const t = rs[rs.length - 1];
                const ls = fresh.body.split('\n');
                let at = Math.min(t.end, ls.length - 1);
                while (at > t.start && !ls[at].trim()) at--;
                lines = [`- **追記 ${s} ${w}**: ${body.replace(/\n/g, ' ')}`];
                ls.splice(at + 1, 0, lines[0]);
                fresh.body = ls.join('\n');
                sec = C.logSection(fresh);
              } else {
                if (f === 'report') sec = C.logSection(fresh);
                sec = sec || C.logSection(fresh);
                if (!C.sectionRange(fresh.body, sec)) {
                  fresh.reason = `## ${sec} がありません（節は ${C.sectionNames(fresh.body).join(' / ')}）`;
                  return false;
                }
                if (f === 'report') lines = [`### ${C.recapName(fresh)} ${s}`].concat(body.split('\n'));
                else if (f === 'raw') lines = body.split('\n');
                else {
                  const bl = body.split('\n');
                  lines = [`- ${s} ${w}: ${bl[0]}`].concat(bl.slice(1));
                }
                fresh.body = C.appendToSection(fresh.body, sec, lines.join('\n'));
              }
              if (status) fresh.meta.status = status;
              else if (unblock && fresh.meta.status === 'blocked') fresh.meta.status = 'todo';
              void proj;
              return true;
            });
            if (!r.ok) return r;
            const v = await verifyLines(id, lines);
            return {
              ok: true,
              id,
              section: sec,
              stamp: s,
              lines,
              verified: v,
              status: r.node.meta.status,
              text: r.text,
            };
          });

        /** 計画のチェックボックスを 未着手 → 作業中 → 完了 と回す（その行が本文にちょうど 1 つあるときだけ） */
        Ops.cyclePlan = ({ id, line }) =>
          serial(async () => {
            const r = await mutate(id, (fresh) => {
              const ls = String(fresh.body).split('\n');
              const hits = [];
              ls.forEach((l, i) => {
                if (l === line) hits.push(i);
              });
              const m = hits.length === 1 ? ls[hits[0]].match(/^(\s*- \[)( |x|X|~)(\] .*)$/) : null;
              if (!m) {
                fresh.reason = 'この項目が見つかりませんでした（外部で書き換えられた可能性があります）';
                return false;
              }
              const cur = m[2].toLowerCase();
              ls[hits[0]] = m[1] + (cur === ' ' ? '~' : cur === '~' ? 'x' : ' ') + m[3];
              fresh.body = ls.join('\n');
              return true;
            });
            return r.ok ? { ok: true, id } : r;
          });

        /** 新しい id。写しだけでなく**いまのディレクトリ**も数える（画面が止まっている間に増えた札と衝突しないように） */
        const allIds = async () => {
          const ids = new Set(list.map((n) => n.meta.id));
          try {
            const st = await M.fs.getSyncState(DIR);
            for (const p of Object.keys(st)) {
              const id = C.idOfPath(p);
              if (id) ids.add(id);
            }
          } catch (e) {}
          return Array.from(ids);
        };

        /**
         * 札を起こす（起票・分解・分岐）。親の側にも出来事を 1 行書く。
         * 🔴 書くときは overwrite を付けない。衝突したら「既に在る」で止まる（最後の防壁）→ 番号を上げて試す
         */
        const createCard = async ({ kind, parent, title, status, priority, scheduled, refs, supersedes, body }) => {
          const k = kind === 'project' ? 'project' : 'task';
          const ids = await allIds();
          let id = C.nextId(ids, k);
          const meta = {
            id,
            kind: k,
            title: title || (k === 'project' ? '(無題のプロジェクト)' : '(無題のタスク)'),
            status: status || (k === 'project' ? 'live' : 'inbox'),
            created: C.nowIso(),
            updated: C.nowIso(),
          };
          if (k === 'task') {
            meta.priority = priority || 'normal';
            meta.scheduled = scheduled || '';
          }
          if (parent) meta.parent = parent;
          if (supersedes) meta.supersedes = supersedes;
          meta.refs = Array.isArray(refs) ? refs : [];
          const text0 = body || C.newBody(k);
          for (let i = 0; i < 5; i++) {
            meta.id = id;
            const text = C.serializeNode(meta, text0);
            try {
              if (await M.fs.exists(pathOf(id))) throw new Error('exists');
              await M.fs.write(pathOf(id), text, { silent: true });
              accept(pathOf(id), text, { hash: null });
              rebuildList();
              flushChanges();
              return { ok: true, id, meta };
            } catch (e) {
              id = C.nextId(ids.concat([id]), k);
              ids.push(meta.id);
            }
          }
          return { ok: false, reason: '札を作れませんでした（id の衝突が続いた）' };
        };

        /** 起票（プロジェクトの下のタスク）／分解（タスクの下のタスク）／分岐（プロジェクトの下のプロジェクト） */
        Ops.create = (args) =>
          serial(async () => {
            const a = args || {};
            const parent = a.parent ? byId(a.parent) : null;
            if (a.parent && !parent) return { ok: false, reason: `親 ${a.parent} が板にありません` };
            const k = a.kind === 'project' ? 'project' : 'task';
            if (k === 'project' && parent && !C.isProject(parent))
              return { ok: false, reason: 'タスクの下にプロジェクトは吊るせません（T→P の辺は無い）' };
            if (k === 'task' && !parent) return { ok: false, reason: 'タスクには親（プロジェクトかタスク）が要ります' };
            let body = a.body || null;
            if (!body && a.request && k === 'task')
              body = C.newBody('task').replace('（何が満たされたら終わりか）', String(a.request).trim());
            const made = await createCard({ ...a, kind: k, body });
            if (!made.ok) return made;
            const s = C.stamp();
            const title = made.meta.title;
            if (parent) {
              if (k === 'project') {
                await mutate(parent.meta.id, (f) => {
                  f.body = C.appendToSection(f.body, '履歴', `- ${s} 分岐: ${made.id}「${title}」`);
                  return true;
                });
                await mutate(made.id, (f) => {
                  f.body = C.appendToSection(
                    f.body,
                    '履歴',
                    `- ${s} 分岐: ${parent.meta.id}「${parent.meta.title}」から切り出し`,
                  );
                  return true;
                });
              } else if (C.isProject(parent)) {
                await mutate(parent.meta.id, (f) => {
                  f.body = C.appendToSection(f.body, '履歴', `- ${s} 起票: ${made.id}「${title}」`);
                  return true;
                });
              } else {
                await mutate(parent.meta.id, (f) => {
                  f.body = C.appendToSection(f.body, '進捗', `- ${s} 分解: ${made.id}「${title}」`);
                  return true;
                });
              }
            }
            return { ok: true, id: made.id, path: pathOf(made.id), meta: made.meta };
          });

        /** 継承。前任を凍結（superseded）し、後継を作る。**子の parent は書き換えない** */
        Ops.supersede = ({ id }) =>
          serial(async () => {
            await reconcile();
            const p = byId(id);
            if (!p || !C.isProject(p)) return { ok: false, reason: 'プロジェクトではありません' };
            const made = await createCard({
              kind: 'project',
              title: p.meta.title + '（第2期）',
              parent: p.meta.parent || '',
              supersedes: p.meta.id,
              refs: Array.isArray(p.meta.refs) ? p.meta.refs : [],
            });
            if (!made.ok) return made;
            const s = C.stamp();
            await mutate(made.id, (f) => {
              f.body = C.appendToSection(f.body, '履歴', `- ${s} 継承: ${p.meta.id}「${p.meta.title}」を継いだ`);
              return true;
            });
            await mutate(p.meta.id, (f) => {
              f.body = C.appendToSection(f.body, '履歴', `- ${s} 継承: ${made.id}へ継いだ（凍結）`);
              f.meta.status = 'superseded';
              return true;
            });
            return { ok: true, id: made.id, from: p.meta.id, title: p.meta.title };
          });

        /** まだ親へ渡していない総括の数など（画面が確認ダイアログを出す前に訊く）。ファイルから読み直して数える */
        Ops.recapInfo = async ({ id }) => {
          await reconcile();
          const n = await ensureLoaded(byId(id));
          if (!n) return { ok: false, id, reason: '読めませんでした' };
          const own = C.ownRecaps(n);
          const pend = C.pendingRecaps(n);
          const last = own.length ? own[own.length - 1] : null;
          const delivered = C.isProject(n) ? !!last && !pend.some((r) => r.at === last.at) : L.deliveredAlready(n);
          return {
            ok: true,
            id,
            own: own.length,
            pending: pend.length,
            lastAt: last ? last.at : '',
            delivered,
            reports: n.d.reports,
          };
        };

        /** 転記（上げる）。畳まない。子の総括をそのまま親の履歴へ載せ、自分に「どこまで渡したか」を書く */
        const pushUpInner = async (id) => {
          await reconcile();
          const n = await ensureLoaded(byId(id));
          if (!n) return { ok: false, id, reason: '読めませんでした' };
          const parent = byId(n.meta.parent);
          if (!parent) return { ok: false, id, reason: '親がありません' };
          const rs = C.pendingRecaps(n);
          const name = C.recapName(n);
          if (!rs.length) return { ok: false, id, empty: true, reason: `まだ渡していない${name}がありません` };
          const s = C.stamp();
          const block = [
            `- ${s} 転記: ${n.meta.id}「${n.meta.title}」より（${rs[0].at} 以降の${name} ${rs.length} 件）`,
          ]
            .concat(rs.map((r) => `\n### ${name} ${r.at}（${n.meta.id}）\n${r.text}`))
            .join('\n');
          const a = await mutate(parent.meta.id, (f) => {
            f.body = C.appendToSection(f.body, C.isProject(parent) ? '履歴' : '進捗', block);
            return true;
          });
          if (!a.ok) return a;
          await mutate(n.meta.id, (f) => {
            f.body = C.appendToSection(
              f.body,
              C.logSection(f),
              `- ${s} 転記: ${parent.meta.id}「${parent.meta.title}」へ（${rs[rs.length - 1].at} まで／${rs.length} 件）`,
            );
            return true;
          });
          return { ok: true, id, to: parent.meta.id, count: rs.length };
        };
        Ops.pushUp = ({ id }) => serial(() => pushUpInner(id));

        /** 終結（合流）。未送があれば転記してから凍結する */
        Ops.closeMerge = ({ id }) =>
          serial(async () => {
            await reconcile();
            const n = await ensureLoaded(byId(id));
            if (!n || !C.isProject(n)) return { ok: false, id, reason: 'プロジェクトではありません' };
            let pushed = null;
            if (C.pendingRecaps(n).length) {
              pushed = await pushUpInner(id);
              if (!pushed.ok) return pushed;
            }
            const r = await mutate(id, (f) => {
              f.body = C.appendToSection(f.body, '履歴', `- ${C.stamp()} 完了: 合流して凍結`);
              f.meta.status = 'frozen';
              return true;
            });
            return r.ok ? { ok: true, id, pushed } : r;
          });

        /**
         * 確認へ回す（review）。**運ばない**（運ぶのは done の瞬間。T-0203）。
         * レポートが無ければ回さずに empty を返す（訊くのは画面の仕事）。force で回す。
         */
        Ops.complete = ({ id, force }) =>
          serial(async () => {
            await reconcile();
            const t = await ensureLoaded(byId(id));
            if (!t) return { ok: false, id, reason: `${id} は板にありません（または読めません）` };
            if (C.isProject(t)) return { ok: false, id, reason: 'プロジェクトは完了にしません' };
            const rs = C.parseRecaps(t.body, '進捗', 'レポート');
            const artifacts = C.sectionText(t.body, '成果物');
            if (!rs.length && !force)
              return {
                ok: false,
                id,
                reports: 0,
                artifacts: !!artifacts,
                empty: true,
                delivered: false,
                reason: 'レポートがありません（確認へ回していません）',
              };
            const r = await mutate(id, (f) => {
              f.meta.status = 'review';
              return true;
            });
            if (!r.ok) return r;
            return { ok: true, id, reports: rs.length, artifacts: !!artifacts, empty: !rs.length, delivered: false };
          });

        /**
         * 親へ運んで done にする（＝山内さんの「確認したので完了にする」）。**ちょうど一度だけ。**
         * レポート本体は所属プロジェクトの履歴へ、上位タスクへは 1 行。
         * 列の中で読み直してから「既に運ばれたか」を見るので、二度押しでも二重に載らない。
         */
        Ops.done = ({ id, force }) =>
          serial(async () => {
            await reconcile();
            const t = await ensureLoaded(byId(id));
            if (!t) return { ok: false, id, reason: `${id} は板にありません（または読めません）` };
            if (C.isProject(t)) return { ok: false, id, reason: 'プロジェクトはここでは運びません（転記 ↑ を使う）' };
            let delivered = null;
            if (L.deliveredAlready(t)) delivered = { skipped: true, to: null, reports: 0 };
            else {
              const rs = C.parseRecaps(t.body, '進捗', 'レポート');
              const artifacts = C.sectionText(t.body, '成果物');
              if (!rs.length && !force)
                return {
                  ok: false,
                  id,
                  reports: 0,
                  artifacts: !!artifacts,
                  empty: true,
                  reason: 'レポートがありません',
                };
              const parent = byId(t.meta.parent);
              const own = L.owningProject(t);
              const parentIsTask = parent && !C.isProject(parent);
              const last = rs.length ? rs[rs.length - 1] : null;
              const s = C.stamp();
              if (own) {
                const block = [`- ${s} 完了: ${t.meta.id}「${t.meta.title}」${artifacts ? ' ／ 成果物あり' : ''}`]
                  .concat(last ? [`\n### レポート ${last.at}（${t.meta.id}）\n${last.text}`] : [])
                  .concat(artifacts ? [`\n**成果物**\n${artifacts}`] : [])
                  .join('\n');
                const a = await mutate(own.meta.id, (f) => {
                  f.body = C.appendToSection(f.body, '履歴', block);
                  return true;
                });
                if (!a.ok) return { ok: false, id, reason: '所属プロジェクトへ書けませんでした: ' + a.reason };
              }
              if (parentIsTask) {
                const one = artifacts
                  .split('\n')
                  .filter((l) => l.trim())
                  .slice(0, 1)
                  .join('')
                  .replace(/^- /, '');
                await mutate(parent.meta.id, (f) => {
                  f.body = C.appendToSection(
                    f.body,
                    '進捗',
                    `- ${s} 完了: ${t.meta.id}「${t.meta.title}」${one ? ' ／ 成果物: ' + one : ''}`,
                  );
                  return true;
                });
              }
              delivered = { skipped: false, to: own ? own.meta.id : null, reports: rs.length };
            }
            const r = await mutate(id, (f) => {
              f.meta.status = 'done';
              return true;
            });
            if (!r.ok) return { ok: false, id, reason: '運んだが done にできませんでした: ' + r.reason, delivered };
            return { ok: true, id, ...delivered };
          });

        /** 中止（タスク）／放棄（プロジェクト）。消さない */
        Ops.drop = ({ id }) =>
          serial(async () => {
            const r = await mutate(id, (f) => {
              f.meta.status = C.isProject(f) ? 'abandoned' : 'dropped';
              f.body = C.appendToSection(f.body, C.logSection(f), `- ${C.stamp()} 中止`);
              return true;
            });
            return r.ok ? { ok: true, id } : r;
          });

        /** 削除（trash へ）。画面のボタンからだけ呼ぶ（道具には出さない） */
        Ops.remove = ({ id }) =>
          serial(async () => {
            try {
              await M.fs.delete(pathOf(id));
            } catch (e) {
              return { ok: false, id, reason: '削除に失敗しました: ' + errMsg(e) };
            }
            const c = cards.get(pathOf(id));
            if (c) {
              cards.delete(pathOf(id));
              removedIds.add(id);
              rebuildList();
              flushChanges();
            }
            return { ok: true, id };
          });

        Ops.selfTest = async () => C.selfTest();
        Ops.status = async () => statusObj();

        const statusObj = () => {
          let loaded = 0,
            stubs = 0,
            pending = 0;
          for (const c of cards.values()) {
            if (c.loaded) loaded++;
            if (c.stub) stubs++;
            if (c.pendingFetch) pending++;
          }
          return {
            cards: cards.size,
            loaded,
            stubs,
            pendingFetch: pending,
            skips: Array.from(skips.entries()).map(([path, why]) => ({ path, why })),
            rev,
            bootMs,
            lastReconcile: lastReconcile ? jst(new Date(lastReconcile).toISOString()) : '',
            lastSaved: lastSaved ? jst(new Date(lastSaved).toISOString()) : '',
            lastError,
          };
        };

        // ------------------------------------------------------------
        // IPC（画面から）
        // ------------------------------------------------------------
        M.system.on(CH + '.req', async (m) => {
          if (!m || !m.rid || !m.op) return;
          const fn = Ops[m.op];
          let res;
          if (!fn) res = { rid: m.rid, ok: false, error: `知らない操作です: ${m.op}` };
          else {
            try {
              res = { rid: m.rid, ok: true, result: await fn(m.args || {}) };
            } catch (e) {
              res = { rid: m.rid, ok: false, error: errMsg(e) };
            }
          }
          try {
            M.system.broadcast(CH + '.res', res);
          } catch (e) {}
        });

        // ------------------------------------------------------------
        // 監視
        // ------------------------------------------------------------
        let watchTimer = null;
        const scheduleReconcile = () => {
          clearTimeout(watchTimer);
          watchTimer = setTimeout(() => {
            reconcile().catch((e) => (lastError = '突き合わせに失敗: ' + errMsg(e)));
          }, 250);
        };
        M.system.on('vfs_mutation', (m) => {
          const p = String((m && (m.path || m.to || m.from)) || '');
          if (p.indexOf(DIR + '/') === 0 && /\.md$/.test(p)) scheduleReconcile();
        });

        // ------------------------------------------------------------
        // Itera 向けの道具（探す・指す・運ぶだけ。要約しない）
        // ------------------------------------------------------------
        const attrsOf = (ctx) => {
          const a = (ctx && ctx.attributes) || ctx || {};
          const content = ctx && ctx.content != null ? ctx.content : a.content;
          return { a, content: content == null ? '' : String(content) };
        };
        const truthy = (v) => v === true || v === 'true';
        const csv = (v) =>
          String(v || '')
            .split(',')
            .map((s) => s.trim())
            .filter(Boolean);
        const header = () => {
          const st = statusObj();
          const warn = [];
          if (st.pendingFetch) warn.push(`中身をまだ取れていない stub ${st.pendingFetch} 枚（題・状態が空の行）`);
          if (st.skips.length)
            warn.push(
              `読めないファイル ${st.skips.length} 件: ${st.skips.map((s) => s.path + '（' + s.why + '）').join(' / ')}`,
            );
          return warn.length ? '⚠ ' + warn.join(' ／ ') + '\n' : '';
        };
        const lineOf = (n) => {
          const m = n.meta;
          const sch = m.scheduled ? ` 予定:${m.scheduled}` : '';
          const pr = C.isProject(n) ? '' : ` ${m.priority || '-'}`;
          return `${m.id} [${m.status || '?'}]${pr}${sch} 親:${m.parent || '—'} 更新:${jst(m.updated) || '—'} | ${m.title || '(題なし)'}`;
        };
        const descendantsOf = (id) => {
          const out = new Set();
          const walk = (x) => {
            for (const c of L.childrenOf(x)) {
              if (out.has(c.meta.id)) continue;
              out.add(c.meta.id);
              walk(c.meta.id);
            }
          };
          walk(id);
          return out;
        };
        const filterNodes = (a) => {
          let xs = list.slice();
          const sts = csv(a.status);
          if (sts.length) {
            xs = xs.filter((n) => {
              if (sts.includes('open') && !C.isClosed(n)) return true;
              if (sts.includes('mine') && C.ballOf(n) === 'ai') return true;
              if (sts.includes('yours') && C.ballOf(n) === 'user') return true;
              return sts.includes(n.meta.status);
            });
          }
          if (a.kind) xs = xs.filter((n) => (a.kind === 'project' ? C.isProject(n) : !C.isProject(n)));
          if (a.parent) {
            const kids = new Set(L.childrenOf(a.parent).map((n) => n.meta.id));
            xs = xs.filter((n) => kids.has(n.meta.id));
          }
          if (a.under) {
            const ds = descendantsOf(a.under);
            ds.add(a.under);
            xs = xs.filter((n) => ds.has(n.meta.id));
          }
          if (a.scheduled_by) {
            const lim = a.scheduled_by === 'today' ? C.todayStr() : a.scheduled_by;
            xs = xs.filter((n) => n.meta.scheduled && n.meta.scheduled <= lim);
          }
          if (a.q) {
            const q = String(a.q).toLowerCase();
            xs = xs.filter((n) =>
              String(n.meta.title || '')
                .toLowerCase()
                .includes(q),
            );
          }
          return xs;
        };

        const TOOLS = [];
        const tool = (name, description, definition, handler) => TOOLS.push({ name, description, definition, handler });

        tool(
          'loom_list',
          'List Loom cards by front matter (status / kind / parent / subtree / scheduled / title).',
          `<define_tag name="loom_list">
Loom の札を front matter で絞って一覧する（Loom デーモン。ファイルを読まずに写しから答える）。
Attributes:
  - status (optional): カンマ区切り。todo,doing / review / blocked ほか。特別な値: "mine"（私の番＝todo・doing）"yours"（山内さんの番）"open"（閉じていない）
  - kind (optional): "task" | "project"
  - parent (optional): この札の直下の子だけ（継承の前任の子も含む）
  - under (optional): この札とその子孫だけ
  - scheduled_by (optional): "YYYY-MM-DD" または "today"。予定がその日以前のもの
  - q (optional): 題の部分一致
  - sort (optional): "id"（既定）| "updated" | "scheduled"
  - limit (optional): 既定 100
Returns: 1 行 1 枚「id [状態] 優先度 予定 親 更新 | 題」。先頭に件数。
Note: 要約はしない。着手前に親を根まで読むのは read_file で（loom_tree がパスを出す）。
</define_tag>`,
          async (ctx) => {
            const { a } = attrsOf(ctx);
            if (!lastReconcile) await reconcile();
            let xs = filterNodes(a);
            const sort = a.sort || 'id';
            if (sort === 'updated')
              xs.sort((x, y) => String(y.meta.updated || '').localeCompare(String(x.meta.updated || '')));
            else if (sort === 'scheduled')
              xs.sort((x, y) => String(x.meta.scheduled || '9999').localeCompare(String(y.meta.scheduled || '9999')));
            const lim = parseInt(a.limit, 10) || 100;
            const shown = xs.slice(0, lim);
            return (
              header() +
              `${xs.length} 枚（板 ${list.length} 枚中）${xs.length > shown.length ? `・先頭 ${shown.length} 枚を表示` : ''}\n` +
              shown.map(lineOf).join('\n')
            );
          },
        );

        tool(
          'loom_search',
          'Full-text search over all Loom cards (including stubs).',
          `<define_tag name="loom_search">
Loom の札の本文を全文検索する（stub の札も読んでから探す。1 行ずつの照合）。
Attributes:
  - query (required): 探す文字列（regex="true" なら正規表現）
  - regex (optional): "true" で正規表現
  - case_sensitive (optional): "true" で大文字小文字を区別
  - status / kind / under (optional): loom_list と同じ絞り込み
  - section (optional): この節（例: "進捗"・"履歴"）の中だけ
  - limit (optional): 既定 40 行
Returns: 「id Lnn [節] (状態) 行の中身」。nn はファイルの行番号（read_file の start/end にそのまま使える）。
         先頭に 当たった行数・当たった札の数・探した札の数。
</define_tag>`,
          async (ctx) => {
            const { a } = attrsOf(ctx);
            if (!a.query) return '[Error] query が要ります';
            let re;
            try {
              const src = truthy(a.regex) ? String(a.query) : String(a.query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              re = new RegExp(src, truthy(a.case_sensitive) ? '' : 'i');
            } catch (e) {
              return '[Error] 正規表現が不正です: ' + errMsg(e);
            }
            const r0 = await reconcile({ fill: true, fetchStubs: true });
            const xs = filterNodes(a);
            const lim = parseInt(a.limit, 10) || 40;
            const out = [];
            const hitCards = new Set();
            let total = 0;
            for (const n of xs) {
              if (!n.loaded || n.raw == null) continue;
              const lines = n.raw.split('\n');
              let sec = '(front matter)';
              for (let i = 0; i < lines.length; i++) {
                const l = lines[i];
                if (/^## /.test(l)) sec = l.slice(3).trim();
                if (a.section && sec !== a.section) continue;
                if (!re.test(l)) continue;
                total++;
                hitCards.add(n.meta.id);
                if (out.length < lim) {
                  const t = l.length > 220 ? l.slice(0, 219) + '…' : l;
                  out.push(`${n.meta.id} L${i + 1} [${sec}] (${n.meta.status || '?'}) ${t}`);
                }
              }
            }
            const unread = xs.filter((n) => !n.loaded).length;
            return (
              header() +
              `${total} 行・${hitCards.size} 枚が当たった（${xs.length} 枚を探した${unread ? `・読めなかった ${unread} 枚は探していない` : ''}` +
              `${r0.fetchedStubs ? `・stub ${r0.fetchedStubs} 枚を取りに行った` : ''}）${total > out.length ? `。先頭 ${out.length} 行を表示` : ''}\n` +
              out.join('\n')
            );
          },
        );

        tool(
          'loom_tree',
          'Show where a Loom card sits: ancestors to the root, owning project, predecessors/successor, children.',
          `<define_tag name="loom_tree">
札の系譜を出す（祖先を根まで・所属プロジェクト・前任／後継・直下の子）。**パスを返すだけで中身は返さない。**
Attributes:
  - id (required): 札の id
Returns: 各行「id [状態] 題 — パス」。着手前に読むべき札（祖先）はこの順に read_file する。
</define_tag>`,
          async (ctx) => {
            const { a } = attrsOf(ctx);
            if (!lastReconcile) await reconcile();
            const n = byId(a.id);
            if (!n) return `[Error] ${a.id} は板にありません`;
            const row = (x, pre) => `${pre}${x.meta.id} [${x.meta.status || '?'}] ${x.meta.title || ''} — ${x.path}`;
            const anc = L.ancestorsOf(n.meta.id);
            const own = L.owningProject(n);
            const preds = L.predecessors(n.meta.id);
            const succ = L.successorOf(n.meta.id);
            const kids = L.childrenOf(n.meta.id);
            const out = [];
            out.push('祖先（根 → 親。着手前にこの順で意図・文脈・履歴を読む）:');
            out.push(anc.length ? anc.map((x) => row(x, '  ')).join('\n') : '  （根。親は無い）');
            out.push(row(n, '本人: '));
            if (!C.isProject(n) && own)
              out.push(
                row(own, '所属プロジェクト: ') +
                  (own.meta.id !== (anc.filter(C.isProject).slice(-1)[0] || {}).meta?.id ? '（継承の後継に着地）' : ''),
              );
            if (preds.length) out.push('前任:\n' + preds.map((x) => row(x, '  ')).join('\n'));
            if (succ) out.push(row(succ, '後継: '));
            out.push(`子 ${kids.length} 枚${kids.length ? ':' : ''}`);
            kids.forEach((x) => out.push(row(x, '  ')));
            return header() + out.join('\n');
          },
        );

        tool(
          'loom_update',
          'Change a Loom card front matter (status, priority, scheduled, title, parent, refs).',
          `<define_tag name="loom_update">
札の front matter を変える（読み直してから書く。デーモンの中で直列）。
Attributes:
  - id (required)
  - status / priority / scheduled / title / parent (optional): 変えるものだけ渡す
  - refs (optional): JSON の配列（例: ["data/x.md"]）
  - force (optional): status="review" のとき、レポートが無くても回す
Note: status="review" は「確認へ回す」と同じ（レポートが無ければ回さずに理由を返す。親へは運ばない）。
      🔴 status="done" は受け付けない —— done は山内さんの一手で、親へ運ぶ引き金でもある。
</define_tag>`,
          async (ctx) => {
            const { a } = attrsOf(ctx);
            if (!a.id) return '[Error] id が要ります';
            if (a.status === 'done')
              return '[Error] done は受け付けません（山内さんが画面の「確認したので完了にする」で行う。そのとき親へ運ばれる）';
            const patch = {};
            for (const k of ['priority', 'scheduled', 'title', 'parent']) if (a[k] != null) patch[k] = a[k];
            if (a.refs != null) {
              try {
                patch.refs = JSON.parse(a.refs);
                if (!Array.isArray(patch.refs)) throw new Error('配列ではない');
              } catch (e) {
                return '[Error] refs は JSON の配列で: ' + errMsg(e);
              }
            }
            const out = [];
            if (a.status === 'review') {
              const r = await Ops.complete({ id: a.id, force: truthy(a.force) });
              if (!r.ok) return `[Error] 確認へ回していません: ${r.reason}`;
              out.push(
                `status → review（レポート ${r.reports} 件・成果物${r.artifacts ? 'あり' : 'なし'}。親へは運んでいない）`,
              );
            } else if (a.status != null) patch.status = a.status;
            if (Object.keys(patch).length) {
              const r = await Ops.saveMeta({ id: a.id, patch });
              if (!r.ok) return `[Error] ${r.reason}`;
              for (const k of Object.keys(patch))
                out.push(`${k}: ${JSON.stringify(r.before[k] ?? null)} → ${JSON.stringify(patch[k])}`);
            }
            if (!out.length) return '[Error] 変えるものがありません';
            const n = byId(a.id);
            return `${a.id}「${n ? n.meta.title : ''}」\n` + out.join('\n');
          },
        );

        tool(
          'loom_append',
          'Append to a section of a Loom card, stamped with the current JST time by the daemon.',
          `<define_tag name="loom_append">
札の節に追記する。**日時はデーモンがいまの時刻（JST）で押す**。書いたあと読み直して行番号を返す。
Attributes:
  - id (required)
  - section (optional): 既定はタスクなら "進捗"、プロジェクトなら "履歴"。"確認事項"・"追加要望"・"計画"・"成果物" など
  - form (optional):
      "entry"（既定）… \`- <日時> <who>: <本文>\`
      "report"      … \`### レポート <日時>\`（タスク → 進捗）／\`### 総括 <日時>\`（プロジェクト → 履歴）の見出しを付けて本文を置く
      "addendum"    … 最後の自分のレポート／総括の**枠の中**へ \`- **追記 <日時> <who>**: <本文>\`
      "raw"         … 本文をそのまま（計画のチェックボックス・成果物の行。日時を付けない節に）
  - who (optional): 既定 "Itera"
  - status (optional): 同じ書き込みで状態も変える（例: 確認事項を書いて "blocked"）。done は不可
Content: 本文。
Note: 観測した時刻と書いた時刻が違うなら、本文に観測の時刻を書く（「**12:5x に見た**: …」）。押されるのは書いた時刻。
      レポートの中に「成果物」の枠を書かない（転記のとき札の ## 成果物 が付く）。
</define_tag>`,
          async (ctx) => {
            const { a, content } = attrsOf(ctx);
            if (!a.id) return '[Error] id が要ります';
            const r = await Ops.append({
              id: a.id,
              section: a.section,
              text: content,
              form: a.form,
              who: a.who,
              status: a.status,
            });
            if (!r.ok) return `[Error] ${r.reason}`;
            const v = r.verified;
            return (
              `${a.id} の ## ${r.section} に書いた（${r.stamp}${a.status ? `・status → ${r.status}` : ''}）。` +
              (v.ok
                ? `ファイルの ${v.from}〜${v.to} 行目（全 ${v.total} 行）で確認した`
                : '🔴 読み直しで見つからなかった。read_file で確かめること')
            );
          },
        );

        tool(
          'loom_create',
          'Create a Loom card (task under a project/task, or a sub-project). The daemon allocates the id.',
          `<define_tag name="loom_create">
札を起こす。**id はデーモンが採番する**（写しとディレクトリの両方を数え、衝突したら番号を上げる）。親の側にも出来事を 1 行書く
（プロジェクトの下のタスク → 親の履歴に「起票」／タスクの下 → 親の進捗に「分解」／プロジェクトの下のプロジェクト → 「分岐」を両側に）。
Attributes:
  - parent (required for task): 親の id
  - title (required): 題（仮の題を焼き付けないため必須）
  - kind (optional): "task"（既定）| "project"
  - status (optional): タスクの既定は "todo"（私が起こす札は私のボール）。山内さんに渡すなら "inbox"
  - priority / scheduled (optional)
Content: タスクなら ## 依頼 の本文。プロジェクトでは受け付けない（## 意図 は山内さんが置く）。
</define_tag>`,
          async (ctx) => {
            const { a, content } = attrsOf(ctx);
            if (!a.title) return '[Error] title が要ります';
            const kind = a.kind === 'project' ? 'project' : 'task';
            if (kind === 'project' && content.trim())
              return '[Error] プロジェクトの本文（意図）は受け付けません。意図は山内さんが置く';
            const r = await Ops.create({
              kind,
              parent: a.parent,
              title: a.title,
              status: a.status || (kind === 'task' ? 'todo' : 'live'),
              priority: a.priority,
              scheduled: a.scheduled,
              request: content,
            });
            if (!r.ok) return `[Error] ${r.reason}`;
            return `${r.id}「${a.title}」を起こした — ${r.path}（親 ${a.parent || '無し'} に出来事を 1 行）`;
          },
        );

        tool(
          'loom_status',
          'Report the state of the Loom daemon (index, stubs, unreadable files).',
          `<define_tag name="loom_status">
Loom デーモンの状態（写しの枚数・本文を持っている枚数・stub・読めないファイル・最後の突き合わせ）。
Attributes:
  - selftest (optional): "true" で核（system/lib/loom_core.js）の自己試験も走らせる
  - reconcile (optional): "true" で返す前にディレクトリと突き合わせ直す（stub も全部取りに行く）
</define_tag>`,
          async (ctx) => {
            const { a } = attrsOf(ctx);
            let rc = null;
            if (truthy(a.reconcile)) rc = await reconcile({ fill: true, fetchStubs: true });
            const s = statusObj();
            const lines = [
              `札 ${s.cards} 枚（本文を持っている ${s.loaded}・stub ${s.stubs}・中身をまだ取れていない ${s.pendingFetch}）`,
              `読めないファイル ${s.skips.length} 件${s.skips.length ? ': ' + s.skips.map((x) => x.path + '（' + x.why + '）').join(' / ') : ''}`,
              `rev ${s.rev}・起動 ${s.bootMs}ms・最後の突き合わせ ${s.lastReconcile || '—'}・写しの保存 ${s.lastSaved || '—'}（${INDEX_PATH}）`,
            ];
            if (rc)
              lines.push(
                `突き合わせ直した: 読んだ ${rc.read}・stub を取った ${rc.fetchedStubs}・残り ${rc.pendingStubs}`,
              );
            if (s.lastError) lines.push('最後のエラー: ' + s.lastError);
            if (truthy(a.selftest)) {
              const t = C.selfTest();
              lines.push(
                `自己試験: ${t.pass} 通過・${t.fail} 失敗${t.fail ? ' — ' + t.results.map((r) => r.name).join(' / ') : ''}`,
              );
            }
            return lines.join('\n');
          },
        );

        // ------------------------------------------------------------
        // 起動
        // ------------------------------------------------------------
        const t0 = Date.now();
        const restored = await loadIndex();
        try {
          await reconcile();
        } catch (e) {
          lastError = '初回の突き合わせに失敗: ' + errMsg(e);
        }
        bootMs = Date.now() - t0;

        if (WITH_TOOLS) {
          for (const t of TOOLS) {
            try {
              await M.tools.register({
                name: t.name,
                description: t.description,
                definition: t.definition,
                handler: t.handler,
              });
            } catch (e) {
              console.warn('[loom] 道具を登録できませんでした: ' + t.name + ' ' + errMsg(e));
            }
          }
          M.ai.log(TOOLS.map((t) => t.definition).join('\n'), 'tool_available');
        }
        // 試験・診断用（inject_js から呼ぶ）。道具と同じ Ops を直接叩ける
        window.LoomDaemon = { Ops, TOOLS, reconcile, statusObj, cards, DIR, CH };

        // 本文を持っていない札（写しから復元しただけの札）を背後で埋める。stub は上限つき
        setTimeout(() => {
          reconcile({ fill: true }).catch((e) => (lastError = '本文の読み込みに失敗: ' + errMsg(e)));
        }, 500);
        setInterval(() => {
          reconcile({ fill: true }).catch((e) => (lastError = '突き合わせに失敗: ' + errMsg(e)));
        }, RECONCILE_EVERY_MS);

        try {
          M.system.broadcast(CH + '.ready', { rev });
        } catch (e) {}
        console.log(`[loom] 起動した。写しから ${restored} 枚・札 ${cards.size} 枚・${bootMs}ms`);

        window.addEventListener('unload', () => {
          if (!WITH_TOOLS) return; // 試験の実体が本物の道具を外さないように
          for (const t of TOOLS) {
            try {
              M.tools.unregister(t.name);
            } catch (e) {}
          }
        });
      })();
    </script>
  </body>
</html>
