<!doctype html>
<html lang="ja">
  <body>
    <script src="/system/lib/pdf_text.js"></script>
    <script>
      /**
       * PDF Tool Daemon — PDF を「ページ数を知る／ページを別の PDF に切り出す／ページを画像に／文字を取り出す」（T-0686 / T-0687）
       *
       * なぜ要るか:
       *   ホストの道具は「テキストを読む／ファイルを丸ごと添付する」だけで、PDF の分割を知らない。
       *   PDF を丸ごと添付すると全ページが AI の文脈に入る（40 ページなら 40 ページ分のクレジット）。
       *   形式ごとの処理（分割・変換）は VFS → VFS の道具としてゲストに置く。これはその最初の 1 つ。
       *
       * 使い方（AI）:
       *   常駐しない。要るときに spawn する（system/services/pdf_tool.html・pid pdf_tool）→ 道具が届く。
       *   pdf_info で全体を見る → pdf_extract で読むページだけの PDF に切り出す → attach_file で添付する
       *   （PDF のまま渡すと文字層が残る。LLM の API の多くは PDF の中の文字を読むので、画像にすると落ちる情報がある）。
       *   見た目が要るとき（図面・レイアウト・文字 0 のスキャン）だけ pdf_pages で PNG に。文字だけでよければ pdf_text。
       *   字形の埋め込みが無い PDF（CAD・積算ソフトの書き出し）は画像では名称が空白に見えるが、
       *   文字の流れは残っているので pdf_text で読める（pdf.js が CMap で符号を文字に戻す）。
       *
       * 仕組み:
       *   pdf.js はホストが同梱している（MetaOS.vendor.resolve('pdfjs')。vfs_root には置かない —— 4 MB が
       *   利用者全員の VFS に配信されてしまう）。文字の行組みは system/lib/pdf_text.js（純粋な部品）。
       *   pdf.js は読む・描く専用で PDF を書けないので、切り出し（pdf_extract）は pdf-lib（MetaOS.vendor.resolve('pdflib')・
       *   保守版 @cantoo/pdf-lib）で copyPages する。元のページの文字層・フォント・画像・ページ単位の注釈はそのまま写る。
       *   文書全体の栞（アウトライン）は写さない。
       *   外部のサービスには出さない。暗号化された PDF は扱わない。表の列の順（見た目）は保証しない。
       */
      (async () => {
        const M = window.MetaOS;
        const P = window.PdfText;
        const NAMES = ['pdf_info', 'pdf_extract', 'pdf_pages', 'pdf_text', 'pdf_to_text'];
        const MAX_PAGES_PER_CALL = 20;
        const DEFAULT_SIZE = 1568; // 長辺 px。Anthropic がこれより大きい画像を縮めるので、これ以上は無駄になる
        const MAX_SIZE = 4096;
        const log = (msg) => {
          console.log('[PdfTool] ' + msg);
          M.ai.log('[PdfTool Daemon] ' + msg, 'info', { silent: true });
        };

        let lib = null;
        async function pdfjs() {
          if (lib) return lib;
          // ホストの配置はホストに訊く（window.top.location を覗かない。T-0685）
          const v = await M.vendor.resolve('pdfjs');
          const mod = await import(v.entry);
          mod.GlobalWorkerOptions.workerSrc = v.worker;
          lib = { mod, url: v.url, version: v.version };
          return lib;
        }

        let pdflibMod = null;
        async function pdflib() {
          if (pdflibMod) return pdflibMod;
          const v = await M.vendor.resolve('pdflib');
          pdflibMod = await import(v.entry);
          return pdflibMod;
        }

        function basename(path) {
          const name = path.split('/').pop() || 'pdf';
          return name.replace(/\.pdf$/i, '');
        }
        function dirname(path) {
          const i = path.lastIndexOf('/');
          return i < 0 ? '' : path.slice(0, i);
        }
        function join(dir, name) {
          return dir ? dir.replace(/\/+$/, '') + '/' + name : name;
        }
        function kb(bytes) {
          return (bytes / 1024).toFixed(bytes < 10240 ? 1 : 0) + ' KB';
        }
        function errText(e, path) {
          const m = e && e.message ? e.message : String(e);
          const name = e && e.name ? e.name : '';
          if (name === 'PasswordException' || name === 'EncryptedPDFError' || /password|encrypt/i.test(m))
            return '[Error] Encrypted PDF is not supported: ' + path;
          if (name === 'InvalidPDFException' || /invalid pdf/i.test(m))
            return '[Error] Not a readable PDF (corrupt or not a PDF): ' + path;
          return '[Error] ' + m;
        }

        /** PDF を開いて fn(doc) を走らせ、必ず閉じる */
        async function withDoc(path, fn) {
          if (!path) throw new Error('path is required');
          if (!/\.pdf$/i.test(path)) throw new Error('Not a PDF: ' + path);
          if (!(await M.fs.exists(path))) throw new Error('Not found: ' + path);
          const { mod, url } = await pdfjs();
          const data = await M.fs.read(path, { encoding: 'binary' });
          if (!data || !data.length) throw new Error('File is empty: ' + path);
          const bytes = data.length; // getDocument は data を worker へ移す（transfer）ので、あとでは 0 になる
          const task = mod.getDocument({
            data,
            cMapUrl: url + 'cmaps/',
            cMapPacked: true,
            standardFontDataUrl: url + 'standard_fonts/',
            isEvalSupported: false,
          });
          const doc = await task.promise;
          try {
            return await fn(doc, bytes);
          } finally {
            await task.destroy().catch(() => {});
          }
        }

        async function ensureDir(dir) {
          if (!dir) return;
          if (await M.fs.exists(dir)) return;
          await M.fs.mkdir(dir, { recursive: true });
        }

        async function countChars(page) {
          const content = await page.getTextContent();
          return content.items.reduce((a, it) => a + (it.str ? it.str.trim().length : 0), 0);
        }

        // ---- pdf_info ----
        async function info(p) {
          const path = String(p.path || '').trim();
          return withDoc(path, async (doc, bytes) => {
            const n = doc.numPages;
            const pages = p.pages ? P.parsePages(p.pages, n) : P.parsePages('all', n);
            const lines = [];
            let withText = 0;
            let total = 0;
            for (const i of pages) {
              const page = await doc.getPage(i);
              const vp = page.getViewport({ scale: 1 });
              const chars = await countChars(page);
              if (chars > 0) withText++;
              total += chars;
              lines.push(
                '  p.' + i + ': ' + Math.round(vp.width) + '×' + Math.round(vp.height) + ' pt, ' + chars + ' chars',
              );
              page.cleanup();
            }
            let msg = path + ': ' + n + ' pages, ' + kb(bytes) + ' (pdf.js ' + lib.version + ')\n';
            msg +=
              'Pages with text: ' +
              withText +
              ' / without text (image only, probably a scan): ' +
              (pages.length - withText) +
              ', ' +
              total.toLocaleString() +
              ' chars in total\n';
            msg += lines.join('\n');
            msg +=
              '\nNext: pick the pages to read and use pdf_extract (those pages as a smaller PDF → attach_file; the text layer survives). ' +
              'Use pdf_pages (images) only when the look matters, pdf_text when plain text is enough. Attaching the whole file costs all ' +
              n +
              ' pages.';
            return msg;
          });
        }

        // ---- pdf_extract ----
        async function extract(p) {
          const path = String(p.path || '').trim();
          if (!path) throw new Error('path is required');
          if (!/\.pdf$/i.test(path)) throw new Error('Not a PDF: ' + path);
          if (!(await M.fs.exists(path))) throw new Error('Not found: ' + path);
          const data = await M.fs.read(path, { encoding: 'binary' });
          if (!data || !data.length) throw new Error('File is empty: ' + path);
          const { PDFDocument } = await pdflib();
          // 暗号化された PDF は断る（pdf.js と同じ扱い。ignoreEncryption で無理に開くと壊れた写しができる）
          const src = await PDFDocument.load(data, { ignoreEncryption: false, updateMetadata: false });
          const n = src.getPageCount();
          const pages = P.parsePages(p.pages, n);
          if (pages.length === n && !p.out)
            throw new Error(
              'All ' + n + ' pages were requested; nothing to extract. Use attach_file on the original PDF instead.',
            );
          const out = String(
            p.out || join('system/temp/pdf/' + basename(path), basename(path) + '_' + P.pagesLabel(pages) + '.pdf'),
          );
          if (!/\.pdf$/i.test(out)) throw new Error('out must end with .pdf: ' + out);
          const dst = await PDFDocument.create();
          const copied = await dst.copyPages(
            src,
            pages.map((i) => i - 1),
          );
          for (const pg of copied) dst.addPage(pg);
          const title = src.getTitle();
          if (title) dst.setTitle(title + ' (' + P.pagesLabel(pages) + ')');
          const bytes = await dst.save({ useObjectStreams: true });
          await ensureDir(dirname(out));
          await M.fs.write(out, bytes, { overwrite: true });
          let msg =
            'Wrote: ' +
            out +
            ' (' +
            pages.length +
            ' of ' +
            n +
            ' pages, ' +
            kb(bytes.length) +
            '; source ' +
            kb(data.length) +
            ')\n';
          msg += 'Pages: ' + pages.join(', ') + ' (original numbering)\n';
          msg +=
            'Next: attach_file this PDF (text layer and images included; the attachment costs ' +
            pages.length +
            ' pages). Use pdf_pages only when you need the look of a page.';
          return msg;
        }

        // ---- pdf_pages ----
        async function render(p) {
          const path = String(p.path || '').trim();
          const format = String(p.format || 'png').toLowerCase() === 'jpeg' ? 'jpeg' : 'png';
          let size = parseInt(p.size, 10);
          if (!Number.isFinite(size) || size < 64) size = DEFAULT_SIZE;
          if (size > MAX_SIZE) size = MAX_SIZE;
          return withDoc(path, async (doc) => {
            const pages = P.parsePages(p.pages, doc.numPages);
            if (pages.length > MAX_PAGES_PER_CALL) {
              throw new Error(
                'Too many pages (' +
                  pages.length +
                  '). At most ' +
                  MAX_PAGES_PER_CALL +
                  ' per call. Split the pages or narrow them down.',
              );
            }
            const out = String(p.out || join('system/temp/pdf/' + basename(path), '')).replace(/\/+$/, '');
            await ensureDir(out);
            const written = [];
            for (const i of pages) {
              const page = await doc.getPage(i);
              const vp1 = page.getViewport({ scale: 1 });
              const scale = size / Math.max(vp1.width, vp1.height);
              const vp = page.getViewport({ scale });
              const canvas = document.createElement('canvas');
              canvas.width = Math.round(vp.width);
              canvas.height = Math.round(vp.height);
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#fff';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              await page.render({ canvasContext: ctx, viewport: vp }).promise;
              const blob = await new Promise((res, rej) =>
                canvas.toBlob(
                  (b) => (b ? res(b) : rej(new Error('Could not encode the image'))),
                  'image/' + format,
                  0.85,
                ),
              );
              const file = join(out, 'p' + String(i).padStart(3, '0') + '.' + format);
              await M.fs.write(file, blob, { overwrite: true });
              written.push({ i, file, w: canvas.width, h: canvas.height, bytes: blob.size });
              page.cleanup();
              canvas.width = 0;
              canvas.height = 0;
            }
            let msg = 'Wrote: ' + written.length + ' image(s) → ' + out + '/ (of ' + doc.numPages + ' pages)\n';
            msg += written
              .map((w) => '  p.' + w.i + ': ' + w.file + ' (' + w.w + '×' + w.h + ', ' + kb(w.bytes) + ')')
              .join('\n');
            msg += '\nNext: attach only the images of the pages you read (one at a time, not all at once).';
            return msg;
          });
        }

        // ---- pdf_text ----
        async function text(p, spec) {
          const path = String(p.path || '').trim();
          const form = p.form === 'items' ? 'items' : 'lines';
          return withDoc(path, async (doc) => {
            const pages = P.parsePages(spec == null ? 'all' : spec, doc.numPages);
            const out = String(p.out || path.replace(/\.pdf$/i, '.txt'));
            const parts = [];
            for (const i of pages) {
              const page = await doc.getPage(i);
              const viewport = page.getViewport({ scale: 1 });
              const content = await page.getTextContent();
              const lines =
                form === 'items'
                  ? P.itemsWithPositions(content.items, viewport.transform)
                  : P.itemsToLines(content.items, viewport.transform);
              const chars = content.items.reduce((a, it) => a + (it.str ? it.str.trim().length : 0), 0);
              parts.push({ i, chars, text: P.renderPage(i, lines) });
              page.cleanup();
            }
            const body = parts.map((x) => x.text).join('\n');
            await M.fs.write(out, body, { overwrite: true });
            const chars = parts.reduce((a, x) => a + x.chars, 0);
            const empty = parts.filter((x) => x.chars === 0).map((x) => x.i);
            let msg =
              'Wrote: ' +
              out +
              ' (' +
              parts.length +
              ' of ' +
              doc.numPages +
              ' pages, ' +
              chars.toLocaleString() +
              ' chars)\n';
            msg += 'Chars per page: ' + parts.map((x) => 'p.' + x.i + ':' + x.chars).join(' ');
            if (empty.length)
              msg +=
                '\nPages without text (image only, probably a scan; render them with pdf_pages): ' + empty.join(', ');
            if (String(p.preview) === 'true') msg += '\n\n--- head ---\n' + body.slice(0, 1500);
            return msg;
          });
        }

        const defs = [
          '<define_tag name="pdf_info">',
          'PDF overview: page count, file size, and per-page dimensions and text character counts. Call this first (attaching the whole file costs every page).',
          'Attributes:',
          '  - path (required): PDF in the VFS',
          '  - pages (optional): pages to inspect (e.g. "3-5"; default all)',
          'Returns: page count, file size, and per page "W×H pt, N chars". A page with 0 chars is image only (a scan).',
          '</define_tag>',
          '<define_tag name="pdf_extract">',
          'Writes selected pages of a PDF as a new, smaller PDF in the VFS. Attach that file with attach_file: the text layer, fonts and images survive (rendering to images loses the text). The default route for reading part of a large PDF.',
          'Attributes:',
          '  - path (required): PDF in the VFS',
          '  - pages (required): "3" / "3-5" / "1,4,7-9" (1-based; out-of-range is refused; for all pages attach the original instead)',
          '  - out (optional): output path (.pdf). Default system/temp/pdf/<name>/<name>_p003-005.pdf (cleared on session reset; write to the user area to keep it)',
          'Returns: "Wrote: <out> (n of N pages, size)". Encrypted PDFs are refused. The document outline (bookmarks) is not copied.',
          'Note: an attachment costs by page count; extract only the pages you need.',
          '</define_tag>',
          '<define_tag name="pdf_pages">',
          'Renders selected pages of a PDF to images (PNG / JPEG) in the VFS. For when the look matters (drawings, layout, scans with 0 chars). To read text, prefer pdf_extract or pdf_text.',
          'Attributes:',
          '  - path (required): PDF in the VFS',
          '  - pages (required): "3" / "3-5" / "1,4,7-9" / "all" (1-based; out-of-range is refused). At most 20 per call',
          '  - out (optional): output directory. Default system/temp/pdf/<name>/ (cleared on session reset; write to the user area to keep it)',
          '  - size (optional): long edge in px. Default 1568 (larger images are downscaled by the model). Max 4096',
          '  - format (optional): "png" (default) | "jpeg" (smaller for photos and scans)',
          'Returns: the list of files written (p003.png form, dimensions, size).',
          '</define_tag>',
          '<define_tag name="pdf_text">',
          'Extracts the text of a PDF into a .txt (processed on this device; nothing is sent out).',
          'PDFs without embedded glyphs (CAD / estimating software exports) show blank names when rendered, but their text is readable this way. Scans (0 chars) cannot be read → pdf_pages.',
          'Attributes:',
          '  - path (required): PDF in the VFS',
          '  - pages (optional): e.g. "3-5" (default all)',
          '  - out (optional): output path. Default: path with the extension changed to .txt',
          '  - form (optional): "lines" (default; fragments arranged into lines by position) | "items" (one fragment per line as "y<TAB>x<TAB>text", for rebuilding table columns or two-tier rows yourself)',
          '  - preview (optional): "true" to include the first 1500 chars in the result',
          'Returns: "Wrote: <out> (...)" and chars per page. The output has a "--- p.N ---" heading per page. Column order of tables (as seen) is not guaranteed. Encrypted PDFs are refused.',
          'Note: to verify a reading, read only the page in question (do not re-read everything).',
          '</define_tag>',
        ].join('\n');

        const guard = (fn) => async (params) => {
          const p = params || {};
          try {
            return await fn(p);
          } catch (e) {
            return errText(e, String(p.path || ''));
          }
        };

        M.tools.register({
          name: 'pdf_info',
          description: 'PDF overview: page count, size, per-page dimensions and text char counts.',
          definition: defs,
          handler: guard(info),
        });
        M.tools.register({
          name: 'pdf_extract',
          description:
            'Extract selected pages of a PDF into a new smaller PDF (pdf-lib, in-browser). Attach that with attach_file to keep the text layer.',
          definition: defs,
          handler: guard(extract),
        });
        M.tools.register({
          name: 'pdf_pages',
          description: 'Render selected PDF pages to PNG/JPEG files in the VFS (pdf.js, in-browser).',
          definition: defs,
          handler: guard(render),
        });
        M.tools.register({
          name: 'pdf_text',
          description: 'Extract text from selected PDF pages into a .txt (pdf.js, in-browser, no external service).',
          definition: defs,
          handler: guard((p) => text(p, p.pages)),
        });
        // 旧名（T-0681 の pdf_to_text。from / to）。しばらく残す
        M.tools.register({
          name: 'pdf_to_text',
          description: 'Alias of pdf_text (from / to instead of pages).',
          definition:
            '<define_tag name="pdf_to_text">Old name of pdf_text (from / to for the page range). Use pdf_text for new calls. Returns: same as pdf_text.</define_tag>',
          handler: guard((p) => {
            const a = parseInt(p.from, 10);
            const b = parseInt(p.to, 10);
            const spec =
              Number.isFinite(a) || Number.isFinite(b)
                ? (Number.isFinite(a) ? a : '') + '-' + (Number.isFinite(b) ? b : '')
                : 'all';
            return text(p, spec);
          }),
        });

        M.ai.log(defs, 'tool_available');
        log('Started (pdf_info / pdf_extract / pdf_pages / pdf_text).');
        window.addEventListener('unload', () => {
          for (const n of NAMES) M.tools.unregister(n);
        });
      })();
    </script>
  </body>
</html>
