<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>LPML Renderer Regex Test</title>
<style>
  body { font-family: ui-monospace, monospace; background:#12141a; color:#e6e6e6; padding:16px; font-size:13px; }
  h1 { font-size:15px; margin:0 0 4px; }
  p.sub { color:#8b93a7; margin:0 0 14px; font-size:11px; }
  table { border-collapse:collapse; width:100%; margin-bottom:18px; }
  th, td { border:1px solid #2c3040; padding:5px 8px; text-align:left; vertical-align:top; }
  th { background:#1b1f2a; font-size:11px; text-transform:uppercase; }
  .pass { color:#4ade80; font-weight:bold; }
  .fail { color:#f87171; font-weight:bold; }
  .old  { color:#fbbf24; }
  .summary { padding:10px 12px; border-radius:6px; margin-bottom:14px; font-weight:bold; }
  .ok { background:rgba(74,222,128,.12); border:1px solid #4ade80; color:#4ade80; }
  .ng { background:rgba(248,113,113,.12); border:1px solid #f87171; color:#f87171; }
  code { color:#93c5fd; }
</style>
</head>
<body>
<h1>LPML Renderer 正規表現 検証</h1>
<p class="sub">修正後(NEW)と修正前(OLD)のタグ検出結果を比較する。OLD が FAIL になるケースが、実際にチャット表示を崩していたもの。</p>
<div id="summary"></div>
<div id="out"></div>

<script>
var TAG_NAME_PATTERN = '[a-zA-Z0-9_\\-]+';

// ===== NEW: 引用符を認識する属性パターン（LpmlRenderer.ts と同一） =====
var ATTR_PART = '\\s+[^"\'/=\\s]+(?:=(?:"(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\'|[^\\s&]+))?';
var ATTRS_PATTERN = '((?:' + ATTR_PART + ')*\\s*)';

function newRegex() {
  return new RegExp(
    '&lt;(' + TAG_NAME_PATTERN + ')' + ATTRS_PATTERN + '&gt;([\\s\\S]*?)&lt;\\/\\1&gt;|' +
    '&lt;(' + TAG_NAME_PATTERN + ')' + ATTRS_PATTERN + '\\/&gt;',
    'g'
  );
}

// ===== OLD: [^&]* （& を跨げない） =====
function oldRegex() {
  return new RegExp(
    '&lt;(' + TAG_NAME_PATTERN + ')([^&]*)&gt;([\\s\\S]*?)&lt;\\/\\1&gt;|' +
    '&lt;(' + TAG_NAME_PATTERN + ')([^&]*)\\/&gt;',
    'g'
  );
}

function escape(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// タグ全体が1マッチで消費されたかを判定する
function analyze(regex, raw) {
  var safe = escape(raw);
  regex.lastIndex = 0;
  var m = regex.exec(safe);
  if (!m) return { ok:false, name:null, attrs:null };
  var consumedAll = (m.index === 0 && m[0].length === safe.length);
  return { ok: consumedAll, name: m[1] || m[4], attrs: (m[2] || m[5] || '').trim() };
}

function getAttrNew(attributes, key) {
  var m = attributes.match(new RegExp('(?:^|\\s)' + key + '=(?:"([^"]*)"|\'([^\']*)\'|([^\\s]+))'));
  if (!m) return null;
  return m[1] !== undefined ? m[1] : (m[2] !== undefined ? m[2] : m[3]);
}
function getAttrOld(attributes, key) {
  var m = attributes.match(new RegExp(key + '=["\']?([^"\'\\s]+)["\']?'));
  return m ? m[1] : null;
}

// 注意: 文字列中に create_file の閉じタグを直接書くと、この HTML を
// create_file で書き出す際に本文がそこで打ち切られる（実際に一度やらかした）。
var CLOSE_CREATE = '<' + '/create_file>';

var cases = [
  { label:'通常の自己完結タグ',     raw:'<yield />' },
  { label:'アロー関数 =>',          raw:'<search query="() => x" />' },
  { label:'AND演算子 &&',           raw:'<search regex="true" query="a && b" />' },
  { label:'HTMLタグ検索 <div',      raw:'<search query="<div class=" />' },
  { label:'パイプ |（従来もOK）',    raw:'<search query="a|b" />' },
  { label:'tool_output(内容あり)',   raw:'<tool_output action="search" status="success" query="() => x">RESULT</tool_output>' },
  { label:'内容ありタグ',            raw:'<report>こんにちは</report>' },
  { label:'空白を含むpath',          raw:'<create_file path="my file.txt">body' + CLOSE_CREATE },
  { label:'負のインデックス',        raw:'<read_file path="a.ts" start="-50" />' }
];

var html = '<table><tr><th>ケース</th><th>入力</th><th>NEW</th><th>OLD</th><th>抽出したタグ名 / 属性</th></tr>';
var newPass = 0, oldPass = 0;

cases.forEach(function (c) {
  var n = analyze(newRegex(), c.raw);
  var o = analyze(oldRegex(), c.raw);
  if (n.ok) newPass++;
  if (o.ok) oldPass++;
  html += '<tr>' +
    '<td>' + escape(c.label) + '</td>' +
    '<td><code>' + escape(c.raw) + '</code></td>' +
    '<td class="' + (n.ok ? 'pass' : 'fail') + '">' + (n.ok ? 'PASS' : 'FAIL') + '</td>' +
    '<td class="' + (o.ok ? 'pass' : 'fail') + '">' + (o.ok ? 'PASS' : 'FAIL') + '</td>' +
    '<td>' + (n.ok ? escape(n.name) + ' / ' + escape(n.attrs || '(なし)') : '-') + '</td>' +
    '</tr>';
});
html += '</table>';

var attrsSample = ' path="my file.txt"';
var mimeSample  = ' mimetype="image/png" type="info"';
html += '<table><tr><th>getAttr 検証</th><th>属性文字列</th><th>NEW</th><th>OLD</th></tr>';
html += '<tr><td>空白を含む値</td><td><code>' + escape(attrsSample.trim()) + '</code></td>' +
        '<td class="pass">' + escape(String(getAttrNew(attrsSample, 'path'))) + '</td>' +
        '<td class="old">' + escape(String(getAttrOld(attrsSample, 'path'))) + '</td></tr>';
html += '<tr><td>type が mimetype に誤マッチしないか</td><td><code>' + escape(mimeSample.trim()) + '</code></td>' +
        '<td class="pass">' + escape(String(getAttrNew(mimeSample, 'type'))) + '</td>' +
        '<td class="old">' + escape(String(getAttrOld(mimeSample, 'type'))) + '</td></tr>';
html += '</table>';

document.getElementById('out').innerHTML = html;

var allPass = (newPass === cases.length);
document.getElementById('summary').innerHTML =
  '<div class="summary ' + (allPass ? 'ok' : 'ng') + '">NEW: ' + newPass + '/' + cases.length +
  ' PASS &nbsp;|&nbsp; OLD: ' + oldPass + '/' + cases.length + ' PASS' +
  (allPass ? ' — 修正は期待どおり機能している' : ' — 修正に問題がある') + '</div>';

window.__TEST_RESULT__ = { newPass: newPass, oldPass: oldPass, total: cases.length };
</script>
</body>
</html>
