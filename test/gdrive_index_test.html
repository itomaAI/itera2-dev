<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>gdrive_sync index logic test</title>
    <style>
      body { font-family: ui-monospace, monospace; padding: 16px; background: #111; color: #ddd; }
      .pass { color: #6f6; }
      .fail { color: #f66; font-weight: bold; }
      h2 { color: #9cf; margin-top: 24px; }
      pre { background: #1a1a1a; padding: 8px; overflow-x: auto; }
    </style>
  </head>
  <body>
    <h1>gdrive_sync.html — 索引ロジックの検証</h1>
    <div id="out">loading...</div>

    <script>
      /**
       * 実装をコピーせず、デーモンの「現物」を読み込んで検証する。
       *
       * コピーした関数を試験しても、コピー元が変わった瞬間に無意味になる。
       * ここでは gdrive_sync.html の <script> 本体をそのまま評価し、
       * 内部関数への参照を取り出して呼ぶ。
       */

      const SOURCE = 'workspace/itera2-dev/vfs_root/system/services/gdrive_sync.html';

      const results = [];
      function check(name, actual, expected) {
        const a = JSON.stringify(actual);
        const e = JSON.stringify(expected);
        results.push({ name, ok: a === e, actual: a, expected: e });
      }

      async function loadDaemonInternals() {
        const html = await MetaOS.fs.read(SOURCE);

        const start = html.indexOf('<script>');
        const end = html.lastIndexOf('</' + 'script>');
        if (start === -1 || end === -1) throw new Error('Could not locate the script block');
        const body = html.substring(start + '<script>'.length, end);

        // init() は評価時に走るが、スタブの read が reject するため
        // 「設定が読めない」経路で静かに終わる。
        const stubMetaOS = {
          fs: {
            read: () => Promise.reject(new Error('stub')),
            write: () => Promise.resolve(),
            exists: () => Promise.resolve(false),
            mkdir: () => Promise.resolve(),
            listMounts: () => Promise.resolve([]),
            registerSyncProvider: () => Promise.resolve(),
            getSyncState: () => Promise.resolve({}),
          },
          net: { fetch: () => Promise.reject(new Error('stub')) },
        };

        const factory = new Function(
          'window',
          'MetaOS',
          'console',
          body +
            `
            return {
              derivePathMap,
              isExcluded,
              setMount: (m) => { mountPath = m; },
              setRoot: (r) => { rootFolderId = r; },
              setIndex: (i) => { index = i; },
              setForeign: (f) => { foreignMountPaths = f; },
            };
          `,
        );

        const quietConsole = { log: () => {}, warn: () => {}, error: () => {} };
        return factory({ MetaOS: stubMetaOS }, stubMetaOS, quietConsole);
      }

      function node(name, parents, kind, extra) {
        return Object.assign(
          { name, parents, kind, md5: kind === 'file' ? 'md5-' + name : null, size: 1, modifiedTime: 1000 },
          extra || {},
        );
      }

      async function run() {
        const M = await loadDaemonInternals();

        // ============================================================
        // 1. 除外ロジック（allowlist / 接頭辞の誤爆）
        // ============================================================
        M.setMount('');
        M.setRoot('ROOT');
        M.setForeign([]);

        check('exclude: system/credentials', M.isExcluded('system/credentials/gdrive.json'), true);
        check('exclude: system/temp', M.isExcluded('system/temp/gdrive_index.json'), true);
        check('exclude: system/logs', M.isExcluded('system/logs/a.jsonl'), true);
        check('exclude: trash', M.isExcluded('trash/x.txt'), true);
        check('allow:   system/config', M.isExcluded('system/config/gdrive.json'), false);
        check('allow:   system/registry', M.isExcluded('system/registry/apps.json'), false);
        check('allow:   system/themes', M.isExcluded('system/themes/dark.json'), false);
        check('exclude: system/apps (not allowlisted)', M.isExcluded('system/apps/settings.html'), true);
        check('allow:   data/', M.isExcluded('data/apps/tasks/2026-08.json'), false);

        // 接頭辞の部分一致で誤爆しないこと
        check('no false hit: system/configuration_backup.json', M.isExcluded('system/configuration_backup.json'), true);
        check('no false hit: trashcan/', M.isExcluded('trashcan/note.md'), false);
        check('no false hit: system/temporary_notes.md', M.isExcluded('system/temporary_notes.md'), true);

        // 他プロバイダの管轄
        M.setForeign(['share']);
        check('foreign mount: share/', M.isExcluded('share/org/a.md'), true);
        check('foreign mount: share itself', M.isExcluded('share'), true);
        check('no false hit: shared_notes/', M.isExcluded('shared_notes/a.md'), false);
        M.setForeign([]);

        // ============================================================
        // 2. パス導出（到達可能性・入れ子・圏外の破棄）
        // ============================================================
        M.setIndex({
          rootFolderId: 'ROOT',
          builtAt: Date.now(),
          pageToken: null,
          byId: {
            fA:   node('data', ['ROOT'], 'directory'),
            fB:   node('apps', ['fA'], 'directory'),
            f1:   node('tasks.json', ['fB'], 'file'),
            f2:   node('readme.md', ['ROOT'], 'file'),
            orph: node('orphan.md', ['UNKNOWN_PARENT'], 'file'),
            outs: node('outside.md', [], 'file'),
          },
        });

        let map = M.derivePathMap();
        check('derive: nested dir', map['data/apps'] && map['data/apps'].kind, 'directory');
        check('derive: nested file', map['data/apps/tasks.json'] && map['data/apps/tasks.json'].id, 'f1');
        check('derive: root-level file', map['readme.md'] && map['readme.md'].id, 'f2');
        check('derive: unreachable dropped', map['orphan.md'], undefined);
        check('derive: parentless dropped', map['outside.md'], undefined);
        check('derive: md5 carried', map['readme.md'] && map['readme.md'].md5, 'md5-readme.md');

        // ============================================================
        // 3. フォルダ改名で配下のパスが追随すること
        //    （パスを保存する実装ではここが壊れる）
        // ============================================================
        M.setIndex({
          rootFolderId: 'ROOT',
          builtAt: Date.now(),
          pageToken: null,
          byId: {
            fA: node('data_renamed', ['ROOT'], 'directory'),
            fB: node('apps', ['fA'], 'directory'),
            f1: node('tasks.json', ['fB'], 'file'),
          },
        });
        map = M.derivePathMap();
        check('rename: new path present', !!map['data_renamed/apps/tasks.json'], true);
        check('rename: old path gone', map['data/apps/tasks.json'], undefined);

        // ============================================================
        // 4. ゴミ箱に入ったフォルダの子は到達不能になり消えること
        //    （trashed=false の検索では親が返らない＝byId に無い）
        // ============================================================
        M.setIndex({
          rootFolderId: 'ROOT',
          builtAt: Date.now(),
          pageToken: null,
          byId: {
            f1: node('tasks.json', ['fB_TRASHED'], 'file'),
          },
        });
        map = M.derivePathMap();
        check('trashed parent: child dropped', Object.keys(map).length, 0);

        // ============================================================
        // 5. 同名重複は決定的に 1 つへ寄せること
        // ============================================================
        M.setIndex({
          rootFolderId: 'ROOT',
          builtAt: Date.now(),
          pageToken: null,
          byId: {
            dupA: node('same.md', ['ROOT'], 'file', { modifiedTime: 1000 }),
            dupB: node('same.md', ['ROOT'], 'file', { modifiedTime: 2000 }),
          },
        });
        map = M.derivePathMap();
        check('duplicate: single entry', Object.keys(map).length, 1);
        check('duplicate: newer wins', map['same.md'].id, 'dupB');

        // 同着のときも順不同で結果が揺れないこと
        M.setIndex({
          rootFolderId: 'ROOT',
          builtAt: Date.now(),
          pageToken: null,
          byId: {
            zzz: node('tie.md', ['ROOT'], 'file', { modifiedTime: 5000 }),
            aaa: node('tie.md', ['ROOT'], 'file', { modifiedTime: 5000 }),
          },
        });
        map = M.derivePathMap();
        check('duplicate tie: deterministic (higher id)', map['tie.md'].id, 'zzz');

        // ============================================================
        // 6. 除外領域はリモートに在っても降りてこないこと
        // ============================================================
        M.setIndex({
          rootFolderId: 'ROOT',
          builtAt: Date.now(),
          pageToken: null,
          byId: {
            sc: node('system', ['ROOT'], 'directory'),
            cr: node('credentials', ['sc'], 'directory'),
            tk: node('github.json', ['cr'], 'file'),
            cf: node('config', ['sc'], 'directory'),
            ok: node('llm.json', ['cf'], 'file'),
          },
        });
        map = M.derivePathMap();
        check('remote credentials not pulled', map['system/credentials/github.json'], undefined);
        check('remote config pulled', !!map['system/config/llm.json'], true);

        // ============================================================
        // 7. 部分木マウント（mountPath = "drive"）でも成立すること
        // ============================================================
        M.setMount('drive');
        M.setIndex({
          rootFolderId: 'ROOT',
          builtAt: Date.now(),
          pageToken: null,
          byId: {
            d1: node('notes', ['ROOT'], 'directory'),
            d2: node('a.md', ['d1'], 'file'),
          },
        });
        map = M.derivePathMap();
        check('subtree mount: prefixed', !!map['drive/notes/a.md'], true);
        check('subtree mount: no bare path', map['notes/a.md'], undefined);

        // ============================================================
        // 描画
        // ============================================================
        const passed = results.filter((r) => r.ok).length;
        const failed = results.filter((r) => !r.ok);

        let html = `<h2>${passed} / ${results.length} passed</h2>`;
        html += results
          .map(
            (r) =>
              `<div class="${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'} — ${r.name}` +
              (r.ok ? '' : `<pre>expected: ${r.expected}\nactual:   ${r.actual}</pre>`) +
              `</div>`,
          )
          .join('');
        document.getElementById('out').innerHTML = html;

        await MetaOS.fs.write(
          'system/temp/gdrive_index_test_result.json',
          JSON.stringify({ total: results.length, passed, failed }, null, 2),
          { overwrite: true },
        );
      }

      const boot = () => {
        if (!window.MetaOS) return setTimeout(boot, 100);
        run().catch((e) => {
          document.getElementById('out').innerHTML =
            `<div class="fail">Harness error: ${e.message}</div><pre>${e.stack || ''}</pre>`;
          MetaOS.fs.write(
            'system/temp/gdrive_index_test_result.json',
            JSON.stringify({ harnessError: e.message, stack: e.stack }, null, 2),
            { overwrite: true },
          );
        });
      };
      boot();
    </script>
  </body>
</html>
